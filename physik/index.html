 text:p=>`Ein Fahrzeug mit der Gewichtskraft ${f('F_1 = '+p.F1+' kN')} hebt einen Container mit ${f('F_2 = '+p.F2+' kN')} an. Der Radstand ist ${l('l = '+p.l+' mm')}. F_1 greift ${l(p.d+' mm')} vor der Hinterachse B an. Der Container hängt ${l(p.c+' mm')} hinter der Hinterachse. Wie gross sind die Belastungen F_A (Vorderräder) und F_B (Hinterräder)?`+BW(p),
 asks:p=>{const FA=(p.F1*p.d-p.F2*p.c)/p.l;return [{k:'F_A',unit:'kN',v:FA},{k:'F_B',unit:'kN',v:p.F1+p.F2-FA}];},
 hints:p=>['Wähle den Drehpunkt in B (Hinterachse). Dann fällt F_B weg.','Um B drehen F_1 und F_2 in verschiedene Richtungen. F_2 hängt auf der anderen Seite von B.','F_A · l + F_2 · '+p.c+' mm = F_1 · '+p.d+' mm. Danach F_B = F_1 + F_2 − F_A.'],
 sol:p=>{const FA=(p.F1*p.d-p.F2*p.c)/p.l;return [`Drehpunkt in B. Ersatzbild: Träger mit überstehendem Ende.`,`ΣM_l = ΣM_r: ${eq(f('F_A')+' · '+p.l+' mm + '+f('F_2')+' · '+p.c+' mm = '+f('F_1')+' · '+p.d+' mm')}`,`${eq(f('F_A')+' = ('+p.F1+' kN · '+p.d+' − '+p.F2+' kN · '+p.c+') : '+p.l+' = '+f(fmt(FA,3)+' kN'))}`,`${eq(f('F_B')+' = '+p.F1+' kN + '+p.F2+' kN − '+fmt(FA,3)+' kN = '+f(fmt(p.F1+p.F2-FA,3)+' kN'))}`,'Die Vorderräder werden stark entlastet. Wäre der Container schwerer, würde das Fahrzeug vorn abheben.'];}},
{id:'b8',lvl:3,title:'Laufkran mit zwei Stellungen',
 gen:bk({F1:12,F2:60,F3:20,L:10,x1:3.5,xg:4.6,x2:6.8},()=>({F1:rng(8,20,1),F2:pick([50,60,70]),F3:pick([15,20,25]),L:10,x1:pick([2.5,3,3.5]),xg:pick([4.6,5]),x2:pick([6.8,7.5,8])})),
 draw:p=>drawBeam({l:p.L,loads:[{x:p.x1,F:p.F1+p.F3,lab:`F_1 + F_3 = ${p.F1+p.F3} kN`,anc:1},{x:p.xg,F:p.F2,lab:`F_2 = ${p.F2} kN`}]},{segs:[`${fmt(p.x1)} m`,'',''],ex:[p.xg,`${fmt(p.xg)} m`],tot:`l = ${p.L} m`}),
 text:p=>`Ein Laufkran mit der Spannweite ${l('l = '+p.L+' m')} hebt die Last ${f('F_1 = '+p.F1+' kN')}. Die Laufkatze hat ${f('F_3 = '+p.F3+' kN')}. Sie trägt die Last an derselben Stelle. Die Kranbrücke hat ${f('F_2 = '+p.F2+' kN')} im Abstand ${l(fmt(p.xg)+' m')} von A. Berechnen Sie F_A und F_B a) mit der Laufkatze bei ${l(fmt(p.x1)+' m')} und b) bei ${l(fmt(p.x2)+' m')} von A.`+BW(p),
 asks:p=>{const G=p.F1+p.F3,B1=(G*p.x1+p.F2*p.xg)/p.L,B2=(G*p.x2+p.F2*p.xg)/p.L,T=G+p.F2;return [{k:'a) F_A',unit:'kN',v:T-B1},{k:'a) F_B',unit:'kN',v:B1},{k:'b) F_A',unit:'kN',v:T-B2},{k:'b) F_B',unit:'kN',v:B2}];},
 hints:p=>['Last und Laufkatze greifen an derselben Stelle an. Fasse sie zusammen: F_1 + F_3.','Drehpunkt in A: F_B · l = (F_1 + F_3) · x + F_2 · '+fmt(p.xg)+' m','Rechne zweimal: einmal mit x = '+fmt(p.x1)+' m, einmal mit x = '+fmt(p.x2)+' m. F_A = Summe aller Lasten − F_B.'],
 sol:p=>{const G=p.F1+p.F3,T=G+p.F2,B1=(G*p.x1+p.F2*p.xg)/p.L,B2=(G*p.x2+p.F2*p.xg)/p.L;return [`Zusammenfassen: ${eq(p.F1+' kN + '+p.F3+' kN = '+G+' kN')}. Summe aller Lasten: ${eq(T+' kN')}`,`a) ${eq(f('F_B')+' = ('+G+' kN · '+fmt(p.x1)+' m + '+p.F2+' kN · '+fmt(p.xg)+' m) : '+p.L+' m = '+f(fmt(B1,3)+' kN'))}, ${eq(f('F_A')+' = '+T+' − '+fmt(B1,3)+' = '+f(fmt(T-B1,3)+' kN'))}`,`b) ${eq(f('F_B')+' = ('+G+' kN · '+fmt(p.x2)+' m + '+p.F2+' kN · '+fmt(p.xg)+' m) : '+p.L+' m = '+f(fmt(B2,3)+' kN'))}, ${eq(f('F_A')+' = '+T+' − '+fmt(B2,3)+' = '+f(fmt(T-B2,3)+' kN'))}`,'Fährt die Laufkatze nach rechts, wird B stärker und A schwächer belastet. Die Summe bleibt gleich.'];}}

/* ---------- Lagerkräfte: Buch-Beispiele und eigene Varianten ---------- */
function drawKrafteck(p,st){const s=mkSvg(260),k=170/Math.max(p.F1,p.F2),A=[170,50],E1=[A[0]+p.F1*k,A[1]],E=[E1[0],A[1]+p.F2*k];
  s.append(el('circle',{cx:A[0],cy:A[1],r:5,fill:'#a9cbee',stroke:'#2b4c7e'}));txt(s,A[0]-12,A[1]+5,'A',{'font-weight':600,'text-anchor':'end'});
  force(s,A[0],A[1],E1[0],E1[1],`F_Ax = ${fmt(p.F1)} kN`,(A[0]+E1[0])/2,A[1]-10,{'text-anchor':'middle'});
  if(st>=1)force(s,E1[0],E1[1],E[0],E[1],`F_Ay = ${fmt(p.F2)} kN`,E[0]+10,(E1[1]+E[1])/2);
  if(st>=2){line(s,A[0],A[1],E[0],E[1],{stroke:CR,'stroke-width':4,'marker-end':'url(#aR)'});txt(s,(A[0]+E[0])/2-12,(A[1]+E[1])/2+14,st>=3?`F_A = ${fmt(Math.hypot(p.F1,p.F2),3)} kN`:'F_A',{fill:CR,'font-weight':600,'text-anchor':'end'});
    const a=Math.atan2(p.F2,p.F1);s.append(el('path',{d:`M${A[0]+50},${A[1]} A50,50 0 0 1 ${A[0]+50*Math.cos(a)},${A[1]+50*Math.sin(a)}`,fill:'none',stroke:INK}));txt(s,A[0]+58,A[1]+22,'α',{'font-size':14});}
  return s;}

 asks:p=>{const FB=(p.F1*p.l1+p.F2*p.l2)/p.l;return [{k:'F_A',unit:'kN',v:p.F1+p.F2-FB},{k:'F_B',unit:'kN',v:FB}];},
 hints:p=>['1. Schritt: Drehpunkt in A. 2. Schritt: F_B in B ansetzen.','3. Schritt: F_B · l = F_1 · l_1 + F_2 · l_2','4. Schritt: F_A = F_1 + F_2 − F_B'],
 sol:p=>{const FB=(p.F1*p.l1+p.F2*p.l2)/p.l;return [`1. und 2. Schritt: Drehpunkt in A, F_B in B ansetzen.`,`3. Schritt: ${eq('ΣM_l = ΣM_r')}, ${eq(f('F_B')+' · '+l('l')+' = '+f('F_1')+' · '+l('l_1')+' + '+f('F_2')+' · '+l('l_2'))}`,`${eq(f('F_B')+' = ('+fmt(p.F1)+' kN · '+p.l1+' mm + '+fmt(p.F2)+' kN · '+p.l2+' mm) : '+p.l+' mm = '+f(fmt(FB,3)+' kN'))}`,`4. Schritt: ${eq(f('F_A')+' = '+fmt(p.F1)+' kN + '+fmt(p.F2)+' kN − '+fmt(FB,3)+' kN = '+f(fmt(p.F1+p.F2-FB,3)+' kN'))}`];}},

const CTASKS=[
{id:'c1',lvl:2,src:KR.neu,title:'Sprungbrett im Schwimmbad',gen(){return {L:pick([3,3.5,4]),a:pick([1,1.2,1.5]),F:rng(600,1000,50)};},
 draw:p=>drawSprung(p),text:p=>`Ein Sprungbrett ist bei A am Boden festgeschraubt. Bei B liegt es auf einer Stütze. Am Brettende steht eine Person mit ${f('F = '+p.F+' N')}. Berechnen Sie a) die Kraft F_B auf die Stütze und b) die Kraft F_A in der Verschraubung. c) Überlege: Drückt oder zieht die Verschraubung?`,
 asks:p=>[{k:'a) F_B',unit:'N',v:p.F*p.L/p.a},{k:'b) F_A',unit:'N',v:p.F*(p.L-p.a)/p.a}],
 hints:p=>['Drehpunkt in A: F_B · a = F · L.','Die Person steht ausserhalb der Lager. Das Brett will bei A nach oben kippen.','F_A = F_B − F. Die Verschraubung muss das Brett nach unten ziehen.'],
 sol:p=>{const FB=p.F*p.L/p.a;return [`Drehpunkt in A: ${eq(f('F_B')+' · '+l(fmt(p.a)+' m')+' = '+f(p.F+' N')+' · '+l(fmt(p.L)+' m'))}`,`${eq(f('F_B')+' = '+p.F+' · '+fmt(p.L)+' : '+fmt(p.a)+' = '+f(fmt(FB)+' N'))}`,`Kräfte: Nach oben wirkt nur F_B. Nach unten wirken F und F_A. ${eq(f('F_A')+' = '+fmt(FB)+' − '+p.F+' = '+f(fmt(FB-p.F)+' N'))}`,`c) F_A wirkt nach unten. Die Verschraubung zieht das Brett also nach unten. Ohne sie würde das Brett hochklappen.`,`Merke: Die Stütze trägt hier ${fmt(FB/p.F,2)}-mal das Gewicht der Person. Ein Lager kann mehr tragen als die Last selbst.`];},
 solDraw:p=>drawSprung(p,{res:1})},
{id:'c2',lvl:3,src:KR.um,title:'Hallenkran: Wie weit darf die Katze fahren?',gen(){let r;do{const L=pick([10,12,16]),F2=pick([30,40,50]),F1=pick([50,80,100]),F3=pick([10,15,20]),xt=L*pick([0.7,0.75,0.8,0.85]);const FBm=Math.round((F2*L/2+(F1+F3)*xt)/L);r={L,F2,F1,F3,FBm,xg:L/2};r.x1=(FBm*L-F2*L/2)/(F1+F3);}while(r.x1>r.L-0.3||r.x1<r.L/2);return r;},
 draw:p=>drawHallenkran(p,{x1lab:'x = ?',FB:`F_B,max = ${p.FBm} kN`}),
 text:p=>`Die Kranbahn rechts (Lager B) darf höchstens mit ${f('F_B,max = '+p.FBm+' kN')} belastet werden. Die Kranbrücke (${l('l = '+p.L+' m')}) wiegt ${f('F_2 = '+p.F2+' kN')}. Ihr Schwerpunkt liegt in der Mitte. Die Laufkatze wiegt ${f('F_3 = '+p.F3+' kN')}, die Last ${f('F_1 = '+p.F1+' kN')}. a) Wie weit darf die Laufkatze von A wegfahren? b) Wie gross ist F_A in dieser Stellung?`,
 asks:p=>[{k:'a) x_max',unit:'m',v:p.x1},{k:'b) F_A',unit:'kN',v:p.F1+p.F2+p.F3-p.FBm}],
 hints:p=>['Das ist die Lagerkraft-Rechnung rückwärts: F_B ist bekannt, der Abstand x ist gesucht.','Drehpunkt in A: F_B,max · l = F_2 · '+fmt(p.L/2)+' m + (F_1 + F_3) · x','Nach x umstellen: x = (F_B,max · l − F_2 · l/2) : (F_1 + F_3)'],
 sol:p=>[`Drehpunkt in A. F_B ist jetzt gegeben, x ist gesucht.`,`${eq(f(p.FBm+' kN')+' · '+l(p.L+' m')+' = '+f(p.F2+' kN')+' · '+l(fmt(p.L/2)+' m')+' + '+f((p.F1+p.F3)+' kN')+' · '+l('x'))}`,`${eq(l('x')+' = ('+fmt(p.FBm*p.L)+' − '+fmt(p.F2*p.L/2)+') kN·m : '+(p.F1+p.F3)+' kN = '+l(fmt(p.x1,2)+' m'))}`,`b) ${eq(f('F_A')+' = '+p.F1+' + '+p.F2+' + '+p.F3+' − '+p.FBm+' = '+f(fmt(p.F1+p.F2+p.F3-p.FBm)+' kN'))}`,'Fährt die Katze weiter nach rechts, wird die Kranbahn B überlastet.'],
 solDraw:p=>drawHallenkran(p,{x1lab:`x = ${fmt(p.x1,2)} m`,FB:`F_B = ${p.FBm} kN`,FA:`F_A = ${fmt(p.F1+p.F2+p.F3-p.FBm)} kN`})},
{id:'c3',lvl:3,src:KR.komb,title:'Seilwinde: Masse, Drehmoment und Lagerkräfte',gen(){return {m:pick([200,300,400,500]),d:pick([160,200,250]),l:pick([600,800,1000]),a:pick([200,250,300])};},
 draw:p=>drawWindeW(p),text:p=>`Eine Seilwinde hebt eine Last mit ${'m = '+p.m+' kg'}. Die Seiltrommel hat ${l('d = '+p.d+' mm')}. Das Seil läuft im Abstand ${l('a = '+p.a+' mm')} vom Lager A ab. Die Lager A und B haben den Abstand ${l('l = '+p.l+' mm')}. Rechnen Sie mit g = 9,81 m/s². Berechnen Sie a) die Gewichtskraft F_G, b) das Drehmoment M, das der Motor liefern muss, und c) die Lagerkräfte F_A und F_B. Das Eigengewicht der Welle wird vernachlässigt.`,
 asks:p=>{const F=p.m*9.81;return [{k:'a) F_G',unit:'N',v:F},{k:'b) M',unit:'N·m',v:F*p.d/2000},{k:'c) F_A',unit:'N',v:F*(p.l-p.a)/p.l},{k:'c) F_B',unit:'N',v:F*p.a/p.l}];},
 hints:p=>['a) F_G = m · g','b) Die Seilkraft greift am Trommelumfang an. Hebelarm = d : 2, in m.','c) Für die Lager zählt nur, wo das Seil abläuft: Drehpunkt in A, F_B · l = F_G · a.'],
 sol:p=>{const F=p.m*9.81;return [`a) ${eq(f('F_G')+' = '+p.m+' kg · 9,81 m/s² = '+f(fmt(F)+' N'))}`,`b) ${eq(m('M')+' = '+f('F_G')+' · '+l('d : 2')+' = '+fmt(F)+' N · '+fmt(p.d/2000,3)+' m = '+m(fmt(F*p.d/2000)+' N·m'))}`,`c) Drehpunkt in A: ${eq(f('F_B')+' = '+fmt(F)+' · '+p.a+' : '+p.l+' = '+f(fmt(F*p.a/p.l)+' N'))}`,`${eq(f('F_A')+' = '+fmt(F)+' − '+fmt(F*p.a/p.l)+' = '+f(fmt(F*(p.l-p.a)/p.l)+' N'))}`,'Drei Themen in einer Aufgabe: Masse → Kraft, Kraft → Drehmoment, Kraft → Lagerkräfte.'];},
 solDraw:p=>{const F=p.m*9.81;return drawWindeW(p,{M:`M = ${fmt(F*p.d/2000)} N·m`,RA:`F_A = ${fmt(F*(p.l-p.a)/p.l)} N`,RB:`F_B = ${fmt(F*p.a/p.l)} N`});}},
{id:'c4',lvl:2,src:KR.fehl,title:'Wo steckt der Fehler?',gen(){return {l:pick([1200,1500,1800]),a:pick([400,500,600]),c:pick([300,400]),F1:rng(4,10,1),F2:rng(2,5,1)};},
 draw:p=>drawBeam({l:p.l,end:p.l+p.c,loads:[{x:p.a,F:p.F1,lab:`F_1 = ${p.F1} kN`,anc:1},{x:p.l+p.c,F:p.F2,lab:`F_2 = ${p.F2} kN`}]},{segs:[`${p.a}`,'',`c = ${p.c}`],tot:`l = ${p.l}`}),
 text:p=>{const FBf=(p.F1*p.a+p.F2*p.c)/p.l;return `Ein Lernender hat diese Lösung abgegeben:<ol style="margin:8px 0 8px 18px;background:#fff6e5;padding:8px 8px 8px 26px;border-radius:6px"><li>Drehpunkt in A.</li><li>F_B · ${p.l} = ${p.F1} · ${p.a} + ${p.F2} · ${p.c}</li><li>F_B = ${fmt(FBf)} kN</li><li>F_A = ${p.F1} + ${p.F2} − ${fmt(FBf)} = ${fmt(p.F1+p.F2-FBf)} kN</li></ol>Finde den Fehler. Berechnen Sie die richtigen Lagerkräfte F_A und F_B.`;},
 asks:p=>{const FB=(p.F1*p.a+p.F2*(p.l+p.c))/p.l;return [{k:'F_A',unit:'kN',v:p.F1+p.F2-FB},{k:'F_B',unit:'kN',v:FB}];},
 hints:p=>['Schau Zeile 2 an. Welcher Hebelarm gehört zu F_2?','Der Hebelarm wird immer vom Drehpunkt aus gemessen, nicht vom nächsten Lager.','Ein negatives F_A heisst: Das Lager A zieht nach unten.'],
 sol:p=>{const x=p.l+p.c,FB=(p.F1*p.a+p.F2*x)/p.l,FA=p.F1+p.F2-FB;return [`Fehler in Zeile 2: Für F_2 wurde der Hebelarm c = ${p.c} mm eingesetzt. Das ist der Abstand ab B. Der Drehpunkt liegt aber in A.`,`Richtiger Hebelarm: ${eq(l(p.l+' + '+p.c+' = '+x+' mm'))}`,`${eq(f('F_B')+' = ('+p.F1+' · '+p.a+' + '+p.F2+' · '+x+') : '+p.l+' = '+f(fmt(FB)+' kN'))}`,`${eq(f('F_A')+' = '+p.F1+' + '+p.F2+' − '+fmt(FB)+' = '+f(fmt(FA)+' kN'))}`,FA<0?'F_A ist negativ. Das Lager A muss den Träger nach unten halten.':'Kontrolle mit Drehpunkt in B lohnt sich immer. So findest du solche Fehler selbst.'];}},
{id:'c5',lvl:1,src:KR.kopf,title:'Brett auf zwei Böcken: Kopfrechnen mit Anteilen',gen(){return {l:pick([2,3,4]),F1:pick([600,800,1000]),q:pick([[1,4],[3,4],[1,5],[2,5],[1,3]]),F2:pick([100,200,300])};},
 draw:p=>drawBeam({l:p.l,loads:[{x:p.l*p.q[0]/p.q[1],F:p.F1,lab:`F_1 = ${p.F1} N`,anc:p.q[0]/p.q[1]>0.5?0:1},{x:p.l/2,F:p.F2,lab:`F_2 = ${p.F2} N`,anc:p.q[0]/p.q[1]>0.5?1:0}]},{segs:p.q[0]/p.q[1]<0.5?[`${p.q[0]}/${p.q[1]} · l`,'','']:['','',`${p.q[1]-p.q[0]}/${p.q[1]} · l`],tot:`l = ${p.l} m`}),
 text:p=>`Ein Maler (${f('F_1 = '+p.F1+' N')}) steht auf einem Brett zwischen zwei Böcken A und B. Er steht bei ${p.q[0]}/${p.q[1]} der Länge, von A aus gemessen. Ein Farbeimer (${f('F_2 = '+p.F2+' N')}) steht genau in der Mitte. Rechne ohne Taschenrechner, nur mit Anteilen: Wie viel tragen A und B?`,
 asks:p=>{const t=p.q[0]/p.q[1],FB=p.F1*t+p.F2/2;return [{k:'F_A',unit:'N',v:p.F1+p.F2-FB},{k:'F_B',unit:'N',v:FB}];},
 hints:p=>['Faustregel: Das Lager B trägt den Anteil «Abstand von A geteilt durch l» jeder Last.','Der Maler steht bei '+p.q[0]+'/'+p.q[1]+'. Also trägt B '+p.q[0]+'/'+p.q[1]+' von '+p.F1+' N.','Der Eimer in der Mitte verteilt sich halb-halb.'],
 sol:p=>{const t=p.q[0]/p.q[1],b1=p.F1*t,FB=b1+p.F2/2;return [`Maler: B trägt ${p.q[0]}/${p.q[1]} · ${p.F1} N = ${fmt(b1)} N. A trägt den Rest: ${fmt(p.F1-b1)} N.`,`Eimer in der Mitte: je ${fmt(p.F2/2)} N.`,`${eq(f('F_B')+' = '+fmt(b1)+' + '+fmt(p.F2/2)+' = '+f(fmt(FB)+' N'))}, ${eq(f('F_A')+' = '+fmt(p.F1-b1)+' + '+fmt(p.F2/2)+' = '+f(fmt(p.F1+p.F2-FB)+' N'))}`,`Plausibel? Das Lager näher beim Maler muss mehr tragen. Die Summe muss ${p.F1+p.F2} N ergeben.`,'Die Faustregel ist das Momentengleichgewicht in Kurzform: F_B · l = F · x ⇒ F_B = F · (x : l).'];}},
{id:'c6',lvl:3,src:KR.neu+' + umgekehrt',title:'Anhänger richtig beladen: die Stützlast',gen(){let r,x2;do{r={l:pick([2.4,2.6,2.8]),FL:pick([1500,2000,2500]),xL:pick([1.8,2]),F:pick([4000,5000,6000]),x:pick([1.4,1.6,1.8]),S:pick([500,600,700])};x2=((r.FL+r.F-r.S)*r.l-r.FL*r.xL)/r.F;}while(x2<0.9||x2>r.l-0.1);return r;},
 draw:p=>drawAnh(p),text:p=>`Ein einachsiger Anhänger hängt bei A an der Kupplung des Autos. Die Achse B liegt ${l('l = '+fmt(p.l)+' m')} hinter der Kupplung. Der leere Anhänger wiegt ${f('F_L = '+p.FL+' N')}, Schwerpunkt ${l(fmt(p.xL)+' m')} hinter A. Die Ladung wiegt ${f('F = '+p.F+' N')} und steht ${l('x = '+fmt(p.x)+' m')} hinter A. a) Wie gross ist die Stützlast F_A? b) Wie gross ist F_B? c) Wo muss die Ladung stehen, damit die Stützlast genau ${f(p.S+' N')} beträgt?`,
 asks:p=>{const FB=(p.FL*p.xL+p.F*p.x)/p.l,FA=p.FL+p.F-FB;return [{k:'a) F_A',unit:'N',v:FA},{k:'b) F_B',unit:'N',v:FB},{k:'c) x',unit:'m',v:(p.FL*p.xL+p.F*0-(p.FL+p.F-p.S)*p.l)/-p.F}];},
 hints:p=>['Drehpunkt in A (Kupplung): F_B · l = F_L · '+fmt(p.xL)+' + F · x','F_A = F_L + F − F_B','c) Umgekehrt: F_A ist gegeben, also kennst du F_B = F_L + F − '+p.S+' N. Dann die Momentengleichung nach x umstellen.'],
 sol:p=>{const FB=(p.FL*p.xL+p.F*p.x)/p.l,FA=p.FL+p.F-FB,FB2=p.FL+p.F-p.S,x2=(FB2*p.l-p.FL*p.xL)/p.F;return [`a) Drehpunkt in A: ${eq(f('F_B')+' = ('+p.FL+' · '+fmt(p.xL)+' + '+p.F+' · '+fmt(p.x)+') : '+fmt(p.l)+' = '+f(fmt(FB)+' N'))}`,`${eq(f('F_A')+' = '+p.FL+' + '+p.F+' − '+fmt(FB)+' = '+f(fmt(FA)+' N'))}`+(FA<0?' Negativ: Der Anhänger hebt das Auto hinten an.':''),`c) Gesucht ist x für F_A = ${p.S} N. ${eq(f('F_B')+' = '+p.FL+' + '+p.F+' − '+p.S+' = '+fmt(FB2)+' N')}`,`${eq(l('x')+' = ('+fmt(FB2)+' · '+fmt(p.l)+' − '+p.FL+' · '+fmt(p.xL)+') : '+p.F+' = '+l(fmt(x2,2)+' m'))}`,'Ladung weiter nach vorne ⇒ mehr Stützlast. Ladung hinter die Achse ⇒ die Deichsel hebt sich.','Warnung: Eine zu kleine oder negative Stützlast lässt den Anhänger schlingern. Es besteht Unfallgefahr. Die erlaubte Stützlast steht in den Fahrzeugpapieren.'];},
 solDraw:p=>{const FB=(p.FL*p.xL+p.F*p.x)/p.l;return drawAnh(p,{RA:`F_A = ${fmt(p.FL+p.F-FB)} N`,RB:`F_B = ${fmt(FB)} N`});}}

 draw:p=>drawSchn(p),text:p=>`An der Abtriebswelle eines Schneckengetriebes ist das Drehmoment ${m('M_2 = '+p.M2+' N·m')} erforderlich. Die Schnecke hat z_1 = ${p.z1} Gang, das Schneckenrad z_2 = ${p.z2} Zähne. Wie gross sind a) die Drehzahl n_2 bei der Motordrehzahl n_1 = ${p.n1}/min und b) das Drehmoment M_1 des Motors (ohne Wirkungsgrad)?`+BW(p),
 asks:p=>[{k:'a) n_2',unit:'1/min',v:p.n1*p.z1/p.z2},{k:'b) M_1',unit:'N·m',v:p.M2*p.z1/p.z2}],hints:p=>['Eine eingängige Schnecke zählt wie ein Zahnrad mit z_1 = 1.','i = z_2 : z_1, n_2 = n_1 : i','M_1 = M_2 : i'],
 sol:p=>{const i=p.z2/p.z1;return [`${eq('i = '+p.z2+' : '+p.z1+' = '+fmt(i))}`,`a) ${eq('n_2 = '+p.n1+' : '+fmt(i)+' = '+fmt(p.n1/i)+'/min')}`,`b) ${eq(m('M_1')+' = '+p.M2+' : '+fmt(i)+' = '+m(fmt(p.M2/i,3)+' N·m'))}`,'In Wirklichkeit hat ein Schneckengetriebe einen schlechten Wirkungsgrad. Der Motor braucht dann mehr als dieses M_1.'];}},
{id:'ub3',lvl:2,src:'Buch Umfangskraft, Nr. 3',title:'Montagepresse',gen:bk({F:1.5,d:120,z1:22,mm:2.5},()=>({F:pick([1,1.5,2,2.5]),d:pick([100,120]),z1:pick([18,20,22]),mm:2.5})),

 asks:p=>{const M2=p.F*1000*p.d/2000;return [{k:'a) M_2',unit:'N·m',v:M2},{k:'b) M_1',unit:'N·m',v:M2*p.z1*p.mm/p.d}];},
 hints:p=>['Die Pinole ist eine Zahnstange. Die Kraft F wirkt am Umfang des grossen Rades: M_2 = F · d : 2.','Zähnezahl des grossen Rades: z_2 = d : m = '+p.d+' : '+p.mm+' = '+fmt(p.d/p.mm)+'.','M_1 = M_2 · z_1 : z_2'],
 sol:p=>{const M2=p.F*1000*p.d/2000,z2=p.d/p.mm;return [`a) ${eq(m('M_2')+' = '+f(fmt(p.F*1000)+' N')+' · '+l(fmt(p.d/2000,3)+' m')+' = '+m(fmt(M2)+' N·m'))}`,`b) ${eq('z_2 = '+p.d+' : '+p.mm+' = '+fmt(z2))}, ${eq(m('M_1')+' = '+fmt(M2)+' · '+p.z1+' : '+fmt(z2)+' = '+m(fmt(M2*p.z1/z2)+' N·m'))}`,'Kontrolle: Am Zahneingriff wirkt dieselbe Umfangskraft wie an der Pinole, weil das grosse Rad beide berührt.'];}},
{id:'ub4',lvl:1,src:'Buch Umfangskraft, Nr. 4',title:'Kolbenverdichter mit Keilriemen',gen:bk({M1:48,d1:180,i:2.84},()=>({M1:pick([30,40,48,60]),d1:pick([125,160,180]),i:pick([2.5,2.84,3.2])})),

{id:'ub5',lvl:2,src:'Buch Umfangskraft, Nr. 5',title:'Räderwinde',gen:bk({FG:2,dT:180,i:3.3,mm:3,z1:30,l1:300},()=>({FG:pick([1.5,2,2.5]),dT:pick([160,180,200]),i:pick([3,3.3,4]),mm:3,z1:pick([20,25,30]),l1:pick([250,300,350])})),
 draw:p=>drawRW(p),text:p=>`Mit einer Räderwinde soll eine Last ${f('F_G = '+fmt(p.FG)+' kN')} gehoben werden. Die Seiltrommel hat ${l('ø'+p.dT+' mm')}. Wie gross sind a) das Drehmoment M_2 an der Seiltrommel, b) das Drehmoment M_1 an der Antriebswelle bei i = ${p.i}, c) die Umfangskraft F_u an den Zahnflanken bei ${l('m = '+p.mm+' mm')} und z_1 = ${p.z1}, d) die Handkraft F_1 an der Kurbel mit ${l('l_1 = '+p.l1+' mm')}?`+BW(p),
 asks:p=>{const M2=p.FG*1000*p.dT/2000,M1=M2/p.i;return [{k:'a) M_2',unit:'N·m',v:M2},{k:'b) M_1',unit:'N·m',v:M1},{k:'c) F_u',unit:'N',v:2*M1*1000/(p.mm*p.z1)},{k:'d) F_1',unit:'N',v:M1*1000/p.l1}];},
 hints:p=>['a) M_2 = F_G · d_T : 2','b) M_1 = M_2 : i','c) d_1 = m · z_1, F_u = 2 · M_1 : d_1','d) Kurbel: M_1 = F_1 · l_1'],
 sol:p=>{const M2=p.FG*1000*p.dT/2000,M1=M2/p.i,d1=p.mm*p.z1;return [`a) ${eq(m('M_2')+' = '+fmt(p.FG*1000)+' N · '+fmt(p.dT/2000,3)+' m = '+m(fmt(M2)+' N·m'))}`,`b) ${eq(m('M_1')+' = '+fmt(M2)+' : '+p.i+' = '+m(fmt(M1)+' N·m'))}`,`c) ${eq(l('d_1')+' = '+p.mm+' · '+p.z1+' = '+d1+' mm')}, ${eq(f('F_u')+' = 2 · '+fmt(M1*1000)+' N·mm : '+d1+' mm = '+f(fmt(2*M1*1000/d1)+' N'))}`,`d) ${eq(f('F_1')+' = '+fmt(M1*1000)+' N·mm : '+p.l1+' mm = '+f(fmt(M1*1000/p.l1)+' N'))}`,`Mit ${fmt(M1*1000/p.l1)} N Handkraft hebt man ${fmt(p.FG*1000)} N. Das ist die Wirkung von Kurbel und Getriebe.`];}},
{id:'ub6',lvl:3,src:'Buch Umfangskraft, Nr. 6',title:'Pkw-Antrieb mit Schaltgetriebe',gen:bk({M:220,n:4200,iA:3.38,rR:295,nmax:6200},()=>({M:pick([180,220,260]),n:4200,iA:pick([3.38,3.7]),rR:pick([290,295,310]),nmax:pick([6000,6200,6500])})),
 draw:p=>drawPkw(p),text:p=>`Ein Pkw-Motor gibt sein grösstes Drehmoment ${m('M = '+p.M+' N·m')} ab. Das Schaltgetriebe hat die Übersetzungen 4,12 / 2,85 / 1,95 / 1,38 / 1,09 (Gang 1 bis 5). Das Ausgleichsgetriebe hat i_A = ${p.iA}. Berechnen Sie a) die Gesamtübersetzungen in den Gängen 1 bis 5, b) die grösste Umfangskraft je Hinterrad im 1. und im 5. Gang bei ${l('r_R = '+p.rR+' mm')} und c) die Höchstgeschwindigkeit im 5. Gang bei n = ${p.nmax}/min.`+BW(p),

 hints:p=>['i_ges = i_Gang · i_A','Drehmoment an der Hinterachse: M · i_ges. Es verteilt sich auf zwei Räder. F_u = M_Rad : r_R.','Raddrehzahl = n : i_ges. v = π · d · n_Rad mit d = 2 · r_R. Dann m/min in km/h: · 60 : 1000.'],
 sol:p=>{const G=[4.12,2.85,1.95,1.38,1.09].map(g=>g*p.iA),r=p.rR/1000;return [`a) ${G.map((g,i)=>(i+1)+'. Gang: '+[4.12,2.85,1.95,1.38,1.09][i]+' · '+p.iA+' = '+fmt(g,2)).join('; ')}`,`b) 1. Gang: ${eq(m('M_Rad')+' = '+p.M+' · '+fmt(G[0],3)+' : 2 = '+fmt(p.M*G[0]/2)+' N·m')}, ${eq(f('F_u')+' = '+fmt(p.M*G[0]/2)+' : '+fmt(r,3)+' = '+f(fmt(p.M*G[0]/2/r)+' N'))}`,`5. Gang: ${eq(f('F_u')+' = '+p.M+' · '+fmt(G[4],3)+' : 2 : '+fmt(r,3)+' = '+f(fmt(p.M*G[4]/2/r)+' N'))}`,`c) ${eq('n_Rad = '+p.nmax+' : '+fmt(G[4],3)+' = '+fmt(p.nmax/G[4])+'/min')}, ${eq(w('v')+' = π · '+fmt(2*r,2)+' m · '+fmt(p.nmax/G[4])+'/min = '+fmt(Math.PI*2*r*p.nmax/G[4])+' m/min = '+w(fmt(Math.PI*2*r*p.nmax/G[4]*0.06)+' km/h'))}`,'Kleiner Gang: grosse Zugkraft, kleine Geschwindigkeit. Grosser Gang: umgekehrt.'];}},
{id:'ub7',lvl:3,src:'Buch Umfangskraft, Nr. 7',title:'Hubwerk mit zweistufigem Getriebe',gen:bk({z1:17,z2:57,z3:21,z4:65,FG:3,dT:280,n:550},()=>({z1:pick([15,17]),z2:pick([51,57]),z3:pick([19,21]),z4:pick([60,65]),FG:pick([2,3,4]),dT:pick([250,280]),n:pick([550,700,950])})),
 draw:p=>drawHubw(p),text:p=>`Die Seiltrommel (${l('ø'+p.dT+' mm')}) eines Hubwerks wird über ein zweistufiges Getriebe angetrieben: z_1 = ${p.z1}, z_2 = ${p.z2}, z_3 = ${p.z3}, z_4 = ${p.z4}. Der Motor dreht mit n = ${p.n}/min. Gehoben werden höchstens ${f('F_G = '+fmt(p.FG)+' kN')}. Berechnen Sie a) die Drehzahl der Seiltrommel, b) die Hubgeschwindigkeit, c) das Drehmoment an der Seiltrommel und d) das Drehmoment am Motor.`+BW(p),
 asks:p=>{const i=p.z2/p.z1*p.z4/p.z3,nT=p.n/i,MT=p.FG*1000*p.dT/2000;return [{k:'a) n_T',unit:'1/min',v:nT},{k:'b) v',unit:'m/min',v:Math.PI*p.dT/1000*nT},{k:'c) M_T',unit:'N·m',v:MT},{k:'d) M_Mot',unit:'N·m',v:MT/i}];},
 hints:p=>['Gesamtübersetzung zweistufig: i = (z_2 : z_1) · (z_4 : z_3).','n_T = n : i, v = π · d_T · n_T','M_T = F_G · d_T : 2, M_Mot = M_T : i'],
 sol:p=>{const i1=p.z2/p.z1,i2=p.z4/p.z3,i=i1*i2,nT=p.n/i,MT=p.FG*1000*p.dT/2000;return [`${eq('i = '+p.z2+'/'+p.z1+' · '+p.z4+'/'+p.z3+' = '+fmt(i1,3)+' · '+fmt(i2,3)+' = '+fmt(i,3))}`,`a) ${eq('n_T = '+p.n+' : '+fmt(i,3)+' = '+fmt(nT)+'/min')}`,`b) ${eq(w('v')+' = π · '+fmt(p.dT/1000,3)+' m · '+fmt(nT)+'/min = '+w(fmt(Math.PI*p.dT/1000*nT)+' m/min'))}`,`c) ${eq(m('M_T')+' = '+fmt(p.FG*1000)+' N · '+fmt(p.dT/2000,3)+' m = '+m(fmt(MT)+' N·m'))}`,`d) ${eq(m('M_Mot')+' = '+fmt(MT)+' : '+fmt(i,3)+' = '+m(fmt(MT/i)+' N·m'))}`];}}
];

{id:'cu2',lvl:2,src:KR.fehl,title:'Schneckengetriebe: Wo steckt der Fehler?',gen(){return {z1:pick([1,2]),z2:pick([30,40,50]),n1:1440,M2:pick([60,90,120])};},
 draw:p=>drawSchn(p),text:p=>{const i=p.z2/p.z1;return `Ein Lernender rechnet für dieses Schneckengetriebe das Motordrehmoment so:<ol style="margin:8px 0 8px 18px;background:#fff6e5;padding:8px 8px 8px 26px;border-radius:6px"><li>i = ${p.z2} : ${p.z1} = ${fmt(i)}</li><li>M_1 = i · M_2 = ${fmt(i)} · ${p.M2} = ${fmt(i*p.M2)} N·m</li></ol>Finde den Fehler. Wie gross sind das richtige M_1 und die Abtriebsdrehzahl n_2?`;},

{id:'cu3',lvl:3,src:KR.komb,title:'Zahnrad auf der Welle: Umfangskraft und Lagerkräfte',gen(){return {M:pick([60,90,120,150]),d:pick([100,120,150]),l:pick([300,400,500]),a:pick([100,120,150])};},

 asks:p=>{const Fu=2*p.M*1000/p.d;return [{k:'a) F_u',unit:'N',v:Fu},{k:'b) F_A',unit:'N',v:Fu*(p.l-p.a)/p.l},{k:'b) F_B',unit:'N',v:Fu*p.a/p.l}];},
 hints:p=>['Zuerst Umfangskraft: F_u = 2 · M : d.','Dann wie bei den Lagerkräften: Drehpunkt in A, F_B · l = F_u · a.','F_A = F_u − F_B'],

 solDraw:p=>{const Fu=2*p.M*1000/p.d,FB=Fu*p.a/p.l;return drawZW(p,{Fu:`F_u = ${fmt(Fu)} N`,RA:`F_A = ${fmt(Fu-FB)} N`,RB:`F_B = ${fmt(FB)} N`});}},
{id:'cu4',lvl:1,src:KR.kopf,title:'Getriebe im Kopf rechnen',gen(){return {z1:pick([10,15,20]),k:pick([2,3,4,5]),M1:pick([20,30,40,50]),n1:pick([600,900,1200,1500])};},

 asks:p=>[{k:'n_2',unit:'1/min',v:p.n1/p.k},{k:'M_2',unit:'N·m',v:p.M1*p.k}],hints:p=>['Wie oft passt z_1 in z_2? Das ist i = '+p.k+'.','Drehzahl wird i-mal kleiner, Drehmoment i-mal grösser.'],

 sol:p=>{const FR=p.f*10*p.FN*1000/(p.d/2);return [`a) ${eq(f('F_R')+' = '+fmt(p.f*10)+' mm · '+fmt(p.FN*1000)+' N : '+(p.d/2)+' mm = '+f(fmt(FR)+' N'))}`,`b) ${eq(m('M')+' = 2 · '+fmt(FR)+' N · '+fmt(p.d/2000,3)+' m = '+m(fmt(2*FR*p.d/2000)+' N·m'))}`,'Die obere Rolle hat keinen eigenen Antrieb. Ihre Rollreibung muss über das Blech von der unteren Rolle überwunden werden.'];}},
{id:'rb5',lvl:2,src:'Buch Reibung, Nr. 5',title:'Reibschlüssige Schraubenverbindung',gen:bk({F:3.2,mu:0.2,n:2},()=>({F:pick([2,3.2,4,5]),mu:pick([0.15,0.2]),n:pick([2,3])})),
 draw:p=>drawSchraubV(p),text:p=>`Zwei Flachstäbe 80 × 12 werden mit ${f('F = '+fmt(p.F)+' kN')} auf Zug belastet. Die Stäbe liegen überlappt aufeinander, es gibt also eine Reibfläche. Die Zugkraft soll nur durch Reibung übertragen werden. Wie gross muss die Spannkraft F_N je Schraube mindestens sein? μ = ${fmt(p.mu)}, ${p.n} Schrauben.`+BW(p),
 asks:p=>[{k:'F_N je Schraube',unit:'N',v:p.F*1000/(p.mu*p.n)}],hints:p=>['Die Reibungskraft muss mindestens so gross sein wie die Zugkraft: F_R = F.','F_R = μ · F_N,gesamt ⇒ F_N,gesamt = F : μ. Dann durch die Anzahl Schrauben teilen.'],
 sol:p=>[`${eq(f('F_N,gesamt')+' = '+fmt(p.F*1000)+' N : '+fmt(p.mu)+' = '+fmt(p.F*1000/p.mu)+' N')}`,`${eq(f('F_N')+' = '+fmt(p.F*1000/p.mu)+' : '+p.n+' = '+f(fmt(p.F*1000/(p.mu*p.n))+' N'))} je Schraube`,'Merke: Mit zwei Reibflächen (Laschen oben und unten) würde die halbe Spannkraft reichen.','Warnung: Zu wenig Vorspannung lässt die Stäbe rutschen. Dann tragen die Schrauben auf Abscherung und können versagen.']},
{id:'rb6',lvl:3,src:'Buch Reibung, Nr. 6',title:'Bohreinheit auf der Schräge',gen:bk({FG:1500,Ff:1800,al:30,mu:0.07,d:142},()=>({FG:pick([1200,1500,2000]),Ff:pick([1200,1800,2400]),al:pick([20,30]),mu:pick([0.05,0.07,0.1]),d:pick([120,142])})),
 draw:p=>drawEbene(p,{FG:`F_G = ${p.FG} N`,F:'F = ?',al:`α = ${p.al}°`,m:`F_f = ${p.Ff} N (Vorschubkraft)`,mu:`μ = ${fmt(p.mu)}, Zahnrad d = ${p.d} mm`}),
 text:p=>`Eine Bohreinheit (${f('F_G = '+p.FG+' N')}) fährt auf einer um ${p.al}° geneigten Führung nach oben. Beim Bohren wirkt die Vorschubkraft ${f('F_f = '+p.Ff+' N')} parallel zur Führung gegen die Bewegung. Sie wird über Zahnrad (${l('d = '+p.d+' mm')}) und Zahnstange angetrieben. Wie gross sind a) die Umfangskraft am Zahnrad bei μ = ${fmt(p.mu)} und b) das Antriebsmoment?`+BW(p),
 asks:p=>{const a=rad(p.al),F=p.Ff+p.FG*Math.sin(a)+p.mu*p.FG*Math.cos(a);return [{k:'a) F_u',unit:'N',v:F},{k:'b) M',unit:'N·m',v:F*p.d/2000}];},
 hints:p=>['Drei Kräfte wirken gegen die Bewegung: Vorschubkraft, Hangabtriebskraft und Reibung.','F_H = F_G · sin α, F_N = F_G · cos α, F_R = μ · F_N','F_u = F_f + F_H + F_R, M = F_u · d : 2'],
 sol:p=>{const a=rad(p.al),FH=p.FG*Math.sin(a),FN=p.FG*Math.cos(a),FR=p.mu*FN,F=p.Ff+FH+FR;return [`${eq(f('F_H')+' = '+p.FG+' · sin '+p.al+'° = '+fmt(FH)+' N')}`,`${eq(f('F_N')+' = '+p.FG+' · cos '+p.al+'° = '+fmt(FN)+' N')}, ${eq(f('F_R')+' = '+fmt(p.mu)+' · '+fmt(FN)+' = '+fmt(FR)+' N')}`,`a) ${eq(f('F_u')+' = '+p.Ff+' + '+fmt(FH)+' + '+fmt(FR)+' = '+f(fmt(F)+' N'))}`,`b) ${eq(m('M')+' = '+fmt(F)+' N · '+fmt(p.d/2000,3)+' m = '+m(fmt(F*p.d/2000)+' N·m'))}`];}},
{id:'rb7',lvl:3,src:'Buch Reibung, Nr. 7',title:'Getriebewelle in Gleitlagern',gen:bk({F1:18,F2:13.5,a:450,b:680,l:1580,dA:100,dB:125,mu:0.06},()=>({F1:pick([12,18,20]),F2:pick([10,13.5,15]),a:450,b:680,l:1580,dA:100,dB:125,mu:pick([0.05,0.06,0.08])})),
 draw:p=>drawGWelle(p),text:p=>`Die Zwischenwelle eines Grossgetriebes ist in Gleitlagern gelagert. Die Zahnradkräfte sind ${f('F_1 = '+fmt(p.F1)+' kN')} und ${f('F_2 = '+fmt(p.F2)+' kN')}. Die Lagerzapfen haben ø${p.dA} (A) und ø${p.dB} (B). Wie gross sind a) die Lagerkräfte, b) die Reibungskräfte in A und B bei μ = ${fmt(p.mu)} und c) das gesamte Reibungsmoment?`+BW(p),
 asks:p=>{const FB=(p.F1*p.a+p.F2*(p.a+p.b))/p.l,FA=p.F1+p.F2-FB;return [{k:'a) F_A',unit:'kN',v:FA},{k:'a) F_B',unit:'kN',v:FB},{k:'b) F_RA',unit:'N',v:p.mu*FA*1000},{k:'b) F_RB',unit:'N',v:p.mu*FB*1000},{k:'c) M_R',unit:'N·m',v:p.mu*(FA*1000*p.dA+FB*1000*p.dB)/2000}];},
 hints:p=>['a) Drehpunkt in A: F_B · '+p.l+' = F_1 · '+p.a+' + F_2 · '+(p.a+p.b),'b) F_R = μ · F_A bzw. μ · F_B','c) Jedes Lager hat seinen eigenen Zapfenradius: M_R = F_RA · r_A + F_RB · r_B'],
 sol:p=>{const FB=(p.F1*p.a+p.F2*(p.a+p.b))/p.l,FA=p.F1+p.F2-FB,RA=p.mu*FA*1000,RBf=p.mu*FB*1000;return [`a) ${eq(f('F_B')+' = ('+fmt(p.F1)+' · '+p.a+' + '+fmt(p.F2)+' · '+(p.a+p.b)+') : '+p.l+' = '+f(fmt(FB,2)+' kN'))}, ${eq(f('F_A')+' = '+fmt(p.F1+p.F2)+' − '+fmt(FB,2)+' = '+f(fmt(FA,2)+' kN'))}`,`b) ${eq(f('F_RA')+' = '+fmt(p.mu)+' · '+fmt(FA*1000)+' = '+fmt(RA)+' N')}, ${eq(f('F_RB')+' = '+fmt(p.mu)+' · '+fmt(FB*1000)+' = '+fmt(RBf)+' N')}`,`c) ${eq(m('M_R')+' = '+fmt(RA)+' · '+fmt(p.dA/2000,4)+' + '+fmt(RBf)+' · '+fmt(p.dB/2000,4)+' = '+m(fmt(RA*p.dA/2000+RBf*p.dB/2000)+' N·m'))}`,'Drei Kapitel in einer Aufgabe: Lagerkräfte, Reibung und Drehmoment.'];},
 solDraw:p=>{const FB=(p.F1*p.a+p.F2*(p.a+p.b))/p.l;return drawGWelle(p,{FA:`F_A = ${fmt(p.F1+p.F2-FB,2)} kN`,FB:`F_B = ${fmt(FB,2)} kN`});}}
];

{id:'cr1',lvl:2,src:KR.neu,title:'Lieferwagen auf der Rampe',gen(){return {m:pick([2000,2500,3000]),al:pick([10,12,15]),mu0:pick([0.5,0.6,0.7])};},
 draw:p=>drawEbene({al:p.al},{FG:'F_G',comp:[55,70],al:`α = ${p.al}°`,m:`m = ${p.m} kg`,mu:`μ_0 = ${fmt(p.mu0)} (Reifen auf Asphalt)`}),
 text:p=>`Ein Lieferwagen (m = ${p.m} kg) steht mit angezogener Handbremse auf einer Rampe mit ${p.al}° Neigung. Die blockierten Reifen haften mit μ_0 = ${fmt(p.mu0)}. g = 9,81 m/s². Berechnen Sie a) die Hangabtriebskraft F_H, b) die grösste Haftreibungskraft F_R,max und c) die Sicherheit gegen Rutschen S = F_R,max : F_H.`,
 asks:p=>{const G=p.m*9.81,a=rad(p.al);return [{k:'a) F_H',unit:'N',v:G*Math.sin(a)},{k:'b) F_R,max',unit:'N',v:p.mu0*G*Math.cos(a)},{k:'c) S',unit:'',v:p.mu0/Math.tan(a)}];},
 hints:p=>['F_G = m · g','F_H = F_G · sin α, F_N = F_G · cos α','F_R,max = μ_0 · F_N. S > 1 heisst: Der Wagen bleibt stehen.'],
 sol:p=>{const G=p.m*9.81,a=rad(p.al),FH=G*Math.sin(a),FR=p.mu0*G*Math.cos(a);return [`${eq(f('F_G')+' = '+p.m+' · 9,81 = '+fmt(G)+' N')}`,`a) ${eq(f('F_H')+' = '+fmt(G)+' · sin '+p.al+'° = '+f(fmt(FH)+' N'))}`,`b) ${eq(f('F_R,max')+' = '+fmt(p.mu0)+' · '+fmt(G)+' · cos '+p.al+'° = '+f(fmt(FR)+' N'))}`,`c) ${eq('S = '+fmt(FR)+' : '+fmt(FH)+' = '+fmt(FR/FH,2))}`,'Interessant: S = μ_0 : tan α. Die Masse kürzt sich weg. Ein leerer und ein voller Wagen sind gleich sicher.','Warnung: Auf Eis sinkt μ_0 auf etwa 0,1. Dann rutscht der Wagen schon bei kleinen Neigungen. Es besteht Unfallgefahr.'];}},
{id:'cr2',lvl:2,src:KR.um,title:'Förderband: Wie steil darf es sein?',gen(){return {mu0:pick([0.4,0.5,0.6,0.7]),FG:pick([80,120,200])};},

{id:'cr3',lvl:2,src:KR.fehl,title:'Rutschkupplung: Wo steckt der Fehler?',gen(){return {FN:pick([1.5,2,3]),mu:pick([0.4,0.5,0.6]),d:pick([120,160,200])};},
 draw:p=>drawRutsch(p),text:p=>{const FR=p.mu*p.FN*1000;return `Eine Lernende berechnet das übertragbare Drehmoment der Rutschkupplung (zwei Reibflächen, ø${p.d}):<ol style="margin:8px 0 8px 18px;background:#fff6e5;padding:8px 8px 8px 26px;border-radius:6px"><li>F_R = ${fmt(p.mu)} · ${fmt(p.FN*1000)} N = ${fmt(FR)} N</li><li>M = F_R · d = ${fmt(FR)} N · ${fmt(p.d/1000,2)} m = ${fmt(FR*p.d/1000)} N·m</li></ol>Das Resultat stimmt zufällig. Trotzdem ist der Weg falsch. Finde die zwei Fehler. Wie gross ist M_R je Reibfläche und das gesamte M?`;},

{id:'cr4',lvl:3,src:KR.komb,title:'Schiebetor auf zwei Rollen',gen(){return {FG:pick([3000,4000,5000]),L:6,a:pick([0.5,0.8]),b:pick([3.5,4]),xs:3,d:pick([80,100,120]),f:pick([0.5,0.8])};},

  s.append(el('rect',{x:xb-80,y:10,width:160,height:12,fill:'#a7a9c4',stroke:'#555'}));seil(s,xb,22,xb,y1-40);if(o.cyl){s.append(el('rect',{x:xb-60,y:y1-40,width:120,height:40,rx:20,fill:'#d7dbe2',stroke:'#555'}));}else box(s,xb-40,y1-40,80,40);txt(s,xb,y1-14,o.lab||'',{'text-anchor':'middle','font-size':12});
  force(s,xb+60,y1-30,xb+60,y1+30,o.FG||`F_G = ${p.FG} N`,xb+68,y1+16);dimV(s,y1,yG,xb-110,o.h||`h = ${fmt(p.h)} m`,xb-40);vel(s,xb-60,y1+50,xb-60,y1+10,'',0,0);return s;}

  s.append(el('rect',{x:380,y:yG-50,width:150,height:36,rx:4,fill:'#f0c987',stroke:CBs}));[400,500].forEach(x=>s.append(el('circle',{cx:x,cy:yG-12,r:12,fill:'#444'})));line(s,450,yG-50,360,90,{stroke:'#c99a3a','stroke-width':6});line(s,360,90,240,70,{stroke:'#c99a3a','stroke-width':5});seil(s,240,70,240,60);
  dimV(s,60,yG,580,o.h||`h = ${fmt(p.h)} m`,250);txt(s,330,40,`V = ${p.V} m³ Beton, ρ = ${fmt(p.rho)} kg/dm³`,{'font-size':13,'text-anchor':'middle'});return s;}

function drawFeder(p,o={}){const s=mkSvg(280),y=110,L0=200,k=L0*0.6/Math.max(p.s,1),Ls=Math.max(60,L0-p.s*Math.min(k,4));s.append(el('rect',{x:40,y:y-40,width:20,height:80,fill:'url(#hat)',stroke:'#555'}));

{id:'ab9',lvl:1,src:'Buch Energie, Nr. 9',title:'Pkw abbremsen',gen:bk({m:1200,v1:60,v2:120},()=>({m:pick([900,1200,1600]),v1:pick([30,50,60]),v2:pick([80,100,120])})),draw:p=>drawCar({m:p.m,v:p.v1+' / '+p.v2}),

 asks:p=>[{k:'a) W',unit:'kN·m',v:p.m*(p.v1/3.6)**2/2/1000},{k:'b) W',unit:'kN·m',v:p.m*(p.v2/3.6)**2/2/1000}],hints:p=>['km/h in m/s: durch 3,6.','W = W_k = m · v² : 2'],
 sol:p=>[`a) ${eq(fmt(p.v1)+' km/h = '+fmt(p.v1/3.6,3)+' m/s')}, ${eq(w('W')+' = '+p.m+' · '+fmt(p.v1/3.6,3)+'² : 2 = '+w(fmt(p.m*(p.v1/3.6)**2/2000)+' kN·m'))}`,`b) ${eq(fmt(p.v2)+' km/h = '+fmt(p.v2/3.6,3)+' m/s')}, ${eq(w('W')+' = '+w(fmt(p.m*(p.v2/3.6)**2/2000)+' kN·m'))}`,`Faktor ${fmt((p.v2/p.v1)**2,2)}: Die Energie wächst mit dem Quadrat der Geschwindigkeit.`]},
{id:'ab10',lvl:3,src:'Buch Energie, Nr. 10',title:'Pendelschlagwerk',gen:bk({m:21.735,h:1407,h2:220},()=>({m:pick([15,21.735,30]),h:pick([1200,1407,1500]),h2:pick([150,220,400])})),draw:p=>drawPendel(p),
 text:p=>`Der Hammer eines Pendelschlagwerks (m = ${fmt(p.m,3)} kg) wird ${l(p.h+' mm')} hoch angehoben. Berechnen Sie a) seine potentielle Energie, b) seine Geschwindigkeit beim Auftreffen auf die Probe und c) die verbrauchte Schlagarbeit, wenn er danach bis ${l('s_2 = '+p.h2+' mm')} durchschwingt.`+BW(p),
 asks:p=>{const Wp=p.m*G9*p.h/1000;return [{k:'a) W_p',unit:'N·m',v:Wp},{k:'b) v',unit:'m/s',v:Math.sqrt(2*G9*p.h/1000)},{k:'c) W',unit:'N·m',v:p.m*G9*(p.h-p.h2)/1000}];},
 hints:p=>['W_p = m · g · h (h in m).','Unten ist W_p ganz in W_k umgewandelt: m · g · h = m · v² : 2 ⇒ v = √(2 · g · h).','Verbraucht = Energie vorher − Energie nachher = m · g · (h − s_2).'],
 sol:p=>{const Wp=p.m*G9*p.h/1000;return [`a) ${eq(w('W_p')+' = '+fmt(p.m,3)+' · 9,81 · '+fmt(p.h/1000,3)+' = '+w(fmt(Wp)+' N·m'))}`,`b) ${eq(w('v')+' = √(2 · 9,81 · '+fmt(p.h/1000,3)+') = '+w(fmt(Math.sqrt(2*G9*p.h/1000),3)+' m/s'))}`,`c) ${eq(w('W')+' = '+fmt(p.m,3)+' · 9,81 · ('+fmt(p.h/1000,3)+' − '+fmt(p.h2/1000,3)+') = '+w(fmt(p.m*G9*(p.h-p.h2)/1000)+' N·m'))}`,'Die Masse kürzt sich bei v heraus: Jeder Körper fällt aus derselben Höhe gleich schnell.'];}}
];
const AK=[
{id:'ca1',lvl:1,src:KR.neu,title:'Treppe in den 3. Stock',gen(){return {m:pick([60,70,80]),n:pick([3,4,5]),hs:3,pr:pick([0.25,0.3])};},draw:p=>drawLift({FG:`${p.m} kg`,h:p.n*p.hs},{lab:'du',FG:`m = ${p.m} kg`}),
 text:p=>`Du (m = ${p.m} kg) steigst ${p.n} Stockwerke zu je ${p.hs} m hoch. Berechnen Sie a) deine Hubarbeit in kJ, b) diese Arbeit in W·h und c) was dieser Strom bei ${fmt(p.pr,2)} Fr./kW·h kosten würde (in Rappen).`,
 asks:p=>{const W=p.m*G9*p.n*p.hs;return [{k:'a) W',unit:'kJ',v:W/1000},{k:'b) W',unit:'W·h',v:W/3600},{k:'c) Kosten',unit:'Rp.',v:W/3.6e6*p.pr*100}];},
 hints:p=>['W = m · g · h, h = '+p.n+' · '+p.hs+' m.','1 W·h = 3600 N·m','Kosten = W·h : 1000 · Preis'],
 sol:p=>{const W=p.m*G9*p.n*p.hs;return [`a) ${eq(w('W')+' = '+p.m+' · 9,81 · '+p.n*p.hs+' = '+fmt(W)+' N·m = '+w(fmt(W/1000)+' kJ'))}`,`b) ${eq(fmt(W)+' : 3600 = '+fmt(W/3600,2)+' W·h = '+fmt(W/3.6e6,4)+' kW·h')}`,`c) ${eq(fmt(W/3.6e6,4)+' · '+fmt(p.pr,2)+' Fr. = '+fmt(W/3.6e6*p.pr*100,2)+' Rp.')}`,'Muskelarbeit ist gemessen am Strompreis fast nichts wert. Darum lohnen sich Maschinen.'];}},
{id:'ca2',lvl:3,src:KR.um+' + kombiniert',title:'Puffer für einen Rollwagen auslegen',gen(){return {m:pick([200,400,500]),v:pick([0.5,1,1.5]),s:pick([40,50,80])};},draw:p=>drawFeder({R:'?',s:p.s},{R:`Wagen m = ${p.m} kg, v = ${fmt(p.v)} m/s`,F:'F_max = ?'}),
 text:p=>`Ein Rollwagen (m = ${p.m} kg) fährt mit ${w('v = '+fmt(p.v)+' m/s')} gegen einen Federpuffer. Der Puffer darf höchstens ${l(p.s+' mm')} einfedern. Welche Federrate R braucht er? Wie gross ist dann die grösste Federkraft?`,
 asks:p=>{const W=p.m*p.v*p.v/2;return [{k:'W_k',unit:'N·m',v:W},{k:'R',unit:'N/mm',v:2*W*1000/(p.s*p.s)},{k:'F_max',unit:'N',v:2*W*1000/p.s}];},
 hints:p=>['Die ganze Bewegungsenergie muss in die Feder: W_k = R · s² : 2.','Nach R umstellen: R = 2 · W : s². W in N·mm einsetzen!','F_max = R · s'],
 sol:p=>{const W=p.m*p.v*p.v/2,R=2*W*1000/(p.s*p.s);return [`${eq(w('W_k')+' = '+p.m+' · '+fmt(p.v)+'² : 2 = '+w(fmt(W)+' N·m')+' = '+fmt(W*1000)+' N·mm')}`,`${eq('R = 2 · '+fmt(W*1000)+' : '+p.s+'² = '+fmt(R)+' N/mm')}`,`${eq(f('F_max')+' = '+fmt(R)+' · '+p.s+' = '+f(fmt(R*p.s)+' N'))}`,'Umgekehrt gefragt: Die Energie ist bekannt, die Federrate ist gesucht. Kombiniert: Energie trifft Federgesetz.'];}},
{id:'ca3',lvl:2,src:KR.fehl,title:'Bewegungsenergie: Wo steckt der Fehler?',gen(){return {m:pick([800,1200,1500]),v:pick([36,54,72,90])};},draw:p=>drawCar(p),
 text:p=>`Ein Lernender berechnet die Bewegungsenergie eines Autos (m = ${p.m} kg, v = ${p.v} km/h):<ol style="margin:8px 0 8px 18px;background:#fff6e5;padding:8px 8px 8px 26px;border-radius:6px"><li>W_k = m · v² : 2</li><li>W_k = ${p.m} · ${p.v}² : 2 = ${fmt(p.m*p.v*p.v/2)} N·m</li></ol>Finde den Fehler. Wie gross ist die richtige Energie? Um welchen Faktor war das Resultat falsch?`,
 asks:p=>[{k:'W_k',unit:'N·m',v:p.m*(p.v/3.6)**2/2},{k:'Faktor',unit:'',v:12.96}],hints:p=>['Welche Einheit muss v haben, damit N·m herauskommt?','km/h : 3,6 = m/s'],
 sol:p=>[`Fehler: v wurde in km/h eingesetzt. Die Formel braucht m/s.`,`${eq(p.v+' km/h : 3,6 = '+fmt(p.v/3.6)+' m/s')}`,`${eq(w('W_k')+' = '+p.m+' · '+fmt(p.v/3.6)+'² : 2 = '+w(fmt(p.m*(p.v/3.6)**2/2)+' N·m'))}`,'Faktor: 3,6² = 12,96. Das Resultat war fast 13-mal zu gross.']},
{id:'ca4',lvl:3,src:KR.komb,title:'Bremsweg aus Reibung und Energie',gen(){return {m:pick([1000,1300,1600]),v:pick([50,80,100]),mu:pick([0.4,0.7,0.8])};},draw:p=>drawCar(p,{m:`m = ${p.m} kg, μ = ${fmt(p.mu)}`}),
 text:p=>`Ein Auto (m = ${p.m} kg) fährt mit ${w(p.v+' km/h')}. Es macht eine Vollbremsung, die Reifen gleiten mit μ = ${fmt(p.mu)}. Berechnen Sie a) die Bewegungsenergie, b) die Reibungskraft und c) den Bremsweg (ohne Reaktionszeit).`,
 asks:p=>{const v=p.v/3.6,W=p.m*v*v/2,FR=p.mu*p.m*G9;return [{k:'a) W_k',unit:'kN·m',v:W/1000},{k:'b) F_R',unit:'N',v:FR},{k:'c) s',unit:'m',v:W/FR}];},
 hints:p=>['a) v in m/s, W_k = m · v² : 2','b) F_R = μ · m · g','c) Die Reibungsarbeit vernichtet die Energie: F_R · s = W_k ⇒ s = W_k : F_R'],
 sol:p=>{const v=p.v/3.6,W=p.m*v*v/2,FR=p.mu*p.m*G9;return [`a) ${eq(w('W_k')+' = '+p.m+' · '+fmt(v,3)+'² : 2 = '+w(fmt(W/1000)+' kN·m'))}`,`b) ${eq(f('F_R')+' = '+fmt(p.mu)+' · '+p.m+' · 9,81 = '+f(fmt(FR)+' N'))}`,`c) ${eq(l('s')+' = '+fmt(W)+' : '+fmt(FR)+' = '+l(fmt(W/FR)+' m'))}`,'Die Masse kürzt sich: s = v² : (2 · μ · g). Ein schweres Auto bremst nicht kürzer, aber auch nicht länger.','Warnung: Auf nasser Strasse sinkt μ stark. Dann wird der Bremsweg viel länger. Halte genug Abstand, sonst droht ein Auffahrunfall.'];}},
{id:'ca5',lvl:1,src:KR.kopf,title:'Doppelt so schnell = ?',gen(){return {v:pick([20,30,40]),W:pick([20,30,40,50])};},draw:p=>drawCar({m:'?',v:p.v},{m:`W_k = ${p.W} kJ bei ${p.v} km/h`}),

/* ---------- Kräfte nach Buch und kreativ ---------- */
const dg=a=>a*Math.PI/180;
function fA(s,x,y,ang,len,lab,o={}){const ex=x+len*Math.cos(dg(ang)),ey=y-len*Math.sin(dg(ang));line(s,x,y,ex,ey,{stroke:o.c||CF,'stroke-width':o.w||3.2,'marker-end':`url(#${o.m||'aF'})`});if(lab)txt(s,ex+(o.dx||8),ey+(o.dy||-6),lab,Object.assign({fill:o.c||CF,'font-weight':600,'font-size':14},o.t||{}));return [ex,ey];}
function drawPlan(fs,o={}){const s=mkSvg(o.h||280);let x=0,y=0;const pts=[[0,0]];fs.forEach(q=>{x+=q.F*Math.cos(dg(q.a));y+=q.F*Math.sin(dg(q.a));pts.push([x,y]);});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),W=Math.max(...xs)-Math.min(...xs)||1,Hh=Math.max(...ys)-Math.min(...ys)||1,k=Math.min(420/W,(o.h||280)-90)/1,kk=Math.min(420/W,((o.h||280)-90)/Hh),X=u=>110+(u-Math.min(...xs))*kk,Y=v=>(o.h||280)-45-(v-Math.min(...ys))*kk;
  txt(s,20,26,o.title||'Kräfteplan: Kräfte aneinanderreihen',{'font-size':13,fill:'#5a6673'});txt(s,X(0)-10,Y(0)+18,'A',{'font-weight':600,'text-anchor':'end'});
  fs.forEach((q,i)=>{const [a,b]=pts[i],[c,d]=pts[i+1];line(s,X(a),Y(b),X(c),Y(d),{stroke:CF,'stroke-width':3,'marker-end':'url(#aF)'});txt(s,(X(a)+X(c))/2+8,(Y(b)+Y(d))/2-8,q.lab,{fill:CF,'font-weight':600,'font-size':13});});
  const [ex,ey]=pts[pts.length-1];txt(s,X(ex)+10,Y(ey)+4,'E',{'font-weight':600});if(o.R!==false){line(s,X(0),Y(0),X(ex),Y(ey),{stroke:CR,'stroke-width':4,'marker-end':'url(#aR)'});txt(s,(X(0)+X(ex))/2-10,(Y(0)+Y(ey))/2+20,o.R||'F_r',{fill:CR,'font-weight':600,'text-anchor':'end'});}
  if(o.Mk)txt(s,20,48,`M_k = ${o.Mk} N/mm`,{'font-size':13,fill:'#5a6673'});return s;}
function drawSpZyl(p,o={}){const s=mkSvg(230),y=110;s.append(el('rect',{x:20,y:30,width:50,height:160,fill:'url(#hat)',stroke:'#555'}));s.append(el('rect',{x:70,y:y-36,width:70,height:72,rx:6,fill:'#a9cbee',stroke:'#2b4c7e'}));line(s,140,y,250,y,{stroke:'#555','stroke-width':10});
  s.append(el('rect',{x:240,y:y-56,width:200,height:112,fill:'#e6eef7',stroke:'#2b4c7e'}));s.append(el('rect',{x:400,y:y-52,width:26,height:104,fill:'#a9cbee',stroke:'#2b4c7e'}));let d=`M250,${y}`;for(let i=1;i<=10;i++)d+=` L${250+15*i},${y+(i%2?-22:22)}`;s.append(el('path',{d,fill:'none',stroke:'#555','stroke-width':1.6}));
  txt(s,320,y-64,'Rückholfeder',{'font-size':12,'text-anchor':'middle'});txt(s,413,y-64,'Kolben',{'font-size':12,'text-anchor':'middle'});force(s,540,y,432,y,'',0,0);txt(s,546,y+5,o.F1||`F_1 = ${p.F1} N`,{fill:CF,'font-weight':600});
  force(s,390,y+40,320,y+40,'',0,0);txt(s,360,y+70,o.F2||`F_2 = ${p.F2} N (Feder)`,{fill:CF,'font-weight':600,'text-anchor':'middle','font-size':13});force(s,230,y-20,150,y-20,'',0,0);txt(s,150,y-40,o.Fr||'F_r = ?',{fill:CR,'font-weight':600});txt(s,96,y+60,'Werkstück',{'font-size':12,'text-anchor':'middle'});return s;}
function drawMastB(p,o={}){const s=mkSvg(300),cx=280,cy=150;s.append(el('circle',{cx,cy,r:24,fill:'#d7dbe2',stroke:'#555'}));txt(s,cx-34,cy-30,'Mast (Draufsicht)',{'font-size':12,'text-anchor':'end'});
  const k=110/Math.max(p.F1,p.F2);fA(s,cx,cy,p.a1,p.F1*k+24,`F_1 = ${p.F1} N`);fA(s,cx,cy,p.a1-90,p.F2*k+24,`F_2 = ${p.F2} N`,{dy:16});
  line(s,cx,cy-60,cx,cy-24,{stroke:'#777','stroke-dasharray':'4 3'});s.append(el('path',{d:`M${cx},${cy-50} A50,50 0 0 1 ${cx+50*Math.cos(dg(p.a1))},${cy-50*Math.sin(dg(p.a1))}`,fill:'none',stroke:INK}));txt(s,cx+12,cy-56,`${90-p.a1}°`,{'font-size':13});txt(s,cx+44,cy+6,'90°',{'font-size':13});
  if(o.res){const Fr=Math.hypot(p.F1,p.F2),ar=p.a1-Math.atan2(p.F2,p.F1)*180/Math.PI;fA(s,cx,cy,ar,Fr*k*0.75+24,`F_r = ${fmt(Fr)} N`,{c:CR,m:'aR'});const e=[cx-150*Math.cos(dg(ar)),cy+150*Math.sin(dg(ar))];line(s,cx,cy,e[0],e[1],{stroke:'#555','stroke-width':2.5,'stroke-dasharray':'8 4'});txt(s,e[0],e[1]-10,'Spannseil',{'font-size':13,'text-anchor':'middle'});}
  return s;}
function drawSeilR(p,o={}){const s=mkSvg(310),cx=330,cy=170,r=55;s.append(el('rect',{x:cx-8,y:60,width:16,height:cy-60,fill:'#a7a9c4',stroke:'#555'}));
  const aR=dg(p.al);/* Seil 2 geht unter Winkel al zur Senkrechten nach oben links ab */const t1=[cx+r,cy],t2=[cx-r*Math.cos(aR),cy-r*Math.sin(aR)];
  s.append(el('circle',{cx,cy,r,fill:'#a9cbee',stroke:'#2b4c7e','stroke-width':1.5}));pin(s,cx,cy);s.append(el('path',{d:`M${t1[0]},${t1[1]} A${r},${r} 0 0 0 ${t2[0]},${t2[1]}`,fill:'none',stroke:'#444','stroke-width':3}));
  seil(s,t1[0],t1[1],t1[0],cy+70);box(s,t1[0]-24,cy+70,48,40);force(s,t1[0]+40,cy+70,t1[0]+40,cy+120,`F_G = ${p.FG} N`,t1[0]+48,cy+110);
  const L=90,e=[t2[0]-L*Math.sin(aR),t2[1]-L*Math.cos(aR)];line(s,t2[0],t2[1],e[0],e[1],{stroke:'#444','stroke-width':3});fA(s,e[0],e[1],90+p.al,40,'F = F_G',{dx:14,dy:4});
  line(s,t2[0],t2[1],t2[0],t2[1]-80,{stroke:'#777','stroke-dasharray':'4 3'});txt(s,t2[0]+6,t2[1]-56,`${p.al}°`,{'font-size':13});
  if(o.res){const ang=-90+(-90+90+p.al)/2;/* Winkelhalbierende */const dir=(-90+(90+p.al))/2;fA(s,cx,cy,dir,80,`F_r = ${fmt(2*p.FG*Math.cos(dg((180-p.al)/2)))} N`,{c:CR,m:'aR'});}
  return s;}
function drawHubseil(p,o={}){const s=mkSvg(300),hx=320,hy=40,a=dg(p.al/2),L=130,yb=hy+L*Math.cos(a),xl=hx-L*Math.sin(a),xr=hx+L*Math.sin(a);
  s.append(el('path',{d:`M${hx},${hy-26} l0,14 a10,10 0 1 0 -10,10`,fill:'none',stroke:'#444','stroke-width':3}));line(s,hx,hy,xl,yb,{stroke:'#444','stroke-width':2.5});line(s,hx,hy,xr,yb,{stroke:'#444','stroke-width':2.5});
  box(s,xl-30,yb,xr-xl+60,70);txt(s,hx,yb+40,'Behälter',{'text-anchor':'middle','font-size':13});force(s,hx,yb+74,hx,yb+120,o.FG||'F_G = ?',hx+10,yb+110);
  s.append(el('path',{d:`M${hx-30*Math.sin(a)},${hy+30*Math.cos(a)} A30,30 0 0 0 ${hx+30*Math.sin(a)},${hy+30*Math.cos(a)}`,fill:'none',stroke:INK}));txt(s,hx,hy+52,`α = ${p.al}°`,{'text-anchor':'middle','font-size':13});
  fA(s,xr,yb,90-p.al/2,60,o.F||`F = ${p.F} kN`,{dx:6});txt(s,30,30,o.note||'Seil: Tragkraft je Strang',{'font-size':13});return s;}
function drawDiesel(p,o={}){const s=mkSvg(320),cx=300;s.append(el('rect',{x:cx-90,y:20,width:20,height:200,fill:'url(#hat)',stroke:'#555'}));s.append(el('rect',{x:cx+70,y:20,width:20,height:200,fill:'url(#hat)',stroke:'#555'}));
  s.append(el('rect',{x:cx-70,y:70,width:140,height:80,rx:4,fill:'#d7dbe2',stroke:'#555'}));pin(s,cx,120);const a=dg(p.al),L=170,e=[cx+L*Math.sin(a),120+L*Math.cos(a)];line(s,cx,120,e[0],e[1],{stroke:'#a9cbee','stroke-width':18});line(s,cx,120,e[0],e[1],{stroke:'#2b4c7e','stroke-width':1});
  txt(s,cx+80,180,'Pleuelstange',{'font-size':12});txt(s,cx-60,64,'Kolben',{'font-size':12});force(s,cx,10,cx,66,o.F||`F = ${p.F} kN`,cx+10,30);
  fA(s,cx-12,120,180,70,o.FN||'F_N = ?',{dx:-8,t:{'text-anchor':'end'}});fA(s,e[0]-20,e[1]-60,-90+p.al,70,o.FP||'F_P = ?',{dx:10});line(s,e[0],e[1],e[0],e[1]-60,{stroke:'#777','stroke-dasharray':'4 3'});txt(s,e[0]-24,e[1]-30,`${p.al}°`,{'font-size':13,'text-anchor':'end'});return s;}
function drawVF(p,o={}){const s=mkSvg(300),cx=320,yv=170,h=90,ha=dg(p.w/2);s.append(el('polygon',{points:`120,${yv-h} ${cx-h*Math.tan(ha)},${yv-h} ${cx},${yv} ${cx+h*Math.tan(ha)},${yv-h} 520,${yv-h} 520,40 120,40`,fill:'#a9cbee',stroke:'#2b4c7e'}));
  s.append(el('polygon',{points:`120,${yv-h+6} ${cx-h*Math.tan(ha)},${yv-h+6} ${cx},${yv+6} ${cx+h*Math.tan(ha)},${yv-h+6} 520,${yv-h+6} 520,280 120,280`,fill:'url(#hat)',stroke:'#555'}));txt(s,140,60,'Schlitten',{'font-size':12});txt(s,140,270,'Bett',{'font-size':12});
  force(s,cx,40,cx,110,o.F||`F = ${fmt(p.F)} kN`,cx+10,60);const m1=[cx-h*Math.tan(ha)/2,yv-h/2],m2=[cx+h*Math.tan(ha)/2,yv-h/2];fA(s,m1[0]+40*Math.cos(ha),m1[1]+40*Math.sin(ha),180-(90-p.w/2),0.01,'');
  line(s,m1[0]+60*Math.cos(ha),m1[1]+60*Math.sin(ha),m1[0],m1[1],{stroke:CF,'stroke-width':3,'marker-end':'url(#aF)'});txt(s,m1[0]-60,m1[1]-12,o.FN1||'F_N1 = ?',{fill:CF,'font-weight':600,'font-size':13});
  line(s,m2[0]-60*Math.cos(ha),m2[1]+60*Math.sin(ha),m2[0],m2[1],{stroke:CF,'stroke-width':3,'marker-end':'url(#aF)'});txt(s,m2[0]+16,m2[1]-12,o.FN2||'F_N2 = ?',{fill:CF,'font-weight':600,'font-size':13});txt(s,cx,yv+30,`${p.w}°`,{'text-anchor':'middle','font-size':14});return s;}
function drawSStirn(p,o={}){const s=mkSvg(280),x0=200,y0=40,W=240,H=200,b=dg(p.be);s.append(el('rect',{x:x0,y:y0,width:W,height:H,fill:'#a9cbee',stroke:'#2b4c7e'}));for(let x=x0+6;x+H*Math.tan(b)<x0+W;x+=24)line(s,x,y0,x+H*Math.tan(b),y0+H,{stroke:'#2b4c7e'});
  const c=[x0+W/2,y0+H/2-30],L=130;line(s,c[0],c[1],c[0]+L*Math.sin(b),c[1]+L*Math.cos(b),{stroke:INK,'stroke-width':3.4,'marker-end':'url(#aD)'});txt(s,c[0]+L*Math.sin(b)+8,c[1]+L*Math.cos(b),o.FN||`F_N = ${p.FN} N`,{'font-weight':600});
  force(s,c[0],c[1],c[0],c[1]+L*Math.cos(b),'',0,0);txt(s,c[0]-8,c[1]+L*Math.cos(b)-6,o.Fu||'F_u = ?',{fill:CF,'font-weight':600,'text-anchor':'end'});force(s,c[0],c[1],c[0]+L*Math.sin(b),c[1],'',0,0);txt(s,c[0]+L*Math.sin(b)+6,c[1]-6,o.Fa||'F_a = ?',{fill:CF,'font-weight':600});
  line(s,c[0],c[1],c[0],c[1]-40,{stroke:'#777','stroke-dasharray':'4 3'});txt(s,c[0]+14,c[1]+34,`β = ${p.be}°`,{'font-size':13});txt(s,30,30,'Schrägstirnrad (Zahnflanken von vorne)',{'font-size':13});return s;}
function drawKeil(p,o={}){const s=mkSvg(310),a=dg(p.al),yb=230,x1=200,x2=470,yT=yb-(x2-x1)*Math.tan(a);s.append(el('rect',{x:60,y:40,width:40,height:220,fill:'url(#hat)',stroke:'#555'}));s.append(el('rect',{x:60,y:yb,width:500,height:30,fill:'url(#hat)',stroke:'#555'}));
  s.append(el('polygon',{points:`${x1},${yb} ${x2},${yb} ${x2},${yT}`,fill:'#a7a9c4',stroke:'#555'}));s.append(el('polygon',{points:`100,${yb-20} 100,60 ${x2},60 ${x2},${yT-4} ${x1},${yb-4} ${x1},${yb-20}`,fill:'#a9cbee',stroke:'#2b4c7e'}));
  line(s,100,yb-12,x1+60,yb-12,{stroke:'#555','stroke-width':8});txt(s,120,yb-24,'Schraube',{'font-size':12});force(s,330,10,330,58,o.FG||`F_G = ${p.FG} kN`,340,30);
  force(s,60,100,98,100,'',0,0);txt(s,54,92,o.FNA||'F_NA',{fill:CF,'font-weight':600,'text-anchor':'end','font-size':13});const m=[(x1+x2)/2+40,yb-((x2-x1)/2+40)*Math.tan(a)];line(s,m[0]+50*Math.sin(a),m[1]-50*Math.cos(a)+50*0,m[0],m[1],{stroke:CF,'stroke-width':3,'marker-end':'url(#aF)'});
  txt(s,m[0]+12,m[1]-40,o.FNB||'F_NB',{fill:CF,'font-weight':600,'font-size':13});force(s,x2-40,yb+60,x2-40,yb+4,'',0,0);txt(s,x2-30,yb+56,o.FNC||'F_NC',{fill:CF,'font-weight':600,'font-size':13});force(s,x1+80,yb-12,x1+20,yb-12,'',0,0);txt(s,x1+86,yb-26,o.F||'F',{fill:CF,'font-weight':600,'font-size':13});
  txt(s,x2-60,yT+60,`${p.al}°`,{'font-size':13});return s;}
function drawKnie(p,o={}){const s=mkSvg(300),cy=110,L=150,a=dg(p.al),jx=320,jy=cy+L*Math.sin(a)*1,xL=jx-L*Math.cos(a),xR=jx+L*Math.cos(a);s.append(el('rect',{x:xL-40,y:cy-60,width:30,height:120,fill:'url(#hat)',stroke:'#555'}));
  s.append(el('rect',{x:xR+10,y:cy-60,width:24,height:120,fill:'#a9cbee',stroke:'#2b4c7e'}));s.append(el('rect',{x:xR+34,y:cy-40,width:50,height:80,fill:'#f0c987',stroke:CBs}));txt(s,xR+59,cy-48,'Werkzeug',{'font-size':12,'text-anchor':'middle'});
  line(s,xL-10,cy,jx,jy,{stroke:'#777','stroke-width':10});line(s,jx,jy,xR+10,cy,{stroke:'#777','stroke-width':10});[xL-10,jx,xR+10].forEach((x,i)=>pin(s,x,i==1?jy:cy));txt(s,(xL+jx)/2-10,(cy+jy)/2+26,'1',{'font-weight':600});txt(s,(xR+jx)/2+10,(cy+jy)/2+26,'2',{'font-weight':600});
  s.append(el('rect',{x:jx-14,y:jy+8,width:28,height:90,fill:'#d7dbe2',stroke:'#555'}));force(s,jx+30,jy+90,jx+30,jy+20,'',0,0);txt(s,jx+40,jy+70,o.F||`F = ${p.F} kN (Kolben)`,{fill:CF,'font-weight':600,'font-size':13});
  line(s,xL-10,cy,xR+10,cy,{stroke:'#777','stroke-dasharray':'4 3'});txt(s,xR-50,cy+18,'α',{'font-size':14});force(s,xR+90,cy,xR+140,cy,'',0,0);txt(s,xR+92,cy-12,o.Fs||'F_s = ?',{fill:CF,'font-weight':600,'font-size':13});return s;}
function drawLeine(p,o={}){const s=mkSvg(280),y=60,a=dg(p.al),xL=110,xR=530,xm=320,ym=y+(xm-xL)*Math.tan(a);ground(s,60,250,520,10);[xL,xR].forEach(x=>s.append(el('rect',{x:x-8,y:y-10,width:16,height:260-y,fill:'#a7a9c4',stroke:'#555'})));
  line(s,xL,y,xm,ym,{stroke:'#444','stroke-width':2.5});line(s,xm,ym,xR,y,{stroke:'#444','stroke-width':2.5});box(s,xm-22,ym+6,44,36);force(s,xm,ym+44,xm,ym+90,o.FG||`F_G = ${p.FG} N`,xm+10,ym+80);
  line(s,xL,y,xL+120,y,{stroke:'#777','stroke-dasharray':'4 3'});txt(s,xL+60,y-8,`α = ${p.al}°`,{'font-size':13});fA(s,xm,ym,180-p.al,70,o.FS||'F_S = ?',{dy:-14,dx:-50});return s;}
const KB=[
{id:'kbx',lvl:1,src:'Buch Kräfte, Beispiel',title:'Spannzylinder mit Rückholfeder',gen:bk({F1:320,F2:80,Mk:8},()=>({F1:pick([240,320,400,500]),F2:pick([60,80,100]),Mk:pick([5,8,10])})),draw:p=>drawSpZyl(p),

 asks:p=>[{k:'a) l_1',unit:'mm',v:p.F1/p.Mk},{k:'a) l_2',unit:'mm',v:p.F2/p.Mk},{k:'b) F_r',unit:'N',v:p.F1-p.F2}],hints:p=>['Pfeillänge l = F : M_k','Gleiche Wirkungslinie, Gegenrichtung: F_r = F_1 − F_2'],
 sol:p=>[`a) ${eq(l('l_1')+' = '+p.F1+' : '+p.Mk+' = '+fmt(p.F1/p.Mk)+' mm')}, ${eq(l('l_2')+' = '+p.F2+' : '+p.Mk+' = '+fmt(p.F2/p.Mk)+' mm')}`,`b) ${eq(f('F_r')+' = '+p.F1+' − '+p.F2+' = '+f((p.F1-p.F2)+' N'))}`,'Grafisch: Pfeil l_2 an die Spitze von l_1 setzen, aber rückwärts. Die Resultierende reicht von A bis E.'],
 solDraw:p=>drawPlan([{F:p.F1,a:180,lab:'F_1'},{F:p.F2,a:0,lab:'F_2'}],{R:`F_r = ${p.F1-p.F2} N`,h:200,Mk:p.Mk})},
{id:'kb1',lvl:2,src:'Buch Kräfte, Nr. 1',title:'Freileitungsmast',gen:bk({F1:800,F2:1200,a1:50,Mk:25},()=>({F1:pick([600,800,1000]),F2:pick([900,1200,1500]),a1:50,Mk:25})),draw:p=>drawMastB(p),
 text:p=>`Zwei waagrechte Drähte ziehen am Mast mit ${f('F_1 = '+p.F1+' N')} und ${f('F_2 = '+p.F2+' N')}. Sie stehen rechtwinklig zueinander. a) Wie gross ist die Resultierende F_r? b) Welchen Winkel bildet F_r mit F_1? c) In welche Richtung muss ein Spannseil wirken, damit der Mast sich nicht biegt? (Gib den Winkel zu F_1 an, gemessen auf der anderen Seite.) M_k = ${p.Mk} N/mm.`+BW(p),
 asks:p=>{const a=Math.atan2(p.F2,p.F1)*180/Math.PI;return [{k:'a) F_r',unit:'N',v:Math.hypot(p.F1,p.F2)},{k:'b) Winkel F_r zu F_1',unit:'°',v:a},{k:'c) Winkel Seil zu F_1',unit:'°',v:180-a}];},
 hints:p=>['Rechtwinklig: Pythagoras, F_r = √(F_1² + F_2²).','tan φ = F_2 : F_1','Das Spannseil zieht genau entgegen F_r: 180° − φ.'],
 sol:p=>{const R=Math.hypot(p.F1,p.F2),a=Math.atan2(p.F2,p.F1)*180/Math.PI;return [`Pfeillängen: ${eq(p.F1+' : '+p.Mk+' = '+fmt(p.F1/p.Mk)+' mm')}, ${eq(p.F2+' : '+p.Mk+' = '+fmt(p.F2/p.Mk)+' mm')}`,`a) ${eq(f('F_r')+' = √('+p.F1+'² + '+p.F2+'²) = '+f(fmt(R)+' N'))} (Pfeil ${fmt(R/p.Mk)} mm)`,`b) ${eq('tan φ = '+p.F2+' : '+p.F1+' ⇒ φ = '+fmt(a,1)+'°')}`,`c) Das Spannseil zieht entgegen F_r: ${eq('180° − '+fmt(a,1)+'° = '+fmt(180-a,1)+'°')} zu F_1.`];},
 solDraw:p=>drawMastB(p,{res:1})},
{id:'kb2',lvl:2,src:'Buch Kräfte, Nr. 2',title:'Seilrolle: Kraft auf die Achse',gen:bk({FG:1500,al:45,Mk:50},()=>({FG:pick([1000,1500,2000]),al:pick([30,45,60]),Mk:50})),draw:p=>drawSeilR(p),
 text:p=>`Eine Last ${f('F_G = '+p.FG+' N')} wird über eine Seilrolle hochgezogen. Das Zugseil verläuft um ${p.al}° zur Senkrechten geneigt. Wie gross ist die Resultierende F_r auf die Achse? M_k = ${p.Mk} N/mm.`+BW(p),
 asks:p=>{const g2=180-p.al;return [{k:'Winkel zwischen den Seilkräften',unit:'°',v:g2},{k:'F_r',unit:'N',v:2*p.FG*Math.cos(dg(g2/2))}];},
 hints:p=>['Beide Seilstränge ziehen mit F_G an der Rolle: einer nach unten, einer schräg nach oben.','Winkel zwischen den beiden Kräften: 180° − '+p.al+'°.','Gleich grosse Kräfte: F_r = 2 · F · cos(Winkel : 2).'],
 sol:p=>{const g2=180-p.al,R=2*p.FG*Math.cos(dg(g2/2));return [`Beide Stränge ziehen mit ${p.FG} N. Winkel zwischen ihnen: ${eq('180° − '+p.al+'° = '+g2+'°')}`,`${eq(f('F_r')+' = 2 · '+p.FG+' · cos '+fmt(g2/2,1)+'° = '+f(fmt(R)+' N'))}`,`Grafisch: Pfeile je ${fmt(p.FG/p.Mk)} mm, F_r misst ${fmt(R/p.Mk)} mm.`,'Zieht man senkrecht nach unten (0°), wäre F_r = 2 · F_G. Je schräger, desto kleiner.'];},
 solDraw:p=>drawPlan([{F:p.FG,a:-90,lab:'F_G'},{F:p.FG,a:90+p.al,lab:'F'}],{R:`F_r = ${fmt(2*p.FG*Math.cos(dg((180-p.al)/2)))} N`,h:300})},
{id:'kb4',lvl:2,src:'Buch Kräfte, Nr. 4',title:'Hubseil: zulässige Last je nach Winkel',gen:bk({F:10},()=>({F:pick([8,10,12.5])})),draw:p=>drawHubseil({F:p.F,al:60}),
 text:p=>`Ein Hubseil mit der Tragkraft ${f('F = '+fmt(p.F)+' kN')} je Strang hebt Behälter mit zwei Strängen. Wie gross ist die zulässige Gewichtskraft F_G bei den Lastzugwinkeln α = 30°, 60°, 90° und 120°?`+BW(p),
 asks:p=>[30,60,90,120].map(a=>({k:'F_G bei '+a+'°',unit:'kN',v:2*p.F*Math.cos(dg(a/2))})),hints:p=>['Jeder Strang ist um α : 2 zur Senkrechten geneigt.','Senkrechter Anteil je Strang: F · cos(α : 2). Zwei Stränge: F_G = 2 · F · cos(α : 2).'],

];

{id:'zb5',lvl:2,src:'Buch Kräfte, Nr. 5',title:'V-Führung einer Werkzeugmaschine',gen:bk({F:3.5,w:90},()=>({F:pick([2,3.5,5]),w:pick([60,90,120])})),draw:p=>drawVF(p),

{id:'zb6',lvl:1,src:'Buch Kräfte, Nr. 6',title:'Schrägstirnrad',gen:bk({FN:140,be:15},()=>({FN:pick([140,500,1200]),be:pick([10,15,20])})),draw:p=>drawSStirn(p),

{id:'zb7',lvl:3,src:'Buch Kräfte, Nr. 7',title:'Keilspanner',gen:bk({FG:25,al:20},()=>({FG:pick([15,25,40]),al:pick([10,15,20])})),draw:p=>drawKeil(p),

{id:'zb8',lvl:3,src:'Buch Kräfte, Nr. 8',title:'Schliesseinheit mit Kniehebel',gen:bk({F:10},()=>({F:pick([5,10,15])})),draw:p=>drawKnie({F:p.F,al:10}),

/* ---------- Biegen: Zuschnitt und Rückfederung ---------- */
const kKor=(r,s)=>Math.min(1,0.65+0.5*Math.log10(r/s));
const vAus=(r,s,b)=>{const k=kKor(r,s),z=Math.PI*(180-b)/180*(r+s/2*k);return b<=90?2*(r+s)-z:b<=165?2*(r+s)*Math.tan(dg((180-b)/2))-z:0;};
function drawBieg(p,o={}){const s=mkSvg(300),k=Math.min(4,190/Math.max(p.a,p.b===undefined||isNaN(p.b)?p.a:p.b)),th=Math.max(5,p.s*k),be=dg(p.be),x0=p.be>100?240:120,y0=250,rr=Math.max(10,p.r*k);
  const ax=x0+p.a*k;/* Schenkel a waagrecht, Schenkel b unter Öffnungswinkel β */const bb=isNaN(p.b)?p.a:p.b,d=[Math.cos(be),-Math.sin(be)],B=[x0+d[0]*bb*k,y0+d[1]*bb*k];
  s.append(el('path',{d:`M${ax},${y0} L${x0},${y0} L${B[0]},${B[1]}`,fill:'none',stroke:'#2b4c7e','stroke-width':th,'stroke-linejoin':'round'}));s.append(el('path',{d:`M${ax},${y0} L${x0},${y0} L${B[0]},${B[1]}`,fill:'none',stroke:'#a9cbee','stroke-width':th-3,'stroke-linejoin':'round'}));
  dimH(s,x0,ax,y0+36,`a = ${p.a}`,y0+th/2);txt(s,(x0+B[0])/2-14,(y0+B[1])/2,`b = ${p.b}`,{fill:CL,'font-size':14,'text-anchor':'end'});
  if(p.c){const C=[B[0]+p.c*k,B[1]];[['#2b4c7e',th],['#a9cbee',th-3]].forEach(([c,w])=>s.append(el('path',{d:`M${x0},${B[1]+1} L${B[0]},${B[1]} L${C[0]},${C[1]}`,fill:'none',stroke:c,'stroke-width':w,'stroke-linejoin':'round'})));txt(s,(B[0]+C[0])/2,B[1]-14,`c = ${p.c}`,{fill:CL,'font-size':14,'text-anchor':'middle'});}
  txt(s,x0+40,y0-30,`β = ${p.be}°`,{'font-size':14});txt(s,380,40,`s = ${p.s} mm`,{'font-size':14});txt(s,380,62,`r = ${p.r} mm (innen)`,{'font-size':14});txt(s,380,84,o.L||'L = ?',{'font-size':14,'font-weight':600});return s;}
function drawRueck(p,o={}){const s=mkSvg(280),cx=200,cy=230,L=170;line(s,cx,cy,cx+L+60,cy,{stroke:'#2b4c7e','stroke-width':6});const a1=dg(180-p.a1),a2=dg(180-p.a2);
  line(s,cx,cy,cx+L*Math.cos(dg(180)-a2+Math.PI),cy,{stroke:'none'});const e1=[cx-L*Math.cos(dg(p.a1)),cy-L*Math.sin(dg(p.a1))],e2=[cx-L*Math.cos(dg(p.a2)),cy-L*Math.sin(dg(p.a2))];
  if(p.a1){line(s,cx,cy,e1[0],e1[1],{stroke:'#777','stroke-width':4,'stroke-dasharray':'6 4'});}else txt(s,cx-20,40,o.l1||'am Werkzeug: α_1 = ?',{'font-size':13,'text-anchor':'end',fill:'#5a6673'});line(s,cx,cy,e2[0],e2[1],{stroke:'#2b4c7e','stroke-width':6});if(p.a1)txt(s,e1[0]+14,e1[1]-24,o.l1||'am Werkzeug: α_1 = ?',{'font-size':13});txt(s,e2[0]+10,e2[1]-6,`am Werkstück: α_2 = ${p.a2}°`,{'font-size':13});
  txt(s,420,60,`k_R = ${fmt(p.kR,2)}`,{'font-size':14});txt(s,420,82,`r_2 = ${p.r2} mm, s = ${p.s} mm`,{'font-size':14});return s;}

{id:'gb1',lvl:1,src:'Biegen, Grundaufgabe',title:'Winkel 90°: Zuschnitt mit Tabellenwert',gen(){return {a:pick([40,50,60]),b:pick([25,30,40]),s:pick([1,2,3]),r:pick([4,6,10]),be:90};},draw:p=>drawBieg(p),
 text:p=>`Ein Blechwinkel (s = ${p.s} mm) wird auf 90° gebogen, Biegeradius r = ${p.r} mm. Die Schenkel sind aussen gemessen a = ${p.a} mm und b = ${p.b} mm. Der Ausgleichswert ist v = ${fmt(vAus(p.r,p.s,90),1)} mm (Tabelle DIN 6935). Wie gross ist die gestreckte Länge L?`,

{id:'gb2',lvl:2,src:'Biegen, Formel',title:'Ausgleichswert selbst berechnen',gen(){return {s:pick([2,3,4]),r:pick([6,10,16]),a:pick([50,80]),b:pick([40,60]),be:90};},draw:p=>drawBieg(p),
 text:p=>`Berechnen Sie für s = ${p.s} mm, r = ${p.r} mm und β = 90° a) den Korrekturfaktor k, b) den Ausgleichswert v und c) die gestreckte Länge L für a = ${p.a} mm und b = ${p.b} mm.`,
 asks:p=>{const k=kKor(p.r,p.s),v=vAus(p.r,p.s,90);return [{k:'a) k',unit:'',v:k},{k:'b) v',unit:'mm',v},{k:'c) L',unit:'mm',v:p.a+p.b-v}];},
 hints:p=>['k = 0,65 + 0,5 · lg(r : s)','β = 90°: v = 2 · (r + s) − π · (90° : 180°) · (r + s/2 · k)','L = a + b − v'],
 sol:p=>{const k=kKor(p.r,p.s),v=vAus(p.r,p.s,90);return [`a) ${eq('k = 0,65 + 0,5 · lg('+p.r+' : '+p.s+') = '+fmt(k,3))}`,`b) ${eq('v = 2 · ('+p.r+' + '+p.s+') − π/2 · ('+p.r+' + '+p.s/2+' · '+fmt(k,3)+') = '+fmt(v,2)+' mm')}`,`c) ${eq('L = '+p.a+' + '+p.b+' − '+fmt(v,2)+' = '+fmt(p.a+p.b-v,1)+' mm')}`,'Vergleich mit der Tabelle: Dort steht gerundet '+fmt(v,1)+' mm.'];}},
{id:'gb3',lvl:2,src:'Biegen, zwei Biegestellen',title:'U-Profil aus Blech',gen(){return {a:pick([30,40]),b:pick([60,80]),c:pick([30,40]),s:pick([2,3]),r:pick([4,6])};},draw:p=>drawBieg({a:p.a,b:p.b,c:p.c,s:p.s,r:p.r,be:90}),
 text:p=>`Ein U-Profil (s = ${p.s} mm, r = ${p.r} mm) hat zwei 90°-Biegungen. Die Aussenmasse sind ${p.a}, ${p.b} und ${p.c} mm. Wie gross ist die gestreckte Länge?`,

 sol:p=>{const v=vAus(p.r,p.s,90);return [`${eq('v = '+fmt(v,2)+' mm')} (Formel oder Tabelle)`,`${eq('L = '+p.a+' + '+p.b+' + '+p.c+' − 2 · '+fmt(v,2)+' = '+fmt(p.a+p.b+p.c-2*v,1)+' mm')}`];}},
{id:'gb4',lvl:3,src:'Biegen, stumpfer Winkel',title:'Biegung mit β = 120°',gen(){return {a:pick([40,60]),b:pick([40,50]),s:2,r:pick([4,6]),be:pick([110,120,135])};},draw:p=>drawBieg(p),
 text:p=>`Ein Blech (s = ${p.s} mm, r = ${p.r} mm) wird so gebogen, dass der Öffnungswinkel β = ${p.be}° beträgt. Aussenmasse a = ${p.a} mm, b = ${p.b} mm. Berechnen Sie k, v und L.`,
 asks:p=>{const k=kKor(p.r,p.s),v=vAus(p.r,p.s,p.be);return [{k:'k',unit:'',v:k},{k:'v',unit:'mm',v},{k:'L',unit:'mm',v:p.a+p.b-v}];},
 hints:p=>['β über 90° bis 165°: v = 2 · (r + s) · tan((180° − β) : 2) − π · ((180° − β) : 180°) · (r + s/2 · k)','L = a + b − v'],
 sol:p=>{const k=kKor(p.r,p.s),v=vAus(p.r,p.s,p.be),h=(180-p.be)/2;return [`${eq('k = 0,65 + 0,5 · lg('+p.r+' : '+p.s+') = '+fmt(k,3))}`,`${eq('v = 2 · '+(p.r+p.s)+' · tan '+h+'° − π · '+(180-p.be)+'/180 · ('+p.r+' + '+p.s/2+' · '+fmt(k,3)+') = '+fmt(v,2)+' mm')}`,`${eq('L = '+p.a+' + '+p.b+' − '+fmt(v,2)+' = '+fmt(p.a+p.b-v,1)+' mm')}`,'Je stumpfer der Winkel, desto kleiner v. Ab 165° ist v praktisch null.'];}},
{id:'gb5',lvl:2,src:'Biegen, Rückfederung',title:'Rückfederung: Werkzeug richtig einstellen',gen(){return {a2:90,s:pick([1,2]),r2:pick([10,20]),kR:pick([0.96,0.93,0.90])};},draw:p=>drawRueck(p),

{id:'mbx',lvl:1,src:'nach Buch Schraube, Beispiel',title:'Spindelpresse prägt',gen:bk({F1:120,d:1200,P:6},()=>({F1:pick([80,120,150]),d:pick([800,1200]),P:pick([4,6,8])})),draw:p=>drawSpPr(p),

{id:'mb10',lvl:2,src:'nach Buch, Nr. 3',title:'Schraubstock mit Spannhebel',gen:bk({F2:12,r:250,P:5,v:70},()=>({F2:pick([8,12,15]),r:pick([200,250]),P:pick([4,5,6]),v:pick([60,70])})),draw:p=>drawSpPr({d:2*p.r,P:p.P,F1:'?'},{F1:'F_1 = ?',F2:`F_2 = ${p.F2} kN`,note:`Schraubstock: Hebelradius ${p.r} mm, Gewinde Tr 22 × ${p.P}`}),

 asks:p=>{const a=Math.atan2(p.h/2,p.w/2),FI=p.FG*1000/(2*Math.sin(a)),F2=p.FG*1000/Math.tan(a);return [{k:'a) α',unit:'°',v:a*180/Math.PI},{k:'b) F_I',unit:'N',v:FI},{k:'c) F_2',unit:'N',v:F2},{k:'d) F_1',unit:'N',v:F2*p.P/(2*Math.PI*p.r*(1-p.v/100))}];},

 sol:p=>{const a=Math.atan2(p.h/2,p.w/2),FI=p.FG*1000/(2*Math.sin(a)),F2=p.FG*1000/Math.tan(a),F1=F2*p.P/(2*Math.PI*p.r*(1-p.v/100));return [`a) ${eq('tan α = '+p.h/2+' : '+p.w/2+' ⇒ α = '+fmt(a*180/Math.PI,2)+'°')}`,`b) ${eq(f('F_I')+' = '+p.FG*1000+' : (2 · sin '+fmt(a*180/Math.PI,2)+'°) = '+f(fmt(FI)+' N'))}`,`c) ${eq(f('F_2')+' = 2 · '+fmt(FI)+' · cos α = '+f(fmt(F2)+' N'))}`,`d) ${eq(f('F_1')+' = '+fmt(F2)+' · '+p.P+' : (2π · '+p.r+' · '+fmt(1-p.v/100,2)+') = '+f(fmt(F1)+' N'))}`,'Je tiefer der Wagenheber steht (flache Stangen), desto grösser F_2. Am Anfang kurbelt man darum am schwersten.'];}}

  s.append(el('rect',{x:xP-12,y:y-R,width:24,height:2*R,fill:'#cfe0f3',stroke:'#2b4c7e'}));line(s,xP,y-R,xP+110,y-R+6,{stroke:'#444','stroke-width':5});line(s,xP,y+R,xP+110,y+R-6,{stroke:'#444','stroke-width':5});
  fA(s,xP+40,y-R+2,-3,50,o.F1||'F_1',{dy:-8});fA(s,xP+40,y+R-2,3,50,o.F2||'F_2',{dy:20});txt(s,xP+30,y-R-22,'Zugtrum',{'font-size':12});txt(s,xP+30,y+R+34,'Leertrum',{'font-size':12});txt(s,xP+16,y+4,`d = ${p.d}`,{fill:CL,'font-size':13});
  txt(s,xA-4,y-24,'A',{'font-weight':600,'text-anchor':'end'});txt(s,xB+4,y-24,'B',{'font-weight':600});dimH(s,xA,xB,290,`l = ${p.l}`,y+16);dimH(s,xB,xP,290,`c = ${p.c}`,y+16);txt(s,30,28,'Draufsicht: Riemenkräfte wirken waagrecht',{'font-size':13});return s;}
function drawRampW(p,o={}){const s=mkSvg(300),a=dg(p.al),x0=60,y0=260,L=330,xT=x0+L*Math.cos(a),yT=y0-L*Math.sin(a);s.append(el('polygon',{points:`${x0},${y0} ${xT},${y0} ${xT},${yT}`,fill:'#e6e0d0',stroke:'#7a6a4a'}));
  const bx=x0+L*0.45*Math.cos(a),by=y0-L*0.45*Math.sin(a);const gp=el('g',{transform:`rotate(${-p.al} ${bx} ${by})`});s.append(gp);gp.append(el('rect',{x:bx-26,y:by-34,width:52,height:34,fill:'#f0c987',stroke:CBs}));
  line(s,bx+26*Math.cos(a),by-26*Math.sin(a)-17*Math.cos(a),xT+40,yT-20,{stroke:'#444','stroke-width':2.5});s.append(el('rect',{x:xT+10,y:yT-60,width:80,height:60,rx:6,fill:'#d7dbe2',stroke:'#555'}));pulley(s,xT+50,yT-20,22,{fill:'#f3d98b'});txt(s,xT+50,yT-68,'Seilwinde',{'text-anchor':'middle','font-size':12});
  txt(s,x0+56,y0-8,`α = ${p.al}°`,{'font-size':14});txt(s,bx-30,by+30,`m = ${p.m} kg`,{'font-size':13});txt(s,30,28,`μ = ${fmt(p.mu)}, Trommel d = ${p.d} mm, Lager l = ${p.l}, a = ${p.a}`,{'font-size':13});return s;}
function drawHebelS(p,o={}){const s=mkSvg(280),y=140,xD=390,k=1.1,x1=xD-p.l1*k,x2=xD+p.l2*k;beam(s,x1-10,x2+10,y,12);s.append(el('polygon',{points:`${xD},${y+6} ${xD-18},${y+40} ${xD+18},${y+40}`,fill:'#a7a9c4',stroke:'#555'}));pin(s,xD,y);ground(s,xD-50,y+40,100,10);txt(s,xD+10,y+28,'D',{'font-weight':600});

  seil(s,x2,y+6,x2,y+80);box(s,x2-22,y+80,44,34);force(s,x2+40,y+86,x2+40,y+130,o.F2||'F_2 = ?',x2+48,y+120);dimH(s,x1,xD,y-40,`l_1 = ${p.l1}`,y-6);dimH(s,xD,x2,y-40,`l_2 = ${p.l2}`,y-6);return s;}
const KETTE=[
{id:'ke1',lvl:2,src:KE,title:'Wandkonsole mit Zugstab: nur ein Winkel gegeben',gen(){const l=pick([800,1000,1200]);return {l,a:Math.round(l*pick([0.5,0.6,0.75,1])),al:pick([25,30,35,40]),F:pick([2,3,4,5])};},
 draw:p=>drawKonsoleK(p),text:p=>`Ein waagrechter Träger (Länge ${l('l = '+p.l+' mm')}) ist bei A an der Wand gelenkig befestigt. Am Ende C hält ihn ein Zugstab, der unter ${p.al}° schräg zur Wand hochgeht. Im Abstand ${l('a = '+p.a+' mm')} hängt ${f('F = '+fmt(p.F)+' kN')}. Eigengewicht vernachlässigt. Berechnen Sie Schritt für Schritt: a) die Höhe h des oberen Wandanschlusses, b) die senkrechte Komponente F_Sy des Zugstabs (Momente um A), c) die Stabkraft F_S, d) die waagrechte Komponente F_Sx, e) die Lagerkräfte F_Ax und F_Ay und f) die gesamte Lagerkraft F_A.`,
 asks:p=>{const a=dg(p.al),Sy=p.F*p.a/p.l,S=Sy/Math.sin(a),Sx=S*Math.cos(a);return [{k:'a) h',unit:'mm',v:p.l*Math.tan(a)},{k:'b) F_Sy',unit:'kN',v:Sy},{k:'c) F_S',unit:'kN',v:S},{k:'d) F_Sx',unit:'kN',v:Sx},{k:'e) F_Ax',unit:'kN',v:Sx},{k:'e) F_Ay',unit:'kN',v:p.F-Sy},{k:'f) F_A',unit:'kN',v:Math.hypot(Sx,p.F-Sy)}];},
 hints:p=>['a) tan α = h : l','b) Drehpunkt in A. Nur F_Sy hat einen Hebelarm (l). F_Sx geht durch A. F_Sy · l = F · a','c) F_Sy ist der senkrechte Anteil: F_S = F_Sy : sin α','d) F_Sx = F_S · cos α','e) Waagrecht: F_Ax = F_Sx (der Träger drückt gegen die Wand). Senkrecht: F_Ay = F − F_Sy','f) F_A = √(F_Ax² + F_Ay²)'],
 sol:p=>{const a=dg(p.al),Sy=p.F*p.a/p.l,S=Sy/Math.sin(a),Sx=S*Math.cos(a);return [`a) ${eq(l('h')+' = '+p.l+' · tan '+p.al+'° = '+l(fmt(p.l*Math.tan(a))+' mm'))}`,`b) ${eq(f('F_Sy')+' · '+p.l+' = '+fmt(p.F)+' · '+p.a)} ⇒ ${eq(f('F_Sy')+' = '+f(fmt(Sy,3)+' kN'))}`,`c) ${eq(f('F_S')+' = '+fmt(Sy,3)+' : sin '+p.al+'° = '+f(fmt(S,3)+' kN'))} (Zug)`,`d) ${eq(f('F_Sx')+' = '+fmt(S,3)+' · cos '+p.al+'° = '+fmt(Sx,3)+' kN')}`,`e) ${eq(f('F_Ax')+' = '+fmt(Sx,3)+' kN')} (Druck gegen die Wand), ${eq(f('F_Ay')+' = '+fmt(p.F)+' − '+fmt(Sy,3)+' = '+fmt(p.F-Sy,3)+' kN')}`,`f) ${eq(f('F_A')+' = √('+fmt(Sx,3)+'² + '+fmt(p.F-Sy,3)+'²) = '+f(fmt(Math.hypot(Sx,p.F-Sy),3)+' kN'))}`,'Kette: Winkel → Hebelgesetz → Zerlegen → Gleichgewicht der Kräfte. Je flacher der Zugstab, desto grösser F_S.'];},
 solDraw:p=>{const a=dg(p.al),S=p.F*p.a/p.l/Math.sin(a);return drawKonsoleK(p,{res:1,FS:fmt(S,2)});}},
{id:'ke2',lvl:3,src:KE,title:'Schwenkkran an der Wand: oberes Lager zieht',gen(){return {h:pick([400,500,600]),a:pick([2000,2500,3000]),F:pick([5,8,10]),G:pick([1,1.5,2]),e:pick([1000,1200,1500]),n:4};},
 draw:p=>drawSchwenk(p),text:p=>`Ein Schwenkkran ist an zwei Lagern an der Wand befestigt: oben O (nimmt nur waagrechte Kräfte auf) und unten U (waagrecht und senkrecht). Der Lagerabstand ist ${l('h = '+p.h+' mm')}. Die Last ${f('F = '+fmt(p.F)+' kN')} hängt in ${l('a = '+p.a+' mm')} Ausladung. Der Ausleger wiegt ${f('G = '+fmt(p.G)+' kN')}, Schwerpunkt ${l(p.e+' mm')} von der Kransäule. Berechnen Sie a) das gesamte Kippmoment um U, b) die Lagerkraft F_O, c) die Zugkraft je Schraube am Lager O (${p.n} Schrauben), d) die Lagerkräfte F_Ux und F_Uy und e) F_U gesamt.`,
 asks:p=>{const M=p.F*p.a/1000+p.G*p.e/1000,FO=M/(p.h/1000);return [{k:'a) M',unit:'kN·m',v:M},{k:'b) F_O',unit:'kN',v:FO},{k:'c) F je Schraube',unit:'kN',v:FO/p.n},{k:'d) F_Ux',unit:'kN',v:FO},{k:'d) F_Uy',unit:'kN',v:p.F+p.G},{k:'e) F_U',unit:'kN',v:Math.hypot(FO,p.F+p.G)}];},
 hints:p=>['a) M = F · a + G · e (in m!)','b) Drehpunkt in U. Nur F_O hat den Hebelarm h: F_O · h = M','c) Das obere Lager wird von der Wand weggezogen: Die Schrauben tragen F_O auf Zug.','d) Waagrecht: F_Ux = F_O (Gegenrichtung, drückt gegen die Wand). Senkrecht trägt nur U: F_Uy = F + G'],
 sol:p=>{const M=p.F*p.a/1000+p.G*p.e/1000,FO=M/(p.h/1000);return [`a) ${eq(m('M')+' = '+fmt(p.F)+' · '+fmt(p.a/1000)+' + '+fmt(p.G)+' · '+fmt(p.e/1000)+' = '+m(fmt(M,3)+' kN·m'))}`,`b) ${eq(f('F_O')+' = '+fmt(M,3)+' : '+fmt(p.h/1000)+' = '+f(fmt(FO,2)+' kN'))} (Zug, zieht aus der Wand)`,`c) ${eq(fmt(FO,2)+' : '+p.n+' = '+fmt(FO/p.n,2)+' kN')} je Schraube`,`d) ${eq(f('F_Ux')+' = '+fmt(FO,2)+' kN')} (Druck), ${eq(f('F_Uy')+' = '+fmt(p.F+p.G)+' kN')}`,`e) ${eq(f('F_U')+' = √('+fmt(FO,2)+'² + '+fmt(p.F+p.G)+'²) = '+f(fmt(Math.hypot(FO,p.F+p.G),2)+' kN'))}`,'Kleiner Lagerabstand h ⇒ riesige Kräfte. Darum werden Wandkrane mit grossem Abstand der Lager montiert.','Warnung: Die Schrauben am oberen Lager werden auf Zug beansprucht. Sind Dübel oder Mauerwerk zu schwach, reisst der Kran aus der Wand. Dübel nach Herstellerangabe für Zuglast auslegen.'];},
 solDraw:p=>{const FO=(p.F*p.a/1000+p.G*p.e/1000)/(p.h/1000);return drawSchwenk(p,{res:1,FO:fmt(FO,1)});}},
{id:'ke3',lvl:3,src:KE,title:'Zahnradwelle: vom Drehmoment zu den Lagerkräften',gen(){return {M:pick([60,90,120,150]),d:pick([100,120,160]),l:pick([300,400,500]),a:pick([100,120,150])};},
 draw:p=>drawZWelle(p),text:p=>`Ein Motor treibt eine Welle mit ${m('M = '+p.M+' N·m')}. Das Zahnrad auf der Welle hat ${l('d = '+p.d+' mm')} und einen Eingriffswinkel von 20°. Es sitzt ${l('a = '+p.a+' mm')} neben Lager A, der Lagerabstand ist ${l('l = '+p.l+' mm')}. Berechnen Sie a) die Umfangskraft F_u, b) die Radialkraft F_r = F_u · tan 20°, c) die Zahnnormalkraft F_n (sie belastet die Welle), d) die Lagerkräfte F_A und F_B.`,
 asks:p=>{const Fu=2*p.M*1000/p.d,Fr=Fu*Math.tan(dg(20)),Fn=Fu/Math.cos(dg(20)),FB=Fn*p.a/p.l;return [{k:'a) F_u',unit:'N',v:Fu},{k:'b) F_r',unit:'N',v:Fr},{k:'c) F_n',unit:'N',v:Fn},{k:'d) F_A',unit:'N',v:Fn-FB},{k:'d) F_B',unit:'N',v:FB}];},
 hints:p=>['a) F_u = 2 · M : d (M in N·mm)','b) Die Zahnflanke drückt schräg: Radialanteil F_r = F_u · tan 20°','c) F_u und F_r stehen rechtwinklig: F_n = √(F_u² + F_r²) = F_u : cos 20°','d) F_n wirkt quer auf die Welle. Drehpunkt A: F_B · l = F_n · a, dann F_A = F_n − F_B.'],
 sol:p=>{const Fu=2*p.M*1000/p.d,Fr=Fu*Math.tan(dg(20)),Fn=Fu/Math.cos(dg(20)),FB=Fn*p.a/p.l;return [`a) ${eq(f('F_u')+' = 2 · '+p.M*1000+' : '+p.d+' = '+f(fmt(Fu)+' N'))}`,`b) ${eq(f('F_r')+' = '+fmt(Fu)+' · tan 20° = '+f(fmt(Fr)+' N'))}`,`c) ${eq(f('F_n')+' = '+fmt(Fu)+' : cos 20° = '+f(fmt(Fn)+' N'))}`,`d) ${eq(f('F_B')+' = '+fmt(Fn)+' · '+p.a+' : '+p.l+' = '+f(fmt(FB)+' N'))}, ${eq(f('F_A')+' = '+fmt(Fn)+' − '+fmt(FB)+' = '+f(fmt(Fn-FB)+' N'))}`,'Kette: Drehmoment → Umfangskraft → Zerlegen (Eingriffswinkel) → Lagerkräfte. So legt man Lager in Getrieben aus.'];},
 solDraw:p=>{const Fn=2*p.M*1000/p.d/Math.cos(dg(20)),FB=Fn*p.a/p.l;return drawZWelle(p,{Fn:`F_n = ${fmt(Fn)} N`,RA:`F_A = ${fmt(Fn-FB)} N`,RB:`F_B = ${fmt(FB)} N`});}},
{id:'ke4',lvl:3,src:KE,title:'Riemenscheibe fliegend: ein Lager zieht nach unten',gen(){return {M:pick([20,30,40]),d:pick([100,125,160]),l:pick([200,250,300]),c:pick([60,80,100])};},
 draw:p=>drawRiemen(p),text:p=>`Ein Motor gibt ${m('M = '+p.M+' N·m')} an eine Riemenscheibe (${l('d = '+p.d+' mm')}) ab. Die Scheibe sitzt fliegend, also ${l('c = '+p.c+' mm')} ausserhalb von Lager B. Der Lagerabstand ist ${l('l = '+p.l+' mm')}. Annahme: Der Zugtrum zieht doppelt so stark wie der Leertrum (F_1 = 2 · F_2), beide parallel. Berechnen Sie a) die Umfangskraft F_u = F_1 − F_2, b) F_2 und F_1, c) die Wellenbelastung F_W = F_1 + F_2, d) die Lagerkraft F_B und e) die Lagerkraft F_A (mit Richtung).`,
 asks:p=>{const Fu=2*p.M*1000/p.d,FW=3*Fu,FB=FW*(p.l+p.c)/p.l;return [{k:'a) F_u',unit:'N',v:Fu},{k:'b) F_2',unit:'N',v:Fu},{k:'b) F_1',unit:'N',v:2*Fu},{k:'c) F_W',unit:'N',v:FW},{k:'d) F_B',unit:'N',v:FB},{k:'e) F_A (Betrag)',unit:'N',v:FB-FW}];},
 hints:p=>['a) F_u = 2 · M : d','b) F_1 − F_2 = F_u und F_1 = 2 · F_2 ⇒ F_2 = F_u, F_1 = 2 · F_u','c) Beide Trume ziehen in dieselbe Richtung: addieren.','d) Drehpunkt in A: F_B · l = F_W · (l + c)','e) Gleichgewicht: F_A = F_B − F_W. Lager A wird in die Gegenrichtung gezogen!'],
 sol:p=>{const Fu=2*p.M*1000/p.d,FW=3*Fu,FB=FW*(p.l+p.c)/p.l;return [`a) ${eq(f('F_u')+' = 2 · '+p.M*1000+' : '+p.d+' = '+f(fmt(Fu)+' N'))}`,`b) ${eq(f('F_2')+' = '+fmt(Fu)+' N')}, ${eq(f('F_1')+' = '+fmt(2*Fu)+' N')}`,`c) ${eq(f('F_W')+' = '+fmt(3*Fu)+' N')}`,`d) ${eq(f('F_B')+' = '+fmt(FW)+' · ('+p.l+' + '+p.c+') : '+p.l+' = '+f(fmt(FB)+' N'))}`,`e) ${eq(f('F_A')+' = '+fmt(FB)+' − '+fmt(FW)+' = '+f(fmt(FB-FW)+' N'))}, Richtung entgegen F_W`,'Bei fliegender Anordnung ist F_B grösser als die Last. Das innere Lager A hebt ab und muss nach der Gegenseite halten.'];}},
{id:'ke5',lvl:3,src:KE,title:'Seilwinde an der Rampe: Masse → Seilkraft → Drehmoment → Lager',gen(){return {m:pick([300,500,800]),al:pick([15,20,25,30]),mu:pick([0.1,0.15,0.2]),d:pick([150,200,250]),l:pick([400,500]),a:pick([120,150,200])};},
 draw:p=>drawRampW(p),text:p=>`Eine Kiste (m = ${p.m} kg) wird mit einer Seilwinde eine Rampe mit α = ${p.al}° hochgezogen. Gleitreibung μ = ${fmt(p.mu)}. Das Seil läuft parallel zur Rampe auf eine Trommel ${l('d = '+p.d+' mm')}. Die Trommelwelle liegt in zwei Lagern A und B (${l('l = '+p.l+' mm')}), die Trommel sitzt ${l('a = '+p.a+' mm')} neben A. Berechnen Sie a) F_G, b) die Seilkraft F_S, c) das Drehmoment an der Trommel und d) die Lagerkräfte F_A und F_B (die Seilkraft wirkt quer auf die Welle).`,
 asks:p=>{const G=p.m*9.81,a=dg(p.al),S=G*(Math.sin(a)+p.mu*Math.cos(a));return [{k:'a) F_G',unit:'N',v:G},{k:'b) F_S',unit:'N',v:S},{k:'c) M',unit:'N·m',v:S*p.d/2000},{k:'d) F_A',unit:'N',v:S*(p.l-p.a)/p.l},{k:'d) F_B',unit:'N',v:S*p.a/p.l}];},
 hints:p=>['a) F_G = m · g','b) F_S = F_H + F_R = F_G · sin α + μ · F_G · cos α','c) M = F_S · d : 2','d) Drehpunkt A: F_B · l = F_S · a, dann F_A = F_S − F_B.'],
 sol:p=>{const G=p.m*9.81,a=dg(p.al),FH=G*Math.sin(a),FR=p.mu*G*Math.cos(a),S=FH+FR;return [`a) ${eq(f('F_G')+' = '+p.m+' · 9,81 = '+fmt(G)+' N')}`,`b) ${eq(f('F_H')+' = '+fmt(FH)+' N')}, ${eq(f('F_R')+' = '+fmt(FR)+' N')}, ${eq(f('F_S')+' = '+f(fmt(S)+' N'))}`,`c) ${eq(m('M')+' = '+fmt(S)+' · '+fmt(p.d/2000,3)+' = '+m(fmt(S*p.d/2000)+' N·m'))}`,`d) ${eq(f('F_B')+' = '+fmt(S)+' · '+p.a+' : '+p.l+' = '+fmt(S*p.a/p.l)+' N')}, ${eq(f('F_A')+' = '+fmt(S*(p.l-p.a)/p.l)+' N')}`,'Vier Kapitel in einer Kette: Gewichtskraft, schiefe Ebene mit Reibung, Drehmoment, Lagerkräfte.'];}},
{id:'ke6',lvl:2,src:KE,title:'Hebel mit schrägem Zug: wirksamer Hebelarm zuerst',gen(){return {l1:pick([150,180,200]),l2:pick([80,100,120]),be:pick([30,45,60]),F1:pick([200,300,400])};},
 draw:p=>drawHebelS(p),text:p=>`An einem Hebel (Drehpunkt D) zieht links ${f('F_1 = '+p.F1+' N')} unter dem Winkel β = ${p.be}° zum Hebel. Rechts hält der Hebel eine Last F_2. Die Hebelarme sind ${l('l_1 = '+p.l1+' mm')} und ${l('l_2 = '+p.l2+' mm')}. Berechnen Sie a) den wirksamen Hebelarm r_1 von F_1, b) das Drehmoment M_1, c) die Last F_2 im Gleichgewicht, d) die Lagerkraft im Drehpunkt D mit F_Dx, F_Dy und F_D.`,

 const start=H('button',{class:'btn p'},'Neuen Test starten');intro.append(start);d.append(intro);const area=H('div');d.append(area);
 start.onclick=()=>{area.innerHTML='';const sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);const by=lv=>sh(pool.filter(t=>t.lvl===lv));
  let set=[...by(1).slice(0,2),...by(2).slice(0,4),...by(3).slice(0,2)];const rest=sh(pool.filter(t=>!set.includes(t)));while(set.length<Math.min(8,pool.length))set.push(rest.shift());set.sort((a,b)=>a.lvl-b.lvl);
  const cards=set.map((t,i)=>taskCard(t,i,{test:true}));cards.forEach(c=>area.append(c));const res=H('div',{class:'card'});const sub=H('button',{class:'btn p'},'Test auswerten');res.append(sub);area.append(res);
  sub.onclick=()=>{let got=0,max=0,tips=0,open=0;cards.forEach(c=>{if(!c._res){open++;const g=c._grade?null:null;}const r=c._res;if(r){got+=r.got;max+=r.max;}else{max+=c.querySelectorAll('.row label').length||1;}tips+=c._tips||0;});
   const note=Math.round((5*got/max+1)*10)/10;res.innerHTML=`<h3>Resultat: ${got} von ${max} Punkten · Note ${fmt(note,1)}</h3><p>${tips?'Du hast '+tips+' Tipp'+(tips>1?'s':'')+' genommen. An der Prüfung gibt es keine Tipps: Übe diese Aufgaben nochmals ohne.':'Ohne Tipps gelöst, wie an der Prüfung.'} ${open?'<br>'+open+' Aufgabe'+(open>1?'n':'')+' nicht beantwortet (0 Punkte).':''}</p><p>${note>=5?'Sehr gut, du bist bereit.':note>=4?'Genügend. Schau dir die Fehler an und starte einen neuen Test.':'Noch unsicher. Arbeite die Aufgaben oben im Kapitel nochmals durch.'}</p>`;const again=H('button',{class:'btn'},'Neuen Test starten');again.onclick=()=>start.click();res.append(again);res.scrollIntoView({behavior:'smooth',block:'center'});};
  cards[0].scrollIntoView({behavior:'smooth'});};}
