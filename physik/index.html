<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik-Trainer: Kräfte, Drehmoment, Lagerkräfte</title><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon.svg">
<style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#18212b;--muted:#5a6673;--line:#d5dbe2;--accent:#1d5a9e;--asoft:#e3edf8;
--F:#c2185b;--L:#1d5a9e;--M:#2e7d4f;--ok:#2e7d4f;--oksoft:#e5f3ea;--bad:#b3261e;--badsoft:#fbe9e7;--warn:#8a5a00;--warnsoft:#fbf2dc;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}
header{padding:22px 0 6px}
h1{font-size:clamp(26px,5vw,36px);margin:0 0 4px;line-height:1.1}
h2{font-size:24px;margin:34px 0 10px}
h3{font-size:19px;margin:0 0 6px}
.sub{color:var(--muted);margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
button{color:var(--ink)}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:7px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.tabs button:disabled{opacity:.55;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
.card svg{display:block;width:100%;height:auto;border-radius:6px;margin:10px 0}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.lvl{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 8px;margin-right:8px}
.lvl.l1{background:var(--oksoft);color:var(--ok)}.lvl.l2{background:var(--warnsoft);color:var(--warn)}.lvl.l3{background:var(--badsoft);color:var(--bad)}
.done{float:right;color:var(--ok);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:10px 0}
.row label{display:flex;flex-direction:column;font-size:14px;color:var(--muted);gap:3px}
.inp{display:flex;align-items:center;gap:6px}
input[type=text]{font:inherit;padding:7px 9px;border:1px solid #b9c0c7;border-radius:6px;width:120px}
input[type=range]{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{font:inherit;font-size:15px;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.fb{display:none;margin-top:12px;padding:12px 14px;border-radius:8px}
.fb.ok{display:block;background:var(--oksoft)}.fb.bad{display:block;background:var(--badsoft)}.fb.info{display:block;background:var(--asoft)}
.fb ol{margin:6px 0 0;padding-left:22px}.fb li{margin:5px 0}
.cF{color:var(--F);font-weight:600}.cL{color:var(--L);font-weight:600}.cM{color:var(--M);font-weight:600}.cR{color:#6a3fb5;font-weight:600}.cW{color:#c2410c;font-weight:600}
.eq{font-family:Georgia,"Times New Roman",serif;font-size:18px;white-space:nowrap}
.formeln{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.formeln div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.formeln small{color:var(--muted);display:block}
.bars{margin:10px 0 2px}.bars div{display:flex;align-items:center;gap:8px;font-size:14px;margin:3px 0}
.bars i{display:block;height:14px;border-radius:3px;min-width:2px}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px}
.sl label{font-size:14px;color:var(--muted)}
.state{font-weight:700;padding:8px 12px;border-radius:6px;margin-top:8px}
.note{background:var(--warnsoft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-size:15px}
.road li{margin:3px 0}
.hint{font-size:14px;color:var(--muted)}
.srctag{display:inline-block;font-size:12px;font-weight:600;background:#efe7f8;color:#5b3a8c;border-radius:4px;padding:2px 8px;margin-right:6px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}.mbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;cursor:pointer;color:var(--ink)}.mbtn.on{background:var(--asoft);border-color:var(--accent);color:var(--accent);font-weight:600}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}.choices.col{grid-template-columns:1fr}.choice{font:inherit;font-size:16px;padding:12px 10px;border:1.5px solid #b9c0c7;border-radius:8px;background:#fff;cursor:pointer;color:var(--ink)}.choices.col .choice{text-align:left;font-size:15px}
.choice.sel{border-color:var(--accent);background:var(--asoft);font-weight:600}.choice.ok{border-color:var(--ok);background:var(--oksoft)}.choice.no{border-color:var(--bad);background:var(--badsoft)}.choice:disabled{cursor:default}
.row.wahl{flex-direction:column;align-items:stretch}.row.wahl label{color:var(--ink);font-size:15px;font-weight:600}.bau{margin:8px 0}

.erkl h4{margin:0 0 6px;font-size:17px}.stp .cap{background:#fff;border-radius:6px;padding:8px 12px;margin:4px 0 8px}.ebox{background:#fff;border-radius:6px;padding:10px 14px;margin-top:10px}.ebox p,.ebox ul{margin:4px 0 0}.ebox ul{padding-left:20px}.ebox.test{border-left:4px solid var(--ok)}
@media(max-width:600px){.card{padding:14px 12px;overflow-x:auto}.card svg{min-width:520px}body{font-size:16px}.eq{font-size:16px;white-space:normal}input[type=text]{width:100px}}
input,select,textarea{color:var(--ink);background-color:#fff}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2185b"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2e7d4f"/></marker>
<marker id="aD" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="9" markerHeight="5.4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0L10,3L0,6z" fill="#18212b"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6a3fb5"/></marker>
<marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
<pattern id="hat" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#bdbdbd"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.2"/></pattern>
</defs></svg>
<div class="wrap">
<header>
<h1>Physik-Trainer</h1>
<p class="sub">Technische Physik für Konstrukteure · üben mit Bildern, Farben und Lösungsweg</p>
<div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const CR='#6a3fb5',CF='#c2185b',CL='#1d5a9e',CM='#2e7d4f',INK='#18212b';
function el(t,a={},...k){const e=document.createElementNS(NS,t);for(const i in a)e.setAttribute(i,a[i]);k.forEach(c=>e.append(c));return e;}
function H(t,a={},html=''){const e=document.createElement(t);for(const i in a)e.setAttribute(i,a[i]);e.innerHTML=html;return e;}
function mkSvg(h=300){const s=el('svg',{viewBox:`0 0 640 ${h}`,role:'img'});s.append(el('rect',{x:0,y:0,width:640,height:h,fill:'#e6e7ea'}));return s;}
function sub(t){return String(t).replace(/_([A-Za-z0-9]+(?:,max)?)/g,'<tspan dy="4" font-size="70%">$1</tspan><tspan dy="-4" font-size="1">​</tspan>');}
function txt(s,x,y,t,o={}){const e=el('text',Object.assign({x,y,'font-size':15,fill:INK},o));e.innerHTML=sub(t);s.append(e);return e;}
function line(s,x1,y1,x2,y2,o={}){const e=el('line',Object.assign({x1,y1,x2,y2,stroke:INK,'stroke-width':1},o));s.append(e);return e;}
function force(s,x1,y1,x2,y2,label,lx,ly,o={}){line(s,x1,y1,x2,y2,{stroke:CF,'stroke-width':3.2,'marker-end':'url(#aF)'});if(label)txt(s,lx,ly,label,Object.assign({fill:CF,'font-weight':600},o));}
function dimH(s,x1,x2,y,label,ya,yb,o={}){const d=y<ya?-5:5;line(s,x1,ya,x1,y+d);line(s,x2,yb===undefined?ya:yb,x2,y+d);
  line(s,x1,y,x2,y,{'marker-start':'url(#aD)','marker-end':'url(#aD)'});
  if(o.out){txt(s,Math.max(x1,x2)+8,y+5,label,{fill:CL});}else txt(s,(x1+x2)/2,y-6,label,{'text-anchor':'middle',fill:CL});}
function dimV(s,y1,y2,x,label,xa){const d=x<xa?-5:5;line(s,xa,y1,x+d,y1);line(s,xa,y2,x+d,y2);
  line(s,x,y1,x,y2,{'marker-start':'url(#aD)','marker-end':'url(#aD)'});
  const my=(y1+y2)/2;txt(s,x-6,my,label,{'text-anchor':'middle',fill:CL,transform:`rotate(-90 ${x-6} ${my})`});}
function ground(s,x,y,w,h){s.append(el('rect',{x,y,width:w,height:h,fill:'url(#hat)',stroke:'#555','stroke-width':1}));}
function beam(s,x1,x2,y,th=14){s.append(el('rect',{x:x1,y:y-th/2,width:x2-x1,height:th,rx:th/2,fill:'#a9cbee',stroke:'#2b4c7e','stroke-width':1.3}));line(s,x1+6,y,x2-6,y,{stroke:'#fff','stroke-dasharray':'10 3 2 3'});}
function pin(s,x,y){s.append(el('circle',{cx:x,cy:y,r:5.5,fill:'#fff',stroke:INK,'stroke-width':1.3}));s.append(el('circle',{cx:x,cy:y,r:1.6,fill:INK}));}
function pivot(s,x,y,h=45){s.append(el('polygon',{points:`${x},${y-6} ${x-24},${y+h} ${x+24},${y+h}`,fill:'#a7a9c4',stroke:'#555'}));}
function box(s,x,y,w,h){s.append(el('rect',{x,y,width:w,height:h,rx:4,fill:'#f3d98b',stroke:'#555'}));}
function rot(s,cx,cy,r,cw){const a1=-150*Math.PI/180,a2=-30*Math.PI/180;const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const A=cw?p(a1):p(a2),B=cw?p(a2):p(a1);
  s.append(el('path',{d:`M${A[0]},${A[1]} A${r},${r} 0 0 ${cw?1:0} ${B[0]},${B[1]}`,fill:'none',stroke:CM,'stroke-width':2.5,'marker-end':'url(#aM)'}));}
const fmt=(x,d)=>{if(d===undefined){const a=Math.abs(x);d=a>=100?0:a>=10?1:2;}return x.toFixed(d).replace('.',',').replace(/(,\d*?)0+$/,'$1').replace(/,$/,'');};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rng=(a,b,st)=>{const n=Math.round((b-a)/st);return a+st*Math.floor(Math.random()*(n+1));};
const f=t=>`<span class="cF">${t}</span>`,l=t=>`<span class="cL">${t}</span>`,m=t=>`<span class="cM">${t}</span>`;
const eq=t=>`<span class="eq">${t}</span>`;
function bars(L,R){const mx=Math.max(L,R,1e-9);return `<div class="bars"><div><i style="width:${L/mx*55}%;background:${CM}"></i>linksdrehend: ${fmt(L)}</div><div><i style="width:${R/mx*55}%;background:#7fb893"></i>rechtsdrehend: ${fmt(R)}</div></div>`;}

/* ---------- Zeichnungen ---------- */
function drawWrench(p,ask){const s=mkSvg(260),cx=160,cy=150,x=cx+p.l;
  beam(s,cx-6,x+18,cy,18);
  const hx=[];for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;hx.push((cx+22*Math.cos(a))+','+(cy+22*Math.sin(a)));}
  s.append(el('polygon',{points:hx.join(' '),fill:'#a7a9c4',stroke:'#555','stroke-width':1.3}));pin(s,cx,cy);txt(s,cx-40,cy+6,'D',{'font-weight':600});
  force(s,x,cy+10,x,cy+80,ask==='F'?'F = ?':`F = ${p.F} N`,x+10,cy+60);
  dimH(s,cx,x,cy-58,`l = ${p.l} mm`,cy-26,cy-12);rot(s,cx,cy,38,true);
  txt(s,cx-46,cy-34,ask==='M'?'M = ?':`M = ${p.M} Nm`,{fill:CM,'font-weight':600,'text-anchor':'end'});s._geo={D:[cx,cy],F:[{p:[x,cy],d:[0,1],n:'F'}]};return s;}
function drawAngle(p,showL){const s=mkSvg(300),cx=120,cy=70,L=p.L,a=p.al*Math.PI/180,ex=cx+L,ux=-Math.cos(a),uy=Math.sin(a);
  beam(s,cx-6,ex+16,cy,18);const hx=[];for(let i=0;i<6;i++){const b=Math.PI/3*i+Math.PI/6;hx.push((cx+22*Math.cos(b))+','+(cy+22*Math.sin(b)));}
  s.append(el('polygon',{points:hx.join(' '),fill:'#a7a9c4',stroke:'#555','stroke-width':1.3}));pin(s,cx,cy);txt(s,cx-42,cy+6,'D',{'font-weight':600});
  const t=L*Math.cos(a),fx=ex+ux*t,fy=cy+uy*t;
  line(s,ex-ux*45,cy-uy*45,fx+ux*25,fy+uy*25,{stroke:CF,'stroke-dasharray':'6 4'});
  txt(s,ex-ux*45+6,cy-uy*45+4,'Wirkungslinie',{fill:CF,'font-size':13});
  force(s,ex,cy,ex+ux*80,cy+uy*80,`F = ${p.F} N`,ex+ux*80+14,cy+uy*80+12);
  line(s,cx,cy,fx,fy,{stroke:CL,'stroke-width':2.5,'stroke-dasharray':'7 4'});
  const n=9;s.append(el('polyline',{points:`${fx-ux*n},${fy-uy*n} ${fx-ux*n+(cx-fx)/Math.hypot(cx-fx,cy-fy)*n},${fy-uy*n+(cy-fy)/Math.hypot(cx-fx,cy-fy)*n} ${fx+(cx-fx)/Math.hypot(cx-fx,cy-fy)*n},${fy+(cy-fy)/Math.hypot(cx-fx,cy-fy)*n}`,fill:'none',stroke:CL}));
  txt(s,(cx+fx)/2-10,(cy+fy)/2+22,showL?`l = ${fmt(L*Math.sin(a))} mm`:'l = ?',{fill:CL,'font-weight':600,'text-anchor':'end'});
  dimH(s,cx,ex,cy-42,`L = ${L} mm`,cy-22,cy-12);
  s.append(el('path',{d:`M${ex-38},${cy} A38,38 0 0 0 ${ex+ux*38},${cy+uy*38}`,fill:'none',stroke:INK}));txt(s,ex-58,cy+24,`α = ${p.al}°`,{'font-size':14,'text-anchor':'end'});
  s._geo={D:[cx,cy],F:[{p:[ex,cy],d:[ux,uy],n:'F'}]};return s;}
function drawLever(p,o){const s=mkSvg(280),y=150,x0=90,k=460/(p.l1+p.lr),xD=x0+p.l1*k;
  ground(s,xD-70,y+52,140,14);pivot(s,xD,y+7);beam(s,x0-16,x0+460+16,y);pin(s,xD,y);txt(s,xD-6,y+40,'D',{'font-weight':600,fill:'#fff','font-size':14});
  if(o.kiste)box(s,x0-28,y-7-42,56,42);
  force(s,x0,y+9,x0,y+78,o.f1,x0-10,y+100,{'text-anchor':'middle'});
  o.right.forEach(([len,lab,row])=>{const x=xD+len*k,near=Math.abs(x-xD)<90;force(s,x,y+9,x,y+78,lab,x+10,near?y+98:y+70,x>520?{'text-anchor':'end',dx:-20}:{});});
  dimH(s,x0,xD,y-70,o.d1,y-12);o.dims.forEach(([len,lab,row])=>dimH(s,xD,xD+len*k,y-70-row*26,lab,y-12));
  s._geo={D:[xD,y],F:[{p:[x0,y],d:[0,1],n:o.f1.split(' ')[0]},...o.right.map(([len,lab])=>({p:[xD+len*k,y],d:[0,1],n:lab.split(' ')[0]}))]};return s;}
function drawKarre(p){const s=mkSvg(290),y=180,x0=110,k=440/1400,xL=x0+p.l1*k,xH=x0+p.l2*k;
  ground(s,40,y+30,340,13);s.append(el('circle',{cx:x0,cy:y,r:30,fill:'#555',stroke:'#222'}));s.append(el('circle',{cx:x0,cy:y,r:17,fill:'#ddd'}));
  beam(s,x0-8,xH+16,y);s.append(el('polygon',{points:`${xL-55},${y-7} ${xL+55},${y-7} ${xL+68},${y-62} ${xL-68},${y-62}`,fill:'#f3d98b',stroke:'#555'}));
  s.append(el('rect',{x:xH-4,y:y-13,width:26,height:26,rx:6,fill:'#444'}));pin(s,x0,y);txt(s,x0-52,y+6,'D',{'font-weight':600});
  force(s,xL,y-40,xL,y+26,`F_G = ?`,xL+10,y-25);txt(s,xL-10,y-42,`m = ${p.m} kg`,{'text-anchor':'end','font-size':14});
  force(s,xH,y+85,xH,y+12,'F = ?',xH+12,y+70);
  dimH(s,x0,xL,y-100,`l_1 = ${p.l1}`,y-35,y-64);dimH(s,x0,xH,y-128,`l_2 = ${p.l2}`,y-35,y-16);s._geo={D:[x0,y],F:[{p:[xL,y],d:[0,1],n:'F_G'},{p:[xH,y],d:[0,-1],n:'F'}]};return s;}
function drawPedal(p){const s=mkSvg(330),xD=260,yD=48,k=0.8,yr=yD+p.l2*k,yb=yD+p.l1*k;
  ground(s,232,10,85,22);s.append(el('polygon',{points:`${xD-16},32 ${xD+16},32 ${xD},${yD}`,fill:'#a7a9c4',stroke:'#555'}));
  s.append(el('rect',{x:xD,y:yr-3,width:95,height:6,fill:'#888',stroke:'#444'}));s.append(el('rect',{x:xD+85,y:yr-13,width:95,height:26,rx:3,fill:'#cfe0f3',stroke:'#2b4c7e'}));s.append(el('rect',{x:xD+90,y:yr-11,width:8,height:22,fill:'#555'}));
  txt(s,xD+190,yr+5,'zur Bremse',{'font-size':13});txt(s,xD+88,yr+30,'Hauptzylinder',{'font-size':13});
  s.append(el('rect',{x:xD-8,y:yD-8,width:16,height:yb-yD+22,rx:8,fill:'#a9cbee',stroke:'#2b4c7e','stroke-width':1.3}));
  s.append(el('rect',{x:xD-22,y:yb-20,width:13,height:40,rx:4,fill:'#444'}));pin(s,xD,yD);pin(s,xD,yr);txt(s,xD+14,yD+2,'D',{'font-weight':600});
  force(s,xD+14,yr-16,xD+78,yr-16,'F_K = ?',xD+16,yr-24);
  force(s,xD-110,yb,xD-25,yb,`F_P = ${p.FP} N`,xD-150,yb-10);
  dimV(s,yD,yr,xD-40,`l_2 = ${p.l2}`,xD-10);dimV(s,yD,yb,xD-75,`l_1 = ${p.l1}`,xD-24);s._geo={D:[xD,yD],F:[{p:[xD,yb],d:[1,0],n:'F_P'},{p:[xD,yr],d:[-1,0],n:'F_K'}]};return s;}
function drawWinde(p){const s=mkSvg(330),cx=390,cy=135,k=0.5,R=p.R*k,xh=cx-p.L*k,xr=cx+R;
  ground(s,300,285,105,14);s.append(el('polygon',{points:`${cx-34},285 ${cx+14},285 ${cx+8},${cy} ${cx-8},${cy}`,fill:'#a7a9c4',stroke:'#555'}));
  s.append(el('circle',{cx,cy,r:R,fill:'#a9cbee',stroke:'#2b4c7e','stroke-width':1.5}));
  beam(s,xh-8,cx+8,cy,13);s.append(el('rect',{x:xh-7,y:cy-2,width:14,height:40,rx:5,fill:'#444'}));pin(s,cx,cy);
  txt(s,cx-14,cy+30,'Trommel',{'font-size':13});txt(s,xh+24,cy+30,'Kurbel',{'font-size':13});
  line(s,xr,cy,xr,220,{'stroke-width':1.6});box(s,xr-22,220,44,36);force(s,xr,256,xr,312,`F_G = ${p.FG} N`,xr+10,300);
  force(s,xh,cy-62,xh,cy-10,'F_H = ?',xh-70,cy-40);

function drawVentil(p){const s=mkSvg(300),xD=110,y=112,k=0.7,xv=xD+p.a*k,xw=xD+p.b*k;

function labKraft(){const c=H('div',{class:'card'});c.append(H('h3',{},'Labor: Kräfte auf einer Wirkungslinie'));
  c.append(H('p',{},'Verschiebe die Regler. F₂ kann nach rechts oder nach links zeigen. Beobachte den Kräfteplan und die violette Resultierende.'));
  const holder=H('div'),info=H('div');const st={F1:300,F2:-150};const sl=H('div',{class:'sl'});
  [['F1','F₁ (nach rechts)',0,500],['F2','F₂ (minus = nach links)',-500,500]].forEach(([k,n,a,b])=>{const lb=H('label',{},n+': <b></b>');const r=H('input',{type:'range',min:a,max:b,step:10,value:st[k]});r.oninput=()=>{st[k]=+r.value;draw();};lb.append(r);sl.append(lb);lb.dataset.k=k;});
  c.append(holder,sl,info);
  function draw(){const R=st.F1+st.F2;holder.innerHTML='';holder.append(drawForces([{F:st.F1,dir:1,lab:`F_1 = ${st.F1} N`},{F:Math.abs(st.F2),dir:st.F2<0?-1:1,lab:`F_2 = ${Math.abs(st.F2)} N`}],{plan:true,R:`F_R = ${Math.abs(R)} N`}));
    sl.querySelectorAll('label').forEach(lb=>lb.querySelector('b').textContent=Math.abs(st[lb.dataset.k])+' N'+(lb.dataset.k==='F2'?(st.F2<0?' nach links':' nach rechts'):''));
    info.innerHTML=`<p>${eq(fr('F<sub>R</sub>')+' = '+f(st.F1+' N')+(st.F2<0?' − ':' + ')+f(Math.abs(st.F2)+' N')+' = '+fr(R+' N'))}</p><div class="state" style="background:${R===0?'var(--oksoft)':'var(--warnsoft)'}">${R===0?'Gleichgewicht: Die Kräfte heben sich auf. Der Wagen bleibt in Ruhe.':(R>0?'Die Resultierende zeigt nach rechts.':'Die Resultierende zeigt nach links. Das Minus bedeutet: Richtung nach links.')}</div>`;}
  draw();return c;}

function drawBeam(p,o={}){const s=mkSvg(315),tot=Math.max(p.l,p.end||0,...p.loads.map(q=>q.x)),k=440/tot,X=v=>100+v*k,y=165,XA=X(0),XB=X(p.l);
  ground(s,XA-34,y+54,68,10);pivot(s,XA,y+14,40);ground(s,XB-34,y+54,68,10);pivot(s,XB,y+14,30);[-12,0,12].forEach(d=>s.append(el('circle',{cx:XB+d,cy:y+49,r:4.5,fill:'#fff',stroke:'#555'})));
  beam(s,XA-18,X(tot)+18,y,16);txt(s,XA-46,y+40,'A',{'font-weight':600});txt(s,XB+34,y+40,'B',{'font-weight':600});
  p.loads.forEach(q=>{if(q.box)box(s,X(q.x)-22,y-8-34,44,34);force(s,X(q.x),y-(q.box?46:64),X(q.x),y-10,q.lab,X(q.x)+9,y-(q.box?52:44),q.anc?{'text-anchor':'end',dx:-18}:{});});
  const R=(x,lab,neg)=>{if(neg)force(s,x,y+70,x,y+116,lab,x+10,y+104);else force(s,x,y+118,x,y+72,lab,x+10,y+104);};
  R(XA,o.RA||'F_A = ?',o.negA);R(XB,o.RB||'F_B = ?');
  const pts=[...new Set([0,...p.loads.map(q=>q.x),p.l,tot])].sort((a,b)=>a-b);
  pts.slice(1).forEach((v,i)=>{if(o.segs&&o.segs[i])dimH(s,X(pts[i]),X(v),y-94,o.segs[i],y-12);});
  if(o.ex)dimH(s,XA,X(o.ex[0]),y-118,o.ex[1],y-12);
  if(o.tot)dimH(s,XA,XB,y-142,o.tot,y-12);s._geo={D:[XA,y],piv:'A',thru:'F_A',F:[...p.loads.map(q=>({p:[X(q.x),y],d:[0,1],n:q.box?'F_G':q.lab.split(' ')[0]})),{p:[XB,y],d:[0,-1],n:'F_B'}]};return s;}
function drawPratze(p,o={}){const s=mkSvg(290),k=2.4,xA=200,xS=xA+p.a*k,xB=xA+(p.a+p.b)*k;
  ground(s,120,215,480,50);box(s,130,165,xA-130+34,50);s.append(el('rect',{x:xB-34,y:165,width:130,height:50,fill:'#a7a9c4',stroke:'#555'}));
  s.append(el('rect',{x:xS-24,y:226,width:48,height:15,fill:'#cfe0f3',stroke:'#2b4c7e'}));s.append(el('rect',{x:xS-5,y:122,width:10,height:112,fill:'#cfe0f3',stroke:'#2b4c7e'}));
  beam(s,xA-26,xB+26,150,18);s.append(el('rect',{x:xS-13,y:126,width:26,height:15,fill:'#a9cbee',stroke:'#2b4c7e'}));
  txt(s,136,211,'Werkstück',{'font-size':12});txt(s,xB+92,211,'Stützklotz',{'font-size':12,'text-anchor':'end'});txt(s,130,258,'Frästisch',{'font-size':13});txt(s,xA-22,138,'A',{'font-weight':600,'text-anchor':'end'});txt(s,xB+22,138,'B',{'font-weight':600});
  force(s,xS,50,xS,120,`F_Sch = ${p.F} kN`,xS+10,66);
  force(s,xA,208,xA,163,o.RA||'F_S = ?',xA-9,184,{'text-anchor':'end','font-size':13});force(s,xB,208,xB,163,o.RB||'F_B = ?',xB+9,184,{'font-size':13});
  dimH(s,xA,xS,98,`a = ${p.a}`,138);dimH(s,xS,xB,98,`b = ${p.b}`,138);s._geo={D:[xB,150],piv:'B',thru:'F_B',F:[{p:[xS,150],d:[0,1],n:'F_Sch'},{p:[xA,150],d:[0,-1],n:'F_S'}]};return s;}
const stdSol=(F,a,ll,u)=>{const FB=F*a/ll;return [`Freimachen: Die Lager werden durch die Kräfte ${f('F_A')} und ${f('F_B')} ersetzt.`,`Drehpunkt in A wählen. Dann hat ${f('F_A')} keinen Hebelarm und fällt weg.`,`Momentengleichgewicht um A: ${eq(f('F_B')+' · '+l('l')+' = '+f('F')+' · '+l('a'))}`,`${eq(f('F_B')+' = '+f(fmt(F)+' '+u)+' · '+l(a+' mm')+' : '+l(ll+' mm')+' = '+f(fmt(FB)+' '+u))}`,`Kräftegleichgewicht: ${eq(f('F_A')+' = '+f('F')+' − '+f('F_B')+' = '+fmt(F)+' '+u+' − '+fmt(FB)+' '+u+' = '+f(fmt(F-FB)+' '+u))}`,`Kontrolle um B: ${eq(f('F_A')+' · '+l('l')+' = '+f('F')+' · '+l('b'))} ergibt ${fmt(F*(ll-a)/ll)} ${u}. Das stimmt.`];};

function labLager(){const c=H('div',{class:'card'});c.append(H('h3',{},'Labor: Wie verteilt sich die Last auf zwei Lager?'));
  c.append(H('p',{},'Verschiebe die Last. Das nähere Lager trägt mehr. Steht die Last über einem Lager, trägt dieses Lager alles.'));
  const holder=H('div'),info=H('div');const st={F:6,a:300},ll=1000;const sl=H('div',{class:'sl'});
  [['a','Abstand a von A',0,1000,50,'mm'],['F','Kraft F',1,12,1,'kN']].forEach(([k,n,a,b,stp,u])=>{const lb=H('label',{},n+': <b></b>');const r=H('input',{type:'range',min:a,max:b,step:stp,value:st[k]});r.oninput=()=>{st[k]=+r.value;draw();};lb.append(r);sl.append(lb);lb.dataset.k=k;lb.dataset.u=u;});
  c.append(holder,sl,info);
  function draw(){const FB=st.F*st.a/ll,FA=st.F-FB;holder.innerHTML='';holder.append(drawBeam({l:ll,loads:[{x:st.a,F:st.F,lab:`F = ${st.F} kN`,anc:st.a>750}]},{RA:`F_A = ${fmt(FA)} kN`,RB:`F_B = ${fmt(FB)} kN`,segs:st.a>0&&st.a<ll?[`a = ${st.a}`,`b = ${ll-st.a}`]:null,tot:`l = ${ll}`}));
    sl.querySelectorAll('label').forEach(lb=>lb.querySelector('b').textContent=st[lb.dataset.k]+' '+lb.dataset.u);
    info.innerHTML=`<div class="bars"><div><i style="width:${FA/12*55}%;background:${CF}"></i><span>F<sub>A</sub> = ${fmt(FA)} kN (${fmt(FA/st.F*100,0)} %)</span></div><div><i style="width:${FB/12*55}%;background:#e08aa9"></i><span>F<sub>B</sub> = ${fmt(FB)} kN (${fmt(FB/st.F*100,0)} %)</span></div></div><p>${eq(f('F<sub>B</sub>')+' = '+f('F')+' · '+l('a')+' : '+l('l')+' = '+st.F+' kN · '+st.a+' mm : '+ll+' mm = '+f(fmt(FB)+' kN'))}<br>${eq(f('F<sub>A</sub>')+' = '+f('F')+' − '+f('F<sub>B</sub>')+' = '+f(fmt(FA)+' kN'))}</p>`;}
  draw();return c;}

function stepper(frames){const w=H('div',{class:'stp'}),hold=H('div'),cap=H('div',{class:'cap'}),bar=H('div',{class:'btns'});let i=0,tm=null;
  const bp=H('button',{class:'btn p'},'▶ Abspielen'),bn=H('button',{class:'btn'},'Schritt weiter →'),bz=H('button',{class:'btn'},'Von vorn');
  const show=()=>{hold.innerHTML='';hold.append(frames[i].svg());cap.innerHTML=`<b>Schritt ${i+1} von ${frames.length}:</b> ${hs(frames[i].cap)}`;bn.disabled=i>=frames.length-1;};
  const stop=()=>{if(tm){clearInterval(tm);tm=null;bp.textContent='▶ Abspielen';}};
  bp.onclick=()=>{if(tm){stop();return;}if(i>=frames.length-1)i=0;show();bp.textContent='❚❚ Pause';tm=setInterval(()=>{if(i>=frames.length-1){stop();return;}i++;show();if(i>=frames.length-1)stop();},1700);};
  bn.onclick=()=>{stop();if(i<frames.length-1){i++;show();}};bz.onclick=()=>{stop();i=0;show();};
  bar.append(bp,bn,bz);w.append(hold,cap,bar);show();return w;}
function erklBox(e){const d=H('div',{class:'erkl'});d.append(H('h4',{},'Bild-Erklärung'));d.append(stepper(e.frames));
  d.append(H('div',{class:'ebox'},'<b>So liest du das Bild</b><ul>'+e.lesen.map(x=>'<li>'+hs(x)+'</li>').join('')+'</ul>'));
  d.append(H('div',{class:'ebox'},'<b>Ein Bild aus dem Alltag</b><p>'+e.alltag+'</p>'));
  if(e.falle)d.append(H('div',{class:'ebox'},'<b>Typische Falle</b><p>'+hs(e.falle)+'</p>'));
  d.append(H('div',{class:'ebox test'},'<b>Für den Test</b><p>'+hs(e.test)+'</p>'));return d;}

/* ---------- Bild-Erklärung für Drehmoment und Lagerkräfte ---------- */
function momentFrames(mk){const G0=mk()._geo,[dx,dy]=G0.D,L=[],R=[];
  G0.F.forEach(q=>{((q.p[0]-dx)*q.d[1]-(q.p[1]-dy)*q.d[0]>0?R:L).push(q.n);});
  const build=st=>()=>{const s=mk(),G=s._geo;
    if(st>=2)G.F.forEach((q,i)=>{const t=(dx-q.p[0])*q.d[0]+(dy-q.p[1])*q.d[1],fx=q.p[0]+q.d[0]*t,fy=q.p[1]+q.d[1]*t,t1=Math.min(0,t)-40,t2=Math.max(0,t)+40;
      line(s,q.p[0]+q.d[0]*t1,q.p[1]+q.d[1]*t1,q.p[0]+q.d[0]*t2,q.p[1]+q.d[1]*t2,{stroke:CF,'stroke-dasharray':'5 4','stroke-width':1.3});
      const ax=fx-dx,ay=fy-dy,Ln=Math.hypot(ax,ay);if(Ln<1)return;let nx=-ay/Ln,ny=ax/Ln;if(ny>0.01||(Math.abs(ny)<=0.01&&nx<0)){nx=-nx;ny=-ny;}const sh=14+10*i;
      line(s,dx+nx*sh,dy+ny*sh,fx+nx*sh,fy+ny*sh,{stroke:CL,'stroke-width':5,'stroke-linecap':'round',opacity:.6});
      const tx=(dx+fx)/2+nx*sh,ty=(dy+fy)/2+ny*sh;s.append(el('rect',{x:tx-30,y:ty-9,width:60,height:17,rx:4,fill:'#fff',opacity:.85}));txt(s,tx,ty+4,`Arm ${q.n}`,{fill:CL,'font-size':12,'text-anchor':'middle','font-weight':600});});
    if(st>=1)s.append(el('circle',{cx:dx,cy:dy,r:14,fill:'none',stroke:CM,'stroke-width':3.5}));
    if(st>=3){if(R.length)rot(s,dx,dy,24,true);if(L.length)rot(s,dx,dy,36,false);}
    return s;};
  const lag=!!G0.piv,vb=a=>a.length>1?'drehen':'dreht',jn=a=>a.join(' und '),one=!L.length||!R.length;
  const c3=one?`${jn(L.concat(R))} ${vb(L.concat(R))} ${R.length?'rechts':'links'} herum um den Drehpunkt.`:`Drehsinn bestimmen: ${jn(L)} ${vb(L)} links herum. ${jn(R)} ${vb(R)} rechts herum.`;
  const c4=one?'Das Drehmoment ist Kraft mal Hebelarm: M = F · l.':`Gleichgewicht der Drehmomente: ${L.map(n=>n+' · Arm').join(' + ')} = ${R.map(n=>n+' · Arm').join(' + ')}.`+(lag?` Danach folgt ${G0.thru} aus dem Kräftegleichgewicht.`:'');
  return [{cap:'Lies zuerst das Bild: Welche Kräfte greifen an? Was ist gesucht?',svg:build(0)},
   {cap:lag?`Lege den Drehpunkt ${G0.pivAt||'in das Lager '+G0.piv} (grüner Ring). Die Kraft ${G0.thru} geht durch den Drehpunkt. Sie hat keinen Hebelarm und fällt weg.`:'Suche den Drehpunkt D (grüner Ring). Um ihn würde sich das Teil drehen.',svg:build(1)},
   {cap:'Zeichne zu jeder Kraft die Wirkungslinie (gestrichelt). Der Hebelarm (blau) ist der senkrechte Abstand vom Drehpunkt zur Wirkungslinie.',svg:build(2)},
   {cap:c3,svg:build(3)},{cap:c4,svg:build(3)}];}
const LESM=[`${f('Magenta Pfeil')}: eine Kraft. Gestrichelt ist ihre Wirkungslinie.`,`${m('Grüner Ring')}: der Drehpunkt. ${m('Grüne Bogenpfeile')}: der Drehsinn.`,`${l('Blauer Balken')}: der Hebelarm einer Kraft, immer senkrecht zur Wirkungslinie.`,'Gelb ist die Last. Grau schraffiert ist das feste Gestell.'];
const TESTD='Drehmoment = Kraft · Hebelarm. Der Hebelarm ist der senkrechte Abstand vom Drehpunkt zur Wirkungslinie. Im Gleichgewicht gilt: Summe der linksdrehenden Momente = Summe der rechtsdrehenden Momente.';
const TESTL='Drehpunkt in ein Lager legen. Das Momentengleichgewicht ergibt die andere Lagerkraft. Das Kräftegleichgewicht ergibt die erste. Kontrolle: F_A + F_B = Summe aller Lasten.';
const byId={};[...TASKS,...LTASKS].forEach(t=>byId[t.id]=t);
const ME=(id,alltag,falle,test)=>{ERKL[id]=p=>({frames:momentFrames(()=>byId[id].draw(p)),lesen:LESM,alltag,falle,test});};
ME('d1','Eine Tür öffnest du am Griff ganz leicht. Drückst du nahe am Scharnier, geht es kaum. Die Kraft ist gleich, der Hebelarm ist kleiner.','Den Hebelarm in mm einsetzen und das Resultat Nm nennen.',TESTD);
ME('d2','Sitzt eine Radmutter fest, steckst du ein Rohr auf den Schlüssel. Der Hebelarm wird länger. Du brauchst weniger Kraft.',null,TESTD);
ME('d3','Auf einer Wippe sitzt ein schweres Kind nahe an der Mitte. Ein leichtes Kind sitzt weit aussen. So sind beide im Gleichgewicht.','Die Hebelarme von den Enden statt vom Drehpunkt aus messen.',TESTD);
ME('d4','Beim Nussknacker liegt die Nuss nahe am Gelenk. Die Hand drückt weit aussen. Beide Kräfte liegen auf derselben Seite des Gelenks.','Den Hebelarm der Hand als l_2 − l_1 rechnen. Beide Hebelarme gehen vom Drehpunkt aus.',TESTD);
ME('d5','Auf einer Wippe sitzen links ein Kind und rechts zwei Kinder. Jedes Kind zählt mit seinem eigenen Abstand zur Mitte.','Die Kräfte einer Seite zusammenzählen und erst dann mit einem Hebelarm multiplizieren.',TESTD);
ME('d6','Eine Zange hat lange Griffe und kurze Backen. Eine kleine Handkraft wird zu einer grossen Kraft an den Backen.','Den Hebelarm l_1 zwischen Fuss und Druckstange messen statt bis zum Drehpunkt.',TESTD);
ME('d7','Am Ziehbrunnen ist die Kurbel länger als der Radius der Seiltrommel. Darum kannst du einen schweren Eimer hochziehen.','Den Trommeldurchmesser statt den Radius als Hebelarm nehmen.',TESTD);
ME('d8','Bei einer alten Laufgewichtswaage hängt ein kleines Gewicht weit aussen. Es hält eine grosse Last nahe am Drehpunkt im Gleichgewicht.','Den Druck in bar direkt mit mm² multiplizieren. Zuerst in N/mm² umrechnen.',TESTD);
ME('d9','Du ziehst schräg an einer Tür. Nur der Teil der Kraft, der senkrecht zur Tür wirkt, dreht sie. Ziehst du genau zum Scharnier hin, dreht sich nichts.','Die Schlüssellänge L als Hebelarm nehmen, obwohl die Kraft schräg wirkt.','Der Hebelarm ist immer der senkrechte Abstand vom Drehpunkt zur Wirkungslinie: l = L · sin α. Dann M = F · l.');
const AL='Zwei Personen tragen ein Brett. Darauf steht ein Eimer. Wer näher am Eimer geht, trägt mehr. Steht der Eimer in der Mitte, tragen beide gleich viel.';
ME('l1',AL,null,TESTL);ME('l2',AL,'Die Lagerkraft mit dem falschen Abstand rechnen: Zu F_B gehört der Abstand a von A.',TESTL);
ME('l3','Zwei Personen tragen ein Brett mit zwei Eimern. Jeder Eimer verteilt sich nach seinem eigenen Abstand auf die beiden Träger.','Ein Moment vergessen. Jede Last braucht ihren eigenen Hebelarm vom Drehpunkt aus.',TESTL);
ME('l4',AL,'Mit der Masse in kg statt mit der Gewichtskraft in N rechnen.',TESTL);
ME('l5','Ein Flaschenöffner stützt sich am Deckelrand ab und hebt am anderen Rand. Die Hand ist die dritte Kraft. Auch er ist ein Träger auf zwei Stützen.','Die Abstände a und b vertauschen. Zur Kraft am Werkstück gehört der Abstand b der Schraube vom Stützklotz.',TESTL);
ME('l6','Ein Sprungbrett ragt über die vordere Stütze hinaus. Steht jemand vorne, drückt die vordere Stütze stark nach oben. Die hintere muss das Brett nach unten festhalten.','Das Minus bei F_A als Rechenfehler ansehen. Es bedeutet: Die Kraft wirkt nach unten.',TESTL);
ME('l7','Zwei Personen tragen eine schwere Leiter mit einem Werkzeugkasten darauf. Die Leiter selbst wiegt auch etwas. Ihr Gewicht verteilt sich je zur Hälfte.','Das Eigengewicht vergessen oder am falschen Ort ansetzen. Es greift in der Mitte an.',TESTL);

function drawBars(title,rows){const s=mkSvg(70+rows.length*46);txt(s,30,34,title,{'font-weight':600});rows.forEach((r,i)=>{const y=56+i*46;s.append(el('rect',{x:30,y,width:420,height:24,rx:4,fill:'#fff',stroke:'#c9ced6'}));if(r.v>0)s.append(el('rect',{x:30,y,width:Math.max(3,420*Math.min(1,r.v)),height:24,rx:4,fill:r.c||CW}));txt(s,462,y+17,r.t,{'font-size':14});});return s;}
function drawArea(fr){const s=mkSvg(260),x0=110,y0=205,W=400,Hh=130;line(s,x0,y0,x0+W+40,y0,{'marker-end':'url(#aD)'});line(s,x0,y0,x0,y0-Hh-40,{'marker-end':'url(#aD)'});
  txt(s,x0+W+46,y0+5,'Weg s',{fill:CL,'font-weight':600});txt(s,x0-10,y0-Hh-46,'Kraft F',{fill:CF,'font-weight':600,'text-anchor':'middle'});
  line(s,x0,y0-Hh,x0+W,y0-Hh,{stroke:CF,'stroke-width':3});if(fr>0){s.append(el('rect',{x:x0,y:y0-Hh,width:W*fr,height:Hh,fill:CW,opacity:.55}));txt(s,x0+W*fr/2,y0-Hh/2+5,fr>=1?'W = F · s':'W',{'text-anchor':'middle','font-weight':600});}
  line(s,x0+W*fr,y0+4,x0+W*fr,y0+14,{stroke:CL,'stroke-width':2});txt(s,x0+W*fr,y0+30,fr<=0?'Start':fr>=1?'ganzer Weg s':'unterwegs',{fill:CL,'text-anchor':'middle','font-size':13});return s;}

const LESG=[`${f('Magenta Pfeil')}: eine Kraft.`,`${l('Blau')}: Längen, Durchmesser und Wege.`,`${m('Grün')}: Drehmoment und Drehsinn.`,`${w('Orange')}: Arbeit, Energie, Leistung und Geschwindigkeit.`];

EK('u2',MF('u2'),LESM,'Am Lenkrad greifst du aussen am Kranz. Mit einem kleinen Lenkrad müsstest du stärker ziehen.','Den Durchmesser nicht in Meter umrechnen.',TU);
EK('u3',TF('u3',['Zwei Zahnräder greifen ineinander. Rad 1 treibt, Rad 2 wird getrieben.','Am Zahneingriff drückt ein Zahn auf den anderen. Diese Kraft ist die Umfangskraft. Sie ist an beiden Rädern gleich gross.','Jedes Rad hat seinen eigenen Hebelarm: den halben Durchmesser. Darum hat das grössere Rad das grössere Drehmoment.']),LESG,'Beim Velo im Berggang ist hinten das grosse Ritzel aufgelegt. Die Kettenkraft ist gleich, aber das Drehmoment am Hinterrad ist grösser.','Meinen, das Drehmoment sei an beiden Rädern gleich. Gleich ist nur die Umfangskraft.','Am Zahneingriff ist die Umfangskraft gleich. Die Drehmomente verhalten sich wie die Durchmesser: M_2 : M_1 = d_2 : d_1.');
EK('u4',MF('u4'),LESM,'Am Ziehbrunnen sitzen Kurbel und Seiltrommel auf derselben Welle. Was die Kurbel hineindreht, kommt an der Trommel wieder heraus.','Die Kraft statt das Drehmoment gleichsetzen. Auf einer Welle ist das Drehmoment gleich.','Auf derselben Welle ist das Drehmoment überall gleich. Am grösseren Rad ist die Umfangskraft kleiner.');
EK('u5',TF('u5',['Folge der Kraft: Pedal, Kurbel, Kettenblatt, Kette, Ritzel, Hinterrad, Strasse.','Auf derselben Welle bleibt das Drehmoment gleich: Kurbel und Kettenblatt vorne, Ritzel und Hinterrad hinten.','In der Kette bleibt die Kraft gleich: vom Kettenblatt zum Ritzel.','Wechsle also immer ab: Kraft in Drehmoment umrechnen, dann Drehmoment wieder in Kraft.']),LESG,'Du kennst es vom Schalten: Im kleinen Gang trittst du leicht, kommst aber pro Umdrehung nicht weit.','Einen Schritt überspringen oder Radius und Durchmesser mischen.','Gleiche Welle: gleiches Drehmoment. Gleiche Kette oder gleicher Zahneingriff: gleiche Kraft.');
const kiste=(p,o)=>[{cap:'Die Kiste liegt auf dem Boden. Die Gewichtskraft F_G zieht sie nach unten.',svg:()=>drawKiste({m:o.m,FG:'F_G'})},{cap:'Der Boden drückt mit der Normalkraft F_N zurück. Auf waagrechtem Boden ist F_N so gross wie F_G.',svg:()=>drawKiste({m:o.m,FG:'F_G',FN:'F_N'})},{cap:'Jetzt zieht die Kraft F an der Kiste.',svg:()=>drawKiste({m:o.m,FG:'F_G',FN:'F_N',F:'F'})},{cap:o.last,svg:()=>drawKiste({m:o.m,FG:'F_G',FN:'F_N',F:'F',FR:'F_R',mu:o.mu})}];

EK('r1',p=>kiste(p,{m:`m = ${p.m} kg`,mu:'F_R = μ · F_N',last:'Die Reibungskraft F_R wirkt in der Berührungsfläche, gegen die Bewegung. Sie hängt von der Normalkraft ab.'}),LESR,'Ein voller Umzugskarton lässt sich schwerer über den Boden schieben als ein leerer. Mehr Gewicht bedeutet mehr Normalkraft und mehr Reibung.','Mit der Masse in kg statt mit der Normalkraft in N rechnen.',TR);
EK('r2',p=>kiste(p,{m:'',mu:'μ = F_R : F_N',last:'Bei gleichmässiger Bewegung ist die Zugkraft genau so gross wie die Reibungskraft. So kann man μ messen.'}),LESR,'Auf Eis rutscht ein Schlitten fast von selbst. Auf Asphalt bleibt er stecken. Das Gewicht ist gleich, die Reibungszahl ist anders.','Den Bruch umdrehen: μ = F_N : F_R ergibt eine Zahl grösser als 1.',TR);
EK('r3',p=>kiste(p,{m:`m = ${p.m} kg`,mu:'zuerst μ₀, dann μ',last:'Zum Losreissen muss F die Haftreibung überwinden (μ₀). Danach wirkt nur noch die kleinere Gleitreibung (μ).'}),LESR,'Einen schweren Schrank anzuschieben ist am schwersten. Rutscht er einmal, geht es leichter.','Für beide Fragen dieselbe Reibungszahl nehmen.','Haftreibung ist grösser als Gleitreibung: μ₀ > μ. Losreissen mit μ₀, Weiterschieben mit μ.');
EK('r4',TF('r4',['Zwei Backen klemmen das Werkstück. Jede drückt mit F_N.','An jeder Berührungsfläche entsteht eine Reibungskraft. Sie wirkt gegen die Zugrichtung.','Zwei Flächen bedeuten zwei Reibungskräfte. Zusammen halten sie das Werkstück.']),LESR,'Du hältst ein Glas zwischen Daumen und Fingern. Beide Seiten halten es durch Reibung. Mit nassen Fingern rutscht es.','Nur eine Reibfläche rechnen.','Zähle die Reibflächen. Bei zwei Flächen gilt: F = 2 · μ₀ · F_N.');
EK('r5',MF('r5'),LESM,'Bei der Velobremse drückt der Bremsklotz auf die Felge. Die Reibung wirkt am Umfang und bremst das Rad.','Die Normalkraft direkt mit dem Radius multiplizieren. Dazwischen fehlt μ.','Zuerst F_R = μ · F_N. Diese Kraft wirkt am Umfang. Dann M = F_R · d : 2.');
EK('a1',p=>[{cap:'Die Kraft F wirkt gleich stark über den ganzen Weg. Am Start ist noch keine Arbeit verrichtet.',svg:()=>drawArea(0)},{cap:'Unterwegs wächst die Arbeit mit jedem Stück Weg. Sie ist die Fläche unter der Kraftlinie.',svg:()=>drawArea(0.5)},{cap:'Am Ende ist die Arbeit das ganze Rechteck: Höhe F mal Breite s.',svg:()=>drawArea(1)}],[`${f('Magenta Linie')}: die Kraft, hier immer gleich gross.`,`${l('Blau')}: der Weg.`,`${w('Orange Fläche')}: die verrichtete Arbeit.`],'Du schiebst einen Einkaufswagen durch den Laden. Je länger der Gang und je voller der Wagen, desto mehr Arbeit verrichtest du.','Eine Kraft quer zum Weg mitrechnen. Es zählt nur die Kraft in Wegrichtung.','Arbeit = Kraft · Weg: W = F · s. Einheit: 1 Nm = 1 J.');

EK('a2',hub,LESB,'Du trägst eine Getränkekiste in den dritten Stock. Je schwerer die Kiste und je höher der Stock, desto mehr Arbeit.','Die Masse in kg direkt mit der Höhe multiplizieren. Es fehlt g.','Hubarbeit = Gewichtskraft · Höhe: W = m · g · h.');

function drawSchief(p,o={}){const s=mkSvg(310),ax=330,ay=62,L=190,bh=rad(p.al/2+p.de),bl=rad(p.al/2-p.de),A=[ax-L*Math.sin(bh),ay+L*Math.cos(bh)],B=[ax+L*Math.sin(bl),ay+L*Math.cos(bl)],t=Math.tan(rad(p.de)),gy=x=>A[1]+(x-A[0])*t;
  s.append(el('polygon',{points:`${A[0]-70},${gy(A[0]-70)} ${B[0]+90},${gy(B[0]+90)} ${B[0]+90},300 ${A[0]-70},300`,fill:'url(#hat)',stroke:'#555'}));
  stab(s,ax,ay,A[0],A[1],9);stab(s,ax,ay,B[0],B[1],9);pin(s,ax,ay);force(s,ax,8,ax,ay-8,o.FG,ax+10,26);line(s,ax,ay,ax,ay+150,{stroke:'#5a6673','stroke-dasharray':'3 4'});
  txt(s,ax-8,ay+150,o.b1||'β_1',{'font-size':13,'text-anchor':'end'});txt(s,ax+6,ay+150,o.b2||'β_2',{'font-size':13});
  txt(s,(ax+A[0])/2-18,(ay+A[1])/2,o.F1||'Teil 1',{fill:CF,'font-weight':600,'text-anchor':'end'});txt(s,(ax+B[0])/2+18,(ay+B[1])/2,o.F2||'Teil 2',{fill:CF,'font-weight':600});
  txt(s,30,40,`Öffnungswinkel α = ${p.al}°`,{'font-size':14});txt(s,30,62,`Bodenneigung δ = ${p.de}°`,{'font-size':14});return s;}
function drawLampe(p,o={}){const s=mkSvg(310),k=Math.min(400/p.w,130/p.d),xa=320-p.w*k/2,xb=320+p.w*k/2,yh=62,x1=Math.sqrt(p.l1*p.l1-p.d*p.d),lx=xa+x1*k,ly=yh+p.d*k;
  s.append(el('rect',{x:xa-34,y:30,width:34,height:262,fill:'url(#hat)',stroke:'#555'}));s.append(el('rect',{x:xb,y:30,width:34,height:262,fill:'url(#hat)',stroke:'#555'}));ground(s,xa,280,xb-xa,12);
  seil(s,xa,yh,lx,ly);seil(s,xb,yh,lx,ly);s.append(el('circle',{cx:lx,cy:ly+12,r:12,fill:'#f3d98b',stroke:'#555'}));
  force(s,lx,ly+24,lx,ly+70,o.FG,lx+10,ly+62);dimH(s,xa,xb,36,`w = ${p.w} m`,yh-4);
  txt(s,(xa+lx)/2+12,(yh+ly)/2-2,o.l1||`l_1 = ${p.l1} m`,{fill:CL,'font-size':14});txt(s,(xb+lx)/2,(yh+ly)/2+20,o.l2||`l_2 = ${p.l2} m`,{fill:CL,'font-size':14,'text-anchor':'middle'});
  dimV(s,ly,280,xb-40,`H = ${p.H} m`,lx+14);return s;}
function drawReck(p){const s=mkSvg(310),k=Math.min(360/p.A,190/p.B),cx=300,cy=160,ax=p.A*k/2,by=p.B*k/2,sx=p.s*k/2;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([i,j])=>{seil(s,cx+i*sx,cy,cx+i*ax,cy+j*by);s.append(el('rect',{x:cx+i*ax-7,y:cy+j*by-7,width:14,height:14,fill:'#a7a9c4',stroke:'#555'}));});
  stab(s,cx-sx,cy,cx+sx,cy,6);pin(s,cx-sx,cy);pin(s,cx+sx,cy);dimH(s,cx-ax,cx+ax,30,`A = ${fmt(p.A)} m`,cy-by-9);dimV(s,cy-by,cy+by,cx-ax-40,`B = ${fmt(p.B)} m`,cx-ax-9);
  txt(s,cx,cy-10,`s = ${fmt(p.s)} m`,{fill:CL,'text-anchor':'middle','font-size':14});txt(s,cx,cy+22,'Reckstange',{'text-anchor':'middle','font-size':12,fill:'#5a6673'});
  txt(s,500,120,'Draufsicht',{'font-size':13,fill:'#5a6673'});txt(s,500,146,`Höhe h = ${fmt(p.h)} m`,{'font-size':14,fill:CL});txt(s,500,170,`F = ${p.F} kN je Seil`,{'font-size':14,fill:CF,'font-weight':600});return s;}
const sym=(FG,be)=>FG/(2*Math.cos(be));
const ZTASKS=[
{id:'z1',lvl:1,title:'Schlitten: Kraft in zwei rechtwinklige Teilkräfte zerlegen',
 gen(){const F=rng(100,400,20),a=pick([20,25,30,35,40]);return {F,F1:Math.round(F*Math.cos(rad(a)))};},
 draw:p=>drawSchraeg({F:p.F,al:Math.acos(p.F1/p.F)*180/Math.PI},{Fx:`F_1 = ${p.F1} N`,Fy:'F_2 = ?',alTxt:'α = ?'}),
 text:p=>`Ein Schlitten wird an einem schrägen Seil mit ${f('F = '+p.F+' N')} gezogen. Für die Fortbewegung wirkt davon nur die waagrechte Teilkraft ${f('F_1 = '+p.F1+' N')}. Berechnen Sie a) die senkrechte Teilkraft F_2, die den Schlitten vorn anhebt, und b) den Winkel α zwischen Seil und Boden.`,
 asks:p=>[{k:'a) F_2',unit:'N',v:Math.sqrt(p.F*p.F-p.F1*p.F1)},{k:'b) α',unit:'°',v:Math.acos(p.F1/p.F)*180/Math.PI}],
 hints:p=>['Die Teilkräfte stehen rechtwinklig zueinander. F ist die Hypotenuse.','Pythagoras: F_2 = √(F² − F_1²)','F_1 berührt den Winkel: cos α = F_1 : F'],
 sol:p=>[`Rechtwinkliges Kräftedreieck: ${eq(f('F')+'² = '+f('F_1')+'² + '+f('F_2')+'²')}`,`${eq(f('F_2')+' = √(('+p.F+' N)² − ('+p.F1+' N)²) = '+f(fmt(Math.sqrt(p.F*p.F-p.F1*p.F1))+' N'))}`,`Winkel: ${eq('cos α = '+f('F_1')+' : '+f('F')+' = '+p.F1+' : '+p.F+' = '+fmt(p.F1/p.F,3))}, also ${eq('α = '+fmt(Math.acos(p.F1/p.F)*180/Math.PI,1)+'°')}`]},
{id:'z2',lvl:1,title:'Stechzirkel: Kraft in den Schenkeln',
 gen(){return {FG:rng(4,12,1),al:pick([60,90,120])};},
 draw:p=>drawSpreiz(p,{FG:`F_G = ${p.FG} N`}),
 text:p=>`Ein Stechzirkel steht senkrecht auf einer Unterlage. Oben drückt ${f('F_G = '+p.FG+' N')}. Der Öffnungswinkel zwischen den Schenkeln ist α = ${p.al}°. Mit welcher Kraft F_1 drückt jeder Schenkel in seiner Richtung auf die Unterlage?`,
 asks:p=>[{k:'F_1 = F_2',unit:'N',v:sym(p.FG,rad(p.al/2))}],
 hints:p=>['Die Anordnung ist symmetrisch. Beide Schenkelkräfte sind gleich gross.','Jeder Schenkel steht unter α : 2 zur Senkrechten.','Die senkrechten Anteile beider Schenkel tragen F_G: 2 · F_1 · cos(α : 2) = F_G'],
 sol:p=>[`Winkel jedes Schenkels zur Senkrechten: ${eq('α : 2 = '+p.al/2+'°')}`,`Senkrechte Anteile: ${eq('2 · '+f('F_1')+' · cos(α : 2) = '+f('F_G'))}`,`${eq(f('F_1')+' = '+f('F_G')+' : (2 · cos '+p.al/2+'°) = '+p.FG+' N : '+fmt(2*Math.cos(rad(p.al/2)),3)+' = '+f(fmt(sym(p.FG,rad(p.al/2)))+' N'))}`,'Je weiter der Zirkel geöffnet ist, desto grösser werden die Schenkelkräfte. Bei α = 120° ist jede so gross wie F_G.']},
{id:'z3',lvl:2,title:'Stehleiter auf ebenem Boden',
 gen(){return {FG:rng(600,900,50),al:pick([30,40,50])};},
 draw:p=>drawSpreiz(p,{typ:'leiter',FG:`F_G = ${p.FG} N`}),
 text:p=>`Auf einer Stehleiter steht oben eine Person mit ${f('F_G = '+p.FG+' N')}. Die beiden Leiterteile schliessen den Winkel α = ${p.al}° ein und stehen symmetrisch. Wie gross ist die Kraft F_1 in jedem Leiterteil?`,
 asks:p=>[{k:'F_1 = F_2',unit:'N',v:sym(p.FG,rad(p.al/2))}],
 hints:p=>['Symmetrisch: Beide Leiterteile tragen gleich viel.','Jeder Leiterteil steht unter α : 2 zur Senkrechten.','F_1 = F_G : (2 · cos(α : 2))'],
 sol:p=>[`${eq('2 · '+f('F_1')+' · cos(α : 2) = '+f('F_G'))}`,`${eq(f('F_1')+' = '+p.FG+' N : (2 · cos '+p.al/2+'°) = '+f(fmt(sym(p.FG,rad(p.al/2)))+' N'))}`,`Auffällig: Die Summe beider Kräfte ist ${fmt(2*sym(p.FG,rad(p.al/2)))} N. Das ist mehr als F_G, weil die Kräfte schräg wirken.`]},
{id:'z4',lvl:2,title:'Gemälde am Draht',
 gen(){const [L,b]=pick([[2,1],[2,1.2],[2.6,1],[2.5,1.5],[1.6,0.8]]);return {FG:rng(80,250,10),L,b,hw:b/2,hh:Math.sqrt(L*L-b*b)/2};},
 draw:p=>drawHang(p,{typ:'bild',FG:`F_G = ${p.FG} N`,b:`b = ${fmt(p.b)} m`,L:`Draht gesamt L = ${fmt(p.L)} m`}),
 text:p=>`Ein Gemälde mit ${f('F_G = '+p.FG+' N')} hängt waagrecht an einem Draht mit der Länge ${l('L = '+fmt(p.L)+' m')}. Der Draht läuft über einen Haken. Seine Enden sind ${l('b = '+fmt(p.b)+' m')} voneinander entfernt. Berechnen Sie a) den Winkel β zwischen Draht und Senkrechter und b) die Zugkraft F im Draht.`,
 asks:p=>[{k:'a) β',unit:'°',v:Math.asin(p.b/p.L)*180/Math.PI},{k:'b) F',unit:'N',v:sym(p.FG,Math.asin(p.b/p.L))}],
 hints:p=>['Jede Drahthälfte ist L : 2 lang. Waagrecht überbrückt sie b : 2.','sin β = (b : 2) : (L : 2) = b : L','F = F_G : (2 · cos β)'],
 sol:p=>{const be=Math.asin(p.b/p.L);return [`Halber Draht ${fmt(p.L/2)} m (Hypotenuse), halber Abstand ${fmt(p.b/2)} m (Gegenkathete).`,`${eq('sin β = '+fmt(p.b/2)+' m : '+fmt(p.L/2)+' m = '+fmt(p.b/p.L,3))}, also ${eq('β = '+fmt(be*180/Math.PI,1)+'°')}`,`Senkrechte Anteile: ${eq('2 · '+f('F')+' · cos β = '+f('F_G'))}`,`${eq(f('F')+' = '+p.FG+' N : (2 · cos '+fmt(be*180/Math.PI,1)+'°) = '+f(fmt(sym(p.FG,be))+' N'))}`];}},
{id:'z5',lvl:2,title:'Rohr am Kranhaken',
 gen(){const [wd,h]=pick([[3200,1200],[2400,1600],[3000,2000],[2400,900]]);return {FG:rng(1500,4000,500),b:wd,h,hw:wd/2,hh:h};},
 draw:p=>drawHang(p,{FG:`F_G = ${p.FG} N`,b:`b = ${p.b}`,h:`h = ${p.h}`}),
 text:p=>`Ein Rohr mit ${f('F_G = '+p.FG+' N')} hängt an zwei gleich langen Seilstücken am Kranhaken. Die Anschlagpunkte sind ${l('b = '+p.b+' mm')} voneinander entfernt. Der Haken liegt ${l('h = '+p.h+' mm')} darüber. Berechnen Sie a) die Länge eines Seilstücks und b) die Zugkraft F im Seil.`,
 asks:p=>{const L=Math.hypot(p.b/2,p.h);return [{k:'a) Seillänge',unit:'mm',v:L},{k:'b) F',unit:'N',v:p.FG*L/(2*p.h)}];},
 hints:p=>['Ein Seilstück ist die Hypotenuse: waagrecht b : 2, senkrecht h.','cos β = h : Seillänge','F = F_G : (2 · cos β)'],
 sol:p=>{const L=Math.hypot(p.b/2,p.h);return [`Seillänge: ${eq('√(('+p.b/2+' mm)² + ('+p.h+' mm)²) = '+fmt(L)+' mm')}`,`${eq('cos β = '+p.h+' : '+fmt(L)+' = '+fmt(p.h/L,3))}`,`${eq(f('F')+' = '+f('F_G')+' : (2 · cos β) = '+p.FG+' N : (2 · '+fmt(p.h/L,3)+') = '+f(fmt(p.FG*L/(2*p.h))+' N'))}`,'Mit einem längeren Seil wird β kleiner. Die Seile hängen steiler. Die Zugkraft sinkt.'];}},
{id:'z6',lvl:2,title:'Leitungsmast mit Ankerseil',
 gen(){const [h,a]=pick([[6000,2500],[8000,3000],[6000,3500],[7500,4000]]);return {F:rng(800,2000,100),h,a};},

 asks:p=>{const be=Math.atan(p.a/p.h);return [{k:'a) β',unit:'°',v:be*180/Math.PI},{k:'b) F_1',unit:'N',v:p.F/Math.sin(be)},{k:'c) F_2',unit:'N',v:p.F/Math.tan(be)}];},
 hints:p=>['tan β = a : h','Der waagrechte Anteil der Seilkraft hält F: F_1 · sin β = F','Der senkrechte Anteil der Seilkraft drückt den Mast in den Boden: F_2 = F : tan β'],
 sol:p=>{const be=Math.atan(p.a/p.h);return [`${eq('tan β = '+p.a+' : '+p.h+' = '+fmt(p.a/p.h,3))}, also ${eq('β = '+fmt(be*180/Math.PI,1)+'°')}`,`Waagrecht: ${eq(f('F_1')+' · sin β = '+f('F'))}, also ${eq(f('F_1')+' = '+p.F+' N : sin '+fmt(be*180/Math.PI,1)+'° = '+f(fmt(p.F/Math.sin(be))+' N'))}`,`Senkrecht: ${eq(f('F_2')+' = '+f('F')+' : tan β = '+f(fmt(p.F/Math.tan(be))+' N'))}`,'Das Seil wird gezogen. Der Mast wird gedrückt. Je steiler das Seil, desto grösser beide Kräfte.'];}},
{id:'z7',lvl:2,title:'Wanddrehkran: Kräfte in den Streben',
 gen(){const [h,b]=pick([[1620,2160],[1500,2000],[1200,1600],[1500,3600],[1000,2400]]);return {FG:pick([3,4,5,6,8]),h,b};},
 draw:p=>drawKran(p,{FG:`F_G = ${p.FG} kN`}),
 text:p=>`An einem Wanddrehkran hängt die Last ${f('F_G = '+p.FG+' kN')}. Die waagrechte Strebe II ist ${l('b = '+p.b+' mm')} lang. Die schräge Strebe I ist ${l('h = '+p.h+' mm')} darüber an der Wand befestigt. Berechnen Sie a) die Kraft in Strebe I und b) die Kraft in Strebe II.`,
 asks:p=>{const L=Math.hypot(p.h,p.b);return [{k:'a) F_I',unit:'kN',v:p.FG*L/p.h},{k:'b) F_II',unit:'kN',v:p.FG*p.b/p.h}];},
 hints:p=>['Der Winkel α zwischen den Streben: tan α = h : b','Nur Strebe I hat einen senkrechten Anteil. Er trägt die Last: F_I · sin α = F_G','F_II = F_G : tan α'],
 sol:p=>{const al=Math.atan(p.h/p.b);return [`${eq('tan α = '+p.h+' : '+p.b+' = '+fmt(p.h/p.b,3))}, also ${eq('α = '+fmt(al*180/Math.PI,1)+'°')}`,`Senkrecht: ${eq(f('F_I')+' · sin α = '+f('F_G'))}, also ${eq(f('F_I')+' = '+p.FG+' kN : sin '+fmt(al*180/Math.PI,1)+'° = '+f(fmt(p.FG/Math.sin(al))+' kN'))}`,`Waagrecht: ${eq(f('F_II')+' = '+f('F_G')+' : tan α = '+f(fmt(p.FG/Math.tan(al))+' kN'))}`,'Strebe I wird gezogen. Man könnte sie durch ein Seil ersetzen. Strebe II wird gedrückt.'];}},
{id:'z8',lvl:3,title:'Stehleiter auf geneigtem Boden',
 gen(){const al=pick([30,40,50]);return {FG:rng(600,900,50),al,de:pick(al===30?[5,10]:[5,10,15])};},
 draw:p=>drawSchief(p,{FG:`F_G = ${p.FG} N`}),
 text:p=>`Eine Stehleiter mit dem Öffnungswinkel α = ${p.al}° steht auf einem Boden mit der Neigung δ = ${p.de}°. Teil 1 steht höher. Oben steht eine Person mit ${f('F_G = '+p.FG+' N')}. Berechnen Sie a) den Winkel β_1 von Teil 1 zur Senkrechten, b) den Winkel β_2 von Teil 2, c) die Kraft F_1 in Teil 1 und d) die Kraft F_2 in Teil 2.`,
 asks:p=>{const b1=rad(p.al/2+p.de),b2=rad(p.al/2-p.de);return [{k:'a) β_1',unit:'°',v:p.al/2+p.de},{k:'b) β_2',unit:'°',v:p.al/2-p.de},{k:'c) F_1',unit:'N',v:p.FG*Math.sin(b2)/Math.sin(rad(p.al))},{k:'d) F_2',unit:'N',v:p.FG*Math.sin(b1)/Math.sin(rad(p.al))}];},
 hints:p=>['Die ganze Leiter kippt um die Bodenneigung δ. Ein Teil wird flacher, der andere steiler.','β_1 = α : 2 + δ und β_2 = α : 2 − δ','Waagrecht heben sich die Anteile auf: F_1 · sin β_1 = F_2 · sin β_2','Sinussatz im Kräftedreieck: F_1 = F_G · sin β_2 : sin α und F_2 = F_G · sin β_1 : sin α'],
 sol:p=>{const B1=p.al/2+p.de,B2=p.al/2-p.de,b1=rad(B1),b2=rad(B2),sa=Math.sin(rad(p.al));return [`Winkel: ${eq('β_1 = '+p.al/2+'° + '+p.de+'° = '+B1+'°')} und ${eq('β_2 = '+p.al/2+'° − '+p.de+'° = '+B2+'°')}`,`Kräftedreieck mit dem Sinussatz. Gegenüber von F_G liegt der Winkel 180° − α.`,`${eq(f('F_1')+' = '+f('F_G')+' · sin β_2 : sin α = '+p.FG+' N · sin '+B2+'° : sin '+p.al+'° = '+f(fmt(p.FG*Math.sin(b2)/sa)+' N'))}`,`${eq(f('F_2')+' = '+f('F_G')+' · sin β_1 : sin α = '+p.FG+' N · sin '+B1+'° : sin '+p.al+'° = '+f(fmt(p.FG*Math.sin(b1)/sa)+' N'))}`,'Der steilere Teil trägt mehr. Achtung: Zu F_1 gehört der Sinus des anderen Winkels.'];}},
{id:'z9',lvl:3,title:'Strassenleuchte an zwei ungleichen Seilen',
 gen(){const [l1,l2,wd,d]=pick([[10,17,21,8],[13,15,14,12],[13,20,21,12],[15,20,25,12]]);return {FG:rng(150,400,50),l1,l2,w:wd,d,H:pick([8,10])};},
 draw:p=>drawLampe(p,{FG:`F_G = ${p.FG} N`}),
 text:p=>`Eine Strassenleuchte mit ${f('F_G = '+p.FG+' N')} hängt ${l('H = '+p.H+' m')} über der Strasse an zwei Seilen mit ${l('l_1 = '+p.l1+' m')} und ${l('l_2 = '+p.l2+' m')}. Die Haken sitzen auf gleicher Höhe an zwei Hauswänden. Die Wände sind ${l('w = '+p.w+' m')} voneinander entfernt. Berechnen Sie a) die Höhe der Haken über der Strasse, b) die Seilkraft F_1 und c) die Seilkraft F_2.`,
 asks:p=>{const x1=Math.sqrt(p.l1**2-p.d**2),x2=p.w-x1,t1=Math.atan2(x1,p.d),t2=Math.atan2(x2,p.d);return [{k:'a) Hakenhöhe',unit:'m',v:p.H+p.d},{k:'b) F_1',unit:'N',v:p.FG*Math.sin(t2)/Math.sin(t1+t2)},{k:'c) F_2',unit:'N',v:p.FG*Math.sin(t1)/Math.sin(t1+t2)}];},
 hints:p=>['Die Leuchte hängt um d tiefer als die Haken. Waagrecht gilt x_1 + x_2 = w.','Pythagoras zweimal: l_1² = x_1² + d² und l_2² = x_2² + d². Subtrahieren ergibt x_2 − x_1 = (l_2² − l_1²) : w.','Mit x_1 und d kennst du die Winkel der Seile zur Senkrechten: tan θ = x : d.','F_1 = F_G · sin θ_2 : sin(θ_1 + θ_2)'],
 sol:p=>{const x1=Math.sqrt(p.l1**2-p.d**2),x2=p.w-x1,t1=Math.atan2(x1,p.d),t2=Math.atan2(x2,p.d),D=d=>fmt(d*180/Math.PI,1);return [`${eq('x_2 − x_1 = (l_2² − l_1²) : w = ('+p.l2**2+' − '+p.l1**2+') : '+p.w+' = '+fmt(x2-x1)+' m')}. Mit ${eq('x_1 + x_2 = '+p.w+' m')} folgt ${eq('x_1 = '+fmt(x1)+' m')} und ${eq('x_2 = '+fmt(x2)+' m')}.`,`Durchhang: ${eq('d = √(l_1² − x_1²) = '+fmt(p.d)+' m')}. Hakenhöhe: ${eq(p.H+' m + '+fmt(p.d)+' m = '+fmt(p.H+p.d)+' m')}`,`Winkel zur Senkrechten: ${eq('θ_1 = '+D(t1)+'°')} und ${eq('θ_2 = '+D(t2)+'°')}`,`${eq(f('F_1')+' = '+f('F_G')+' · sin θ_2 : sin(θ_1 + θ_2) = '+f(fmt(p.FG*Math.sin(t2)/Math.sin(t1+t2))+' N'))}`,`${eq(f('F_2')+' = '+f('F_G')+' · sin θ_1 : sin(θ_1 + θ_2) = '+f(fmt(p.FG*Math.sin(t1)/Math.sin(t1+t2))+' N'))}`,'Das kürzere, steilere Seil trägt mehr. Beide Kräfte sind hier grösser als F_G, weil die Seile flach hängen.'];}},
{id:'z10',lvl:3,title:'Spannreck: räumliche Zerlegung',
 gen(){return {A:5.5,B:4,s:2.4,h:pick([2.4,1.6,2]),F:pick([4,5,6])};},
 draw:drawReck,
 text:p=>`Ein Spannreck wird mit vier Seilen verspannt. Jedes Seil zieht mit ${f('F = '+p.F+' kN')} an einem Pfostenkopf. Die Bodenanker bilden ein Rechteck mit ${l('A = '+fmt(p.A)+' m')} und ${l('B = '+fmt(p.B)+' m')}. Die Reckstange ist ${l('s = '+fmt(p.s)+' m')} lang und ${l('h = '+fmt(p.h)+' m')} hoch. Berechnen Sie a) die Länge eines Seils, b) die Kraft F_1, mit der ein Pfosten auf den Boden gedrückt wird, und c) die Zugkraft in der Reckstange.`,

const PF=get=>p=>{const [F,u1,u2,n]=get(p);return [{cap:'Zeichne die gegebene Kraft massstäblich als Pfeil.',svg:()=>drawPara(F,u1,u2,n,0)},{cap:'Zeichne durch den Anfang und durch die Spitze je eine Parallele zu den beiden Richtungen. Die Richtungen sind durch Seile, Streben oder Schenkel gegeben.',svg:()=>drawPara(F,u1,u2,n,1)},{cap:'Es entsteht ein Kräfteparallelogramm. Seine Seiten vom Anfangspunkt aus sind die beiden Teilkräfte. Miss ihre Länge oder berechne sie im Dreieck.',svg:()=>drawPara(F,u1,u2,n,2)}];};
const LESP=[`${f('Kräftiger Pfeil')}: die gegebene Kraft.`,'Gestrichelte Linien: Parallelen zu den beiden Richtungen.','Helle Pfeile: die beiden Teilkräfte. Zusammen ersetzen sie die gegebene Kraft.','Die Pfeillängen sind massstäblich. Längerer Pfeil bedeutet grössere Kraft.'];
const symU=h=>[[0,1],[-Math.sin(h),Math.cos(h)],[Math.sin(h),Math.cos(h)],['F_G','F_1','F_2']];
const TZL='Kraft zerlegen: Parallelen zu den beiden Richtungen durch Anfang und Spitze zeichnen. Bedingung: Die Wirkungslinien der Kraft und der beiden Teilkräfte gehen durch einen Punkt.';
EK('z1',PF(p=>{const a=Math.acos(p.F1/p.F);return [[Math.cos(a),-Math.sin(a)],[1,0],[0,-1],['F','F_1','F_2']];}),LESP,'Du ziehst einen Koffer am schrägen Griff. Ein Teil deiner Kraft zieht ihn vorwärts. Der andere Teil hebt ihn vorn etwas an.','Die Teilkräfte einfach addieren: F_1 + F_2 ist grösser als F.','Rechtwinklige Zerlegung: F² = F_1² + F_2². Der Winkel folgt aus cos α = F_1 : F.');
EK('z2',PF(p=>symU(rad(p.al/2))),LESP,'Du machst einen Spagat zwischen zwei Stühlen. Je weiter die Stühle auseinander stehen, desto stärker drücken deine Beine nach aussen.','F_G einfach durch 2 teilen. Das gilt nur bei α = 0°.','Symmetrisch: F_1 = F_G : (2 · cos(α : 2)). Je grösser der Öffnungswinkel, desto grösser die Schenkelkraft.');
EK('z3',PF(p=>symU(rad(p.al/2))),LESP,'Ein Kartenhaus aus zwei Karten: Stehen sie steil, halten sie leicht. Stehen sie flach, rutschen sie auseinander.','Den ganzen Winkel α statt α : 2 einsetzen.','Symmetrisch: F_1 = F_G : (2 · cos(α : 2)).');
EK('z4',PF(p=>symU(Math.asin(p.b/p.L))),LESP,'Eine Wäscheleine hängt fast waagrecht. Schon ein nasses Tuch spannt sie stark. Je flacher das Seil, desto grösser die Zugkraft.','Mit der ganzen Drahtlänge und dem ganzen Abstand ein falsches Dreieck bilden. Nimm die Hälften.',TZL);
EK('z5',PF(p=>symU(Math.atan(p.hw/p.hh))),LESP,'Du trägst eine schwere Tasche mit kurzen Henkeln weit gespreizt. Das zieht stark. Mit langen Henkeln hängen sie steiler und es geht leichter.','Die Zugkraft mit dem Sinus statt dem Kosinus rechnen.','Je länger das Seil, desto steiler hängt es und desto kleiner ist die Zugkraft.');
EK('z6',PF(p=>{const b=Math.atan(p.a/p.h);return [[1,0],[Math.sin(b),-Math.cos(b)],[0,1],['F','F_1 (Seil)','F_2 (Mast)']];}),LESP,'Eine Zeltstange wird von einer schrägen Abspannleine gehalten. Die Leine zieht die Stange zurück und drückt sie gleichzeitig in den Boden.','Den Winkel am Boden statt am Mast nehmen.','Seilkraft F_1 = F : sin β, Mastkraft F_2 = F : tan β. Das Seil wird gezogen, der Mast gedrückt.');
EK('z7',PF(p=>{const a=Math.atan(p.h/p.b);return [[0,1],[Math.cos(a),Math.sin(a)],[-1,0],['F_G','F_I','F_II']];}),LESP,'Ein Blumenampel-Halter an der Wand: Oben hält eine Kette schräg, unten stützt ein waagrechter Arm. Die Kette wird gezogen, der Arm gegen die Wand gedrückt.','Sinus und Tangens vertauschen. Kontrolle: Die schräge Strebe hat immer die grössere Kraft.','F_I = F_G : sin α (Zug), F_II = F_G : tan α (Druck). Eine Zugstrebe kann man durch ein Seil ersetzen.');
EK('z8',PF(p=>[[0,1],[-Math.sin(rad(p.al/2+p.de)),Math.cos(rad(p.al/2+p.de))],[Math.sin(rad(p.al/2-p.de)),Math.cos(rad(p.al/2-p.de))],['F_G','F_1','F_2']]),LESP,'Du stehst breitbeinig an einem Hang. Das Bein, das steiler unter dir steht, trägt mehr von deinem Gewicht.','Bei F_1 den eigenen Winkel β_1 in den Zähler setzen. Es gehört der andere Winkel hinein.','Unsymmetrisch: F_1 = F_G · sin β_2 : sin(β_1 + β_2). Der steilere Teil trägt mehr.');
EK('z9',PF(p=>{const x1=Math.sqrt(p.l1**2-p.d**2),t1=Math.atan2(x1,p.d),t2=Math.atan2(p.w-x1,p.d);return [[0,1],[Math.sin(t1),Math.cos(t1)],[-Math.sin(t2),Math.cos(t2)],['F_G','F_1','F_2']];}),LESP,'Zwei Personen tragen eine Tasche an zwei Henkeln. Wer seinen Henkel steiler hält, trägt mehr.','Meinen, das längere Seil trage mehr. Es kommt auf den Winkel an, nicht auf die Länge.','Zuerst die Geometrie lösen (Durchhang, Winkel). Dann die Kraft zerlegen: F_1 = F_G · sin θ_2 : sin(θ_1 + θ_2).');
EK('z10',TF('z10',['Schau von oben: Jedes Seil läuft vom Pfostenkopf schräg zu einem Bodenanker.','Zerlege den Weg eines Seils in drei Strecken: in Stangenrichtung, quer dazu und senkrecht nach unten.','Die Seilkraft teilt sich im gleichen Verhältnis auf wie diese drei Strecken zur Seillänge.','An jedem Pfosten ziehen zwei Seile. Senkrecht und in Stangenrichtung addieren sich ihre Anteile. Quer heben sie sich auf.']),LESG,'Ein Zelt wird mit Schnüren abgespannt. Jede Schnur zieht die Stange nach unten und zur Seite. Gegenüberliegende Schnüre heben den seitlichen Zug auf.','Nur mit zwei Strecken rechnen und die dritte Richtung vergessen.','Räumliche Zerlegung: Anteil = Kraft · Strecke in dieser Richtung : Seillänge.');

 hints:p=>['Betrachte den Knoten am Ende. Dort treffen Last, Stab und Strebe zusammen.','Nur die Strebe hat einen senkrechten Anteil. Er muss F tragen: F_D · (h : Strebenlänge) = F.','Strebenlänge = √(b² + h²). Waagrecht: F_Z = F_D · (b : Strebenlänge) = F · b : h.'],
 sol:p=>{const L=Math.hypot(p.b,p.h);return [`Strebenlänge: ${eq('√('+p.b+'² + '+p.h+'²) = '+fmt(L)+' mm')}`,`Senkrecht am Knoten: ${eq(f('F_D')+' · h : '+fmt(L)+' = '+f('F'))}, also ${eq(f('F_D')+' = '+p.F+' N · '+fmt(L)+' : '+p.h+' = '+f(fmt(p.F*L/p.h)+' N'))}`,`Waagrecht am Knoten: ${eq(f('F_Z')+' = '+f('F')+' · b : h = '+p.F+' N · '+p.b+' : '+p.h+' = '+f(fmt(p.F*p.b/p.h)+' N'))}`,'Der obere Stab wird gezogen. Er zieht an der oberen Befestigung. Die Strebe wird gedrückt. Sie drückt unten gegen die Wand. Beim Wanddrehkran ist es umgekehrt: Dort liegt die Zugstrebe oben schräg.'];},
 solDraw:p=>drawKonsole(p,{Z:`Zug: F_Z = ${fmt(p.F*p.b/p.h)} N`,D:`Druck: F_D = ${fmt(p.F*Math.hypot(p.b,p.h)/p.h)} N`})},
{id:'w3',lvl:2,title:'Angeschraubte Wandkonsole: Schraubenkraft',
 gen(){return {F:rng(300,1500,100),a:pick([200,250,300,400]),h:pick([100,120,150,200])};},
 draw:p=>drawSchraubK(p),
 text:p=>`Ein Winkel ist oben mit zwei Schrauben an die Wand geschraubt. Unten liegt er an der Wand an. Auf dem Arm steht ${f('F = '+p.F+' N')} im Abstand ${l('a = '+p.a+' mm')} von der Wand. Der Abstand von den Schrauben zur unteren Kante ist ${l('h = '+p.h+' mm')}. Berechnen Sie a) die gesamte Schraubenkraft F_S, b) die Kraft je Schraube und c) die Anpresskraft F_K an der unteren Kante.`,
 asks:p=>[{k:'a) F_S',unit:'N',v:p.F*p.a/p.h},{k:'b) je Schraube',unit:'N',v:p.F*p.a/p.h/2},{k:'c) F_K',unit:'N',v:p.F*p.a/p.h}],
 hints:p=>['Die Last will den Winkel oben von der Wand wegkippen. Er kippt um die untere Kante K.','Drehpunkt in K: F_S · h = F · a','Waagrecht muss Gleichgewicht herrschen: Die Schrauben ziehen zur Wand, die Wand drückt unten zurück. F_K = F_S.'],
 sol:p=>{const S=p.F*p.a/p.h;return [`Drehpunkt in der Kippkante K. Die Anpresskraft geht durch K und fällt weg.`,`Momentengleichgewicht: ${eq(f('F_S')+' · '+l('h')+' = '+f('F')+' · '+l('a'))}`,`${eq(f('F_S')+' = '+p.F+' N · '+p.a+' mm : '+p.h+' mm = '+f(fmt(S)+' N'))}`,`Zwei Schrauben: ${eq(fmt(S)+' N : 2 = '+f(fmt(S/2)+' N'))} je Schraube`,`Waagrecht: ${eq(f('F_K')+' = '+f('F_S')+' = '+f(fmt(S)+' N'))}`,`Auffällig: Die Schraubenkraft ist ${fmt(p.a/p.h)}-mal so gross wie die Last. Der kurze Hebel h macht sie gross. Darum Schrauben möglichst weit von der Kippkante setzen.`];}},
{id:'w4',lvl:2,title:'Tür an zwei Scharnieren',
 gen(){return {FG:rng(300,800,50),b:pick([800,900,1000]),h:pick([1500,1600,1800])};},
 draw:p=>drawTuer(p),
 text:p=>`Eine Tür mit ${f('F_G = '+p.FG+' N')} hängt an zwei Scharnieren. Ihr Schwerpunkt S liegt in der Türmitte. Die Tür ist ${l('b = '+p.b+' mm')} breit. Die Scharniere sind ${l('h = '+p.h+' mm')} voneinander entfernt. Das untere Scharnier trägt das ganze Gewicht. Berechnen Sie a) die waagrechte Kraft F_O im oberen Scharnier, b) die waagrechte Kraft F_U im unteren Scharnier und c) die senkrechte Kraft F_V im unteren Scharnier.`,
 asks:p=>[{k:'a) F_O',unit:'N',v:p.FG*p.b/2/p.h},{k:'b) F_U',unit:'N',v:p.FG*p.b/2/p.h},{k:'c) F_V',unit:'N',v:p.FG}],
 hints:p=>['Die Tür will oben von der Wand wegkippen. Sie dreht um das untere Scharnier.','Der Hebelarm von F_G ist die halbe Türbreite. Der Hebelarm von F_O ist h.','F_O · h = F_G · b : 2. Waagrecht gilt F_U = F_O.'],
 sol:p=>{const O=p.FG*p.b/2/p.h;return [`Drehpunkt im unteren Scharnier. F_U und F_V gehen durch diesen Punkt.`,`Momentengleichgewicht: ${eq(f('F_O')+' · '+l('h')+' = '+f('F_G')+' · '+l('b : 2'))}`,`${eq(f('F_O')+' = '+p.FG+' N · '+p.b/2+' mm : '+p.h+' mm = '+f(fmt(O)+' N'))}`,`Waagrecht: ${eq(f('F_U')+' = '+f('F_O')+' = '+f(fmt(O)+' N'))}. Oben zieht das Scharnier die Tür zur Wand, unten drückt es sie weg.`,`Senkrecht: ${eq(f('F_V')+' = '+f('F_G')+' = '+f(p.FG+' N'))}`,'Je weiter die Scharniere auseinander liegen, desto kleiner sind die waagrechten Kräfte. Darum hängt eine Tür besser an weit entfernten Scharnieren.'];}},
{id:'w5',lvl:3,title:'Leiter an einer glatten Wand',
 gen(){const L=pick([3,4,5]);return {L,al:pick([60,65,70]),FG:rng(600,900,50),FL:pick([100,150,200]),s:+(L*pick([0.6,0.75,0.8])).toFixed(2)};},
 draw:p=>drawLeiter(p),
 text:p=>`Eine Leiter mit ${l('L = '+fmt(p.L)+' m')} und dem Eigengewicht ${f('F_L = '+p.FL+' N')} lehnt unter α = ${p.al}° an einer glatten Wand. Eine Person mit ${f('F_G = '+p.FG+' N')} steht ${l('s = '+fmt(p.s)+' m')} vom Fuss entfernt auf der Leiter. Die glatte Wand drückt nur waagrecht. Berechnen Sie a) die Wandkraft F_W, b) die Normalkraft F_N am Boden und c) die Reibungszahl μ, die der Boden mindestens haben muss.`,
 asks:p=>{const c=Math.cos(rad(p.al)),sn=Math.sin(rad(p.al)),W=(p.FG*p.s+p.FL*p.L/2)*c/(p.L*sn),N=p.FG+p.FL;return [{k:'a) F_W',unit:'N',v:W},{k:'b) F_N',unit:'N',v:N},{k:'c) μ mindestens',unit:'',v:W/N}];},
 hints:p=>['Drehpunkt im Fuss der Leiter. Dort greifen F_N und F_R an. Sie fallen weg.','Die Hebelarme der Gewichtskräfte sind waagrecht: Abstand · cos α. Der Hebelarm von F_W ist senkrecht: L · sin α.','F_W · L · sin α = F_G · s · cos α + F_L · (L : 2) · cos α','Senkrecht: F_N = F_G + F_L. Waagrecht: F_R = F_W. Damit die Leiter nicht rutscht: μ ≥ F_R : F_N.'],
 sol:p=>{const c=Math.cos(rad(p.al)),sn=Math.sin(rad(p.al)),M=(p.FG*p.s+p.FL*p.L/2)*c,W=M/(p.L*sn),N=p.FG+p.FL;return [`Drehpunkt im Fuss. Hebelarme der Gewichtskräfte (waagrecht): ${eq(fmt(p.s)+' m · cos '+p.al+'° = '+fmt(p.s*c,3)+' m')} und ${eq(fmt(p.L/2)+' m · cos '+p.al+'° = '+fmt(p.L/2*c,3)+' m')}`,`Hebelarm der Wandkraft (senkrecht): ${eq(fmt(p.L)+' m · sin '+p.al+'° = '+fmt(p.L*sn,3)+' m')}`,`${eq(f('F_W')+' · '+fmt(p.L*sn,3)+' m = '+p.FG+' N · '+fmt(p.s*c,3)+' m + '+p.FL+' N · '+fmt(p.L/2*c,3)+' m')}`,`${eq(f('F_W = '+fmt(W)+' N'))}`,`Senkrecht: ${eq(f('F_N')+' = '+f('F_G')+' + '+f('F_L')+' = '+f(N+' N'))}`,`Waagrecht: ${eq(f('F_R')+' = '+f('F_W'))}. Mindestens nötig: ${eq('μ = '+fmt(W)+' N : '+N+' N = '+fmt(W/N,3))}`,'Je flacher die Leiter steht und je höher die Person steigt, desto grösser wird F_W. Dann rutscht die Leiter leichter weg.'];}},
{id:'w6',lvl:3,title:'Wandausleger mit Seilabspannung',
 gen(){const L=pick([2000,2500,3000]);return {L,h:pick([1000,1200,1500]),a:L*pick([0.6,0.75,0.8]),F:rng(2,8,1),FE:pick([0.5,0.8,1])};},
 draw:p=>drawAusleger(p),
 text:p=>`Ein waagrechter Ausleger mit ${l('L = '+p.L+' mm')} ist in A gelenkig an der Wand befestigt. Ein Seil hält sein Ende. Es ist ${l('h = '+p.h+' mm')} über A an der Wand befestigt. Im Abstand ${l('a = '+p.a+' mm')} hängt eine Last mit ${f('F = '+p.F+' kN')}. Das Eigengewicht des Auslegers ist ${f('F_E = '+fmt(p.FE)+' kN')}. Berechnen Sie a) die Seilkraft F_S, b) die waagrechte Gelenkkraft F_Ax und c) die senkrechte Gelenkkraft F_Ay in A.`,
 asks:p=>{const M=p.F*p.a+p.FE*p.L/2,len=Math.hypot(p.L,p.h);return [{k:'a) F_S',unit:'kN',v:M/p.L*len/p.h},{k:'b) F_Ax',unit:'kN',v:M/p.h},{k:'c) F_Ay',unit:'kN',v:p.F+p.FE-M/p.L}];},
 hints:p=>['Drehpunkt im Wandgelenk A. Die Gelenkkräfte fallen weg.','Zerlege die Seilkraft am Auslegerende: senkrechter Anteil F_S · h : Seillänge, waagrechter Anteil F_S · L : Seillänge.','Nur der senkrechte Anteil hat um A den Hebelarm L: (F_S · h : Seillänge) · L = F · a + F_E · L : 2','Danach: F_Ax = waagrechter Seilanteil, F_Ay = F + F_E − senkrechter Seilanteil.'],
 sol:p=>{const M=p.F*p.a+p.FE*p.L/2,len=Math.hypot(p.L,p.h),Sv=M/p.L;return [`Seillänge: ${eq('√('+p.L+'² + '+p.h+'²) = '+fmt(len)+' mm')}`,`Momente um A: ${eq('F_S,senkrecht · '+l('L')+' = '+f('F')+' · '+l('a')+' + '+f('F_E')+' · '+l('L : 2'))}`,`${eq('F_S,senkrecht = ('+p.F+' kN · '+p.a+' + '+fmt(p.FE)+' kN · '+p.L/2+') : '+p.L+' = '+fmt(Sv,3)+' kN')}`,`${eq(f('F_S')+' = '+fmt(Sv,3)+' kN · '+fmt(len)+' : '+p.h+' = '+f(fmt(Sv*len/p.h)+' kN'))}`,`Waagrecht: ${eq(f('F_Ax')+' = '+fmt(Sv,3)+' kN · '+p.L+' : '+p.h+' = '+f(fmt(M/p.h)+' kN'))}. Das Gelenk drückt den Ausleger von der Wand weg.`,`Senkrecht: ${eq(f('F_Ay')+' = '+p.F+' kN + '+fmt(p.FE)+' kN − '+fmt(Sv,3)+' kN = '+f(fmt(p.F+p.FE-Sv)+' kN'))}`];}}
];

{id:'q1',lvl:1,title:'Tauziehen',

 asks:p=>{const a=p.A.reduce((x,y)=>x+y),b=p.B.reduce((x,y)=>x+y);return [{k:'a) Team A',unit:'N',v:a},{k:'b) Team B',unit:'N',v:b},{k:'c) F_R',unit:'N',v:b-a}];},
 hints:p=>['Innerhalb eines Teams zeigen alle Kräfte in die gleiche Richtung: addieren.','Die Teams ziehen gegeneinander: subtrahieren.','F_R = Team B − Team A. Ein Minus bedeutet: nach links, Team A gewinnt.'],
 sol:p=>{const a=p.A.reduce((x,y)=>x+y),b=p.B.reduce((x,y)=>x+y);return [`Team A: ${eq(p.A.join(' N + ')+' N = '+f(a+' N'))}`,`Team B: ${eq(p.B.join(' N + ')+' N = '+f(b+' N'))}`,`${eq(fr('F_R')+' = '+b+' N − '+a+' N = '+fr((b-a)+' N'))}`,b>a?'Positiv: Das Seil bewegt sich nach rechts. Team B gewinnt.':'Negativ: Das Seil bewegt sich nach links. Team A gewinnt.'];}},
{id:'q2',lvl:1,title:'Last am Kranhaken',
 gen(){return {m:rng(200,1500,50),mH:pick([15,20,25,40])};},

 text:p=>`Am Kranseil hängt ein Haken mit m_H = ${p.mH} kg. Daran hängt eine Kiste mit m = ${p.m} kg. Berechnen Sie a) die Gewichtskraft der Kiste, b) die Gewichtskraft des Hakens und c) die Kraft F_S im Seil in kN. (g = 9,81 m/s²)`,
 asks:p=>[{k:'a) F_G Kiste',unit:'N',v:p.m*g},{k:'b) F_G Haken',unit:'N',v:p.mH*g},{k:'c) F_S',unit:'kN',v:(p.m+p.mH)*g/1000}],
 hints:p=>['Beide Gewichtskräfte zeigen nach unten. Sie liegen auf derselben Wirkungslinie.','F_G = m · g für jede Masse.','Das Seil trägt beide: F_S = F_G,Kiste + F_G,Haken. Dann durch 1000 für kN.'],
 sol:p=>[`Kiste: ${eq(f('F_G')+' = '+p.m+' kg · 9,81 m/s² = '+f(fmt(p.m*g)+' N'))}`,`Haken: ${eq(f('F_G')+' = '+p.mH+' kg · 9,81 m/s² = '+f(fmt(p.mH*g)+' N'))}`,`Gleiche Richtung, also addieren: ${eq(f('F_S')+' = '+fmt(p.m*g)+' N + '+fmt(p.mH*g)+' N = '+fmt((p.m+p.mH)*g)+' N = '+f(fmt((p.m+p.mH)*g/1000,2)+' kN'))}`,'Das Seil zieht mit dieser Kraft nach oben. So herrscht Gleichgewicht.']},
{id:'q3',lvl:2,title:'Schiff mit zwei Schleppern',
 gen(){let F1,F2,FW,FWi;do{F1=rng(20,60,5);F2=rng(10,40,5);FW=rng(15,50,5);FWi=rng(3,12,1);}while(Math.abs(F1+F2-FW-FWi)<3);return {F1,F2,FW,FWi};},

 asks:p=>[{k:'a) Antrieb',unit:'kN',v:p.F1+p.F2},{k:'b) Bremsen',unit:'kN',v:p.FW+p.FWi},{k:'c) F_R',unit:'kN',v:p.F1+p.F2-p.FW-p.FWi}],
 hints:p=>['Schieben und Ziehen in Fahrtrichtung wirken gleich. Beide zeigen nach rechts.','Wasserwiderstand und Gegenwind zeigen nach links.','F_R = (F_1 + F_2) − (F_W + F_Wind)'],
 sol:p=>{const R=p.F1+p.F2-p.FW-p.FWi;return [`Antrieb (nach rechts): ${eq(p.F1+' kN + '+p.F2+' kN = '+f((p.F1+p.F2)+' kN'))}`,`Bremsen (nach links): ${eq(p.FW+' kN + '+p.FWi+' kN = '+f((p.FW+p.FWi)+' kN'))}`,`${eq(fr('F_R')+' = '+(p.F1+p.F2)+' kN − '+(p.FW+p.FWi)+' kN = '+fr(R+' kN'))}`,R>0?'Positiv: Das Schiff wird in Fahrtrichtung schneller.':'Negativ: Das Schiff wird langsamer.','Ob eine Kraft zieht oder schiebt, ist egal. Es zählt nur ihre Richtung.'];}},
{id:'q4',lvl:2,title:'Bus mit Anhänger',

 draw:drawBus,

 asks:p=>[{k:'a) F_A',unit:'N',v:p.FL+p.FRo+p.FAn},{k:'b) F_R',unit:'N',v:p.FM-p.FL-p.FRo-p.FAn}],
 hints:p=>['Konstante Geschwindigkeit bedeutet Gleichgewicht: F_R = 0.','Alle Widerstände zeigen nach hinten. Die Antriebskraft muss gleich gross sein wie ihre Summe.','b) F_R = neue Antriebskraft − Summe der Widerstände.'],
 sol:p=>{const W=p.FL+p.FRo+p.FAn;return [`Gleichgewicht: ${eq(f('F_A')+' − '+f('F_L')+' − '+f('F_Roll')+' − '+f('F_Anh')+' = 0')}`,`${eq(f('F_A')+' = '+p.FL+' N + '+p.FRo+' N + '+p.FAn+' N = '+f(W+' N'))}`,`b) ${eq(fr('F_R')+' = '+p.FM+' N − '+W+' N = '+fr((p.FM-W)+' N'))} nach vorne`,'Mit dieser Resultierenden wird der Bus schneller. Typischer Denkfehler: Für konstante Geschwindigkeit braucht es keine Kraft. Falsch: Man braucht genau so viel Kraft, wie die Widerstände bremsen.'];}},
{id:'q5',lvl:2,title:'Kräfteplan im Massstab',

{id:'q6',lvl:2,title:'Zwei Personen ziehen rechtwinklig',

 text:p=>`Ein Maschinenschlitten läuft auf zwei Wälzführungen A und B. Im Betrieb wirkt die Gesamtbelastung ${f('F = '+p.F+' N')}. Sie greift ${l(p.a+' mm')} rechts von A und ${l(p.b+' mm')} links von B an. Wie gross sind die Belastungen F_A und F_B der Führungen?`+BW(p),
 asks:p=>[{k:'F_A',unit:'N',v:p.F*p.b/(p.a+p.b)},{k:'F_B',unit:'N',v:p.F*p.a/(p.a+p.b)}],
 hints:p=>['Ersatzbild: Der Schlitten ist ein Träger auf zwei Stützen A und B. Lagerabstand l = '+p.a+' mm + '+p.b+' mm.','1. Schritt: Drehpunkt in A. 2. Schritt: F_B im Lager B ansetzen.','3. Schritt: F_B · l = F · '+p.a+' mm. 4. Schritt: F_A = F − F_B.'],
 sol:p=>{const L=p.a+p.b,FB=p.F*p.a/L;return [`Ersatzbild: Träger auf zwei Stützen, ${eq(l('l = '+p.a+' mm + '+p.b+' mm = '+L+' mm'))}`,`1. Schritt: Drehpunkt in A. 2. Schritt: F_B in B ansetzen.`,`3. Schritt, ΣM_l = ΣM_r: ${eq(f('F_B')+' · '+l('l')+' = '+f('F')+' · '+l(p.a+' mm'))}`,`${eq(f('F_B')+' = '+p.F+' N · '+p.a+' mm : '+L+' mm = '+f(fmt(FB)+' N'))}`,`4. Schritt, F_A + F_B = F: ${eq(f('F_A')+' = '+p.F+' N − '+fmt(FB)+' N = '+f(fmt(p.F-FB)+' N'))}`];}},
{id:'b2',lvl:1,title:'Träger mit zwei Kräften',
 gen:bk({F1:6000,F2:4500,l:1000,a:300,c:250},()=>({F1:rng(3000,8000,500),F2:rng(2000,6000,500),l:pick([1000,1200,1500]),a:pick([200,300,400]),c:pick([200,250,300])})),
 draw:p=>drawBeam({l:p.l,loads:[{x:p.a,F:p.F1,lab:`F_1 = ${p.F1} N`,anc:1},{x:p.l-p.c,F:p.F2,lab:`F_2 = ${p.F2} N`}]},{segs:[`${p.a}`,'',`${p.c}`],tot:`l = ${p.l}`}),
 text:p=>`Ein Träger mit dem Lagerabstand ${l('l = '+p.l+' mm')} wird durch ${f('F_1 = '+p.F1+' N')} (${l(p.a+' mm')} von A) und ${f('F_2 = '+p.F2+' N')} (${l(p.c+' mm')} von B) belastet. Wie gross sind die Lagerkräfte F_A und F_B? Die Gewichtskraft des Trägers wird nicht berücksichtigt.`+BW(p),
 asks:p=>{const FB=(p.F1*p.a+p.F2*(p.l-p.c))/p.l;return [{k:'F_A',unit:'N',v:p.F1+p.F2-FB},{k:'F_B',unit:'N',v:FB}];},
 hints:p=>['Achtung: F_2 ist von B aus bemasst. Ihr Hebelarm um A ist l − '+p.c+' mm = '+(p.l-p.c)+' mm.','Drehpunkt in A: F_B · l = F_1 · '+p.a+' mm + F_2 · '+(p.l-p.c)+' mm','F_A = F_1 + F_2 − F_B'],
 sol:p=>{const x2=p.l-p.c,FB=(p.F1*p.a+p.F2*x2)/p.l;return [`Hebelarm von F_2 um A: ${eq(l(p.l+' mm − '+p.c+' mm = '+x2+' mm'))}`,`3. Schritt, ΣM_l = ΣM_r: ${eq(f('F_B')+' · '+l('l')+' = '+f('F_1')+' · '+l('l_1')+' + '+f('F_2')+' · '+l('l_2'))}`,`${eq(f('F_B')+' = ('+p.F1+' N · '+p.a+' mm + '+p.F2+' N · '+x2+' mm) : '+p.l+' mm = '+f(fmt(FB)+' N'))}`,`4. Schritt: ${eq(f('F_A')+' = '+p.F1+' N + '+p.F2+' N − '+fmt(FB)+' N = '+f(fmt(p.F1+p.F2-FB)+' N'))}`];}},
{id:'b3',lvl:1,title:'Fräsmaschine: Fräsdorn',
 gen:bk({F:3.5,a:180,b:210},()=>({F:pick([2,2.5,3,3.5,4,5]),a:pick([150,180,200]),b:pick([180,210,250])})),
 draw:p=>drawBeam({l:p.a+p.b,loads:[{x:p.a,F:p.F,lab:`F = ${fmt(p.F)} kN`}]},{segs:[`${p.a}`,`${p.b}`],tot:`l = ${p.a+p.b}`}),
 text:p=>`Der Fräsdorn ist in A und B gelagert. Er wird durch die Schnittkraft ${f('F = '+fmt(p.F)+' kN')} belastet. Sie greift ${l(p.a+' mm')} von A und ${l(p.b+' mm')} von B an. Wie gross sind die Kräfte in den Lagern A und B? (Im Bauteilbild drückt F nach oben, die Lager halten nach unten. Für die Beträge spielt das keine Rolle.)`+BW(p),
 asks:p=>[{k:'F_A',unit:'kN',v:p.F*p.b/(p.a+p.b)},{k:'F_B',unit:'kN',v:p.F*p.a/(p.a+p.b)}],
 hints:p=>['Ersatzbild: Der Dorn ist ein Träger auf zwei Stützen. Lagerabstand l = '+(p.a+p.b)+' mm.','Drehpunkt in A: F_B · l = F · '+p.a+' mm','F_A = F − F_B'],
 sol:p=>{const L=p.a+p.b,FB=p.F*p.a/L;return [`${eq(l('l = '+p.a+' mm + '+p.b+' mm = '+L+' mm'))}`,`Drehpunkt in A: ${eq(f('F_B')+' = '+fmt(p.F)+' kN · '+p.a+' mm : '+L+' mm = '+f(fmt(FB,3)+' kN'))}`,`${eq(f('F_A')+' = '+fmt(p.F)+' kN − '+fmt(FB,3)+' kN = '+f(fmt(p.F-FB,3)+' kN'))}`,'Kehrt man alle Kräfte um, bleiben die Beträge gleich. Darum darf man das Ersatzbild «normal» zeichnen.'];}},
{id:'b4',lvl:2,title:'Umlenkrolle mit Pendelstange',
 gen:bk({F:1500},()=>({F:rng(800,3000,100)})),
 draw:p=>drawUmlenk(p),
 text:p=>`Ein Zugseil wird über eine Rolle um 90° umgelenkt. Beide Seilenden ziehen mit ${f('F = '+p.F+' N')}: eines waagrecht nach links, eines senkrecht nach oben. Die Rollenachse A wird von einer Pendelstange gehalten. Berechnen Sie a) die Belastung F_A der Rollenachse und b) den Winkel α, unter dem sich die Pendelstange zur Senkrechten einstellt.`+BW(p),
 asks:p=>[{k:'a) F_A',unit:'N',v:p.F*Math.SQRT2},{k:'b) α',unit:'°',v:45}],
 hints:p=>['Die Rolle hat nur eine Lagerstelle. Darum gilt das Gleichgewicht der Kräfte, nicht der Momente.','Die beiden Seilkräfte stehen rechtwinklig: F_A = √(F² + F²).','Eine Pendelstange kann nur Kräfte in ihrer Längsrichtung aufnehmen. Sie stellt sich in Richtung von F_A ein. Gleich grosse Seilkräfte ergeben 45°.'],
 sol:p=>[`Bauteil mit einer Lagerstelle: Die Lagerkraft hebt die Seilkräfte auf.`,`Krafteck (rechtwinklig): ${eq(f('F_A')+' = √('+f('F_x')+'² + '+f('F_y')+'²) = √('+p.F+'² + '+p.F+'²) N = '+f(fmt(p.F*Math.SQRT2)+' N'))}`,`Winkel: ${eq('tan α = '+f('F_x')+' : '+f('F_y')+' = '+p.F+' : '+p.F+' = 1')}, also ${eq('α = 45°')}`,'Die Pendelstange liegt genau auf der Wirkungslinie der Lagerkraft. Sonst würde sie sich drehen, bis sie es tut.'],
 solDraw:p=>drawUmlenk(p,{res:`Resultierende ${fmt(p.F*Math.SQRT2)} N`,al:'α = 45°'})},
{id:'b5',lvl:2,title:'Hebel mit Feder',
 gen:bk({F1:2800,F3:180,a:140,b:118},()=>({F1:rng(2000,4000,100),F3:rng(100,300,20),a:pick([120,140,160]),b:pick([100,118,130])})),
 draw:p=>drawHebel5(p),
 text:p=>`An einem Hebel drückt ein Bolzen rechts mit ${f('F_1 = '+fmt(p.F1/1000,2)+' kN')} nach unten. Eine Rückstellfeder um den Bolzen drückt mit ${f('F_3 = '+p.F3+' N')} dagegen. Der Hebel dreht im Lager A. Die Abstände sind ${l(p.a+' mm')} (links) und ${l(p.b+' mm')} (rechts). Berechnen Sie a) die Kraft F_2 am linken Ende und b) die Belastung F_A des Hebellagers.`+BW(p),
 asks:p=>{const R=p.F1-p.F3,F2=R*p.b/p.a;return [{k:'a) F_2',unit:'N',v:F2},{k:'b) F_A',unit:'N',v:F2+R}];},
 hints:p=>['Rechne zuerst die Kraft, die rechts wirklich auf den Hebel wirkt: F_1 − F_3. Achtung: F_1 in N umrechnen.','Drehpunkt in A: F_2 · '+p.a+' mm = (F_1 − F_3) · '+p.b+' mm','Lagerkraft: F_A = F_2 + (F_1 − F_3). Alle Kräfte am Hebel zeigen nach unten, A hält nach oben.'],
 sol:p=>{const R=p.F1-p.F3,F2=R*p.b/p.a;return [`Kraft rechts: ${eq(f('F_1')+' − '+f('F_3')+' = '+p.F1+' N − '+p.F3+' N = '+f(R+' N'))}`,`ΣM_l = ΣM_r um A: ${eq(f('F_2')+' · '+p.a+' mm = '+R+' N · '+p.b+' mm')}`,`${eq(f('F_2 = '+fmt(F2)+' N'))}`,`Kräftegleichgewicht: ${eq(f('F_A')+' = '+fmt(F2)+' N + '+R+' N = '+f(fmt(F2+R)+' N'))}`];}},
{id:'b6',lvl:2,title:'Winkelhebel: Lager mit zwei Teilkräften',
 gen:bk({F:10,h:95,c:120},()=>({F:rng(5,15,1),h:pick([80,95,110]),c:pick([100,120,150])})),
 draw:p=>drawWinkel(p),
 text:p=>`An einem Winkelhebel zieht die Kolbenkraft ${f('F = '+p.F+' kN')} waagrecht. Ihr Abstand zum Lager A ist ${l(p.h+' mm')}. Am anderen Arm wirkt senkrecht die Kraft F_1 im Abstand ${l(p.c+' mm')}. Berechnen Sie a) die Kraft F_1 und b) die Lagerkraft F_A.`+BW(p),
 asks:p=>{const F1=p.F*p.h/p.c;return [{k:'a) F_1',unit:'kN',v:F1},{k:'b) F_A',unit:'kN',v:Math.hypot(p.F,F1)}];},
 hints:p=>['Drehpunkt in A. Der Hebelarm von F ist senkrecht ('+p.h+' mm), der von F_1 waagrecht ('+p.c+' mm).','F · '+p.h+' mm = F_1 · '+p.c+' mm','Nur eine Lagerstelle: F_Ax = F und F_Ay = F_1. Sie stehen rechtwinklig: F_A = √(F_Ax² + F_Ay²).'],
 sol:p=>{const F1=p.F*p.h/p.c,FA=Math.hypot(p.F,F1);return [`ΣM_l = ΣM_r um A: ${eq(f('F')+' · '+l(p.h+' mm')+' = '+f('F_1')+' · '+l(p.c+' mm'))}`,`${eq(f('F_1')+' = '+p.F+' kN · '+p.h+' : '+p.c+' = '+f(fmt(F1,3)+' kN'))}`,`Teilkräfte im Lager: ${eq(f('F_Ax')+' = '+p.F+' kN')} (hält F) und ${eq(f('F_Ay')+' = '+fmt(F1,3)+' kN')} (hält F_1)`,`Krafteck: ${eq(f('F_A')+' = √('+p.F+'² + '+fmt(F1,3)+'²) kN = '+f(fmt(FA,3)+' kN'))}`];},
 solDraw:p=>drawWinkel(p,{F1:`F_1 = ${fmt(p.F*p.h/p.c,3)} kN`,FA:`F_A = ${fmt(Math.hypot(p.F,p.F*p.h/p.c),3)} kN`})},
{id:'b7',lvl:3,title:'Containerfahrzeug',
